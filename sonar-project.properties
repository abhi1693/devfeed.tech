sonar.exclusions=**/node_modules/**,**/.next/**,**/build/**,**/dist/**,**/.venv/**,reports/**,apps/admin/src/lib/api/generated/**,apps/admin/openapi.json,**/*.png,**/*.jpg,**/*.jpeg,**/*.webp,**/*.gif,**/*.ico,**/*.woff,**/*.woff2,**/*.ttf,**/*.zip

# Generator-owned API output and *.generated.* files may repeat descriptor tables;
# keep security analysis and coverage intact, and exempt only duplication metrics.
sonar.cpd.exclusions=**/src/lib/api/generated/**,**/*.generated.*

sonar.python.coverage.reportPaths=reports/coverage/python.xml
# Existing pytest JUnit reports provide project-level test counts on master.
sonar.python.xunit.reportPath=reports/python-*.xml
sonar.python.xunit.skipDetails=true
sonar.javascript.lcov.reportPaths=reports/coverage/partner/lcov.info,reports/coverage/web/lcov.info,reports/coverage/admin/lcov.info,reports/coverage/browser-budgets/lcov.info,reports/coverage/dast/lcov.info,reports/coverage/mutation/lcov.info,reports/coverage/property/lcov.info,reports/coverage/security/lcov.info
