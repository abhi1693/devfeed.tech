sonar.organization=abhi1693
sonar.projectKey=abhi1693_devfeed.tech
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
# PostgreSQL .sql scripts are not Oracle PL/SQL.
sonar.plsql.file.suffixes=.pks,.pkb
# Keep one analysis root so shared coverage and test paths resolve consistently.
sonar.scanner.autoconfig.enabled=false
# Upload success alone must not let a failing quality gate satisfy CI required.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Include infrastructure, load tests and root build files as well as application code.
# Test inclusions also exclude matching files from sources. List browser
# fixtures explicitly so DAST/live runtime drivers keep their c8 coverage.
# scripts/testing/adaptive_polling.py is a measured workload utility, not a fixture.
# tests/test_sonar_coverage.py requires every scripts/testing module to have a role.
sonar.sources=.
sonar.tests=tests,apps/web/tests,apps/admin/tests,apps/partner/tests,apps/extensions/tests,scripts/ci,scripts/testing
sonar.test.inclusions=tests/**,apps/*/tests/**,scripts/ci/**/*.test.mjs,\
