sonar.organization=abhi1693
sonar.projectKey=abhi1693_devfeed.tech
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Analyze application, shared, build and workflow code in one monorepo project.
sonar.sources=apps,packages,scripts,migrations,.github
sonar.tests=tests,apps/web/tests,apps/admin/tests,apps/extensions/tests
sonar.test.inclusions=tests/**,apps/*/tests/**
sonar.exclusions=**/node_modules/**,**/.next/**,**/build/**,**/dist/**,apps/admin/src/lib/api/generated/**,apps/admin/openapi.json

sonar.python.coverage.reportPaths=reports/coverage/python.xml
sonar.javascript.lcov.reportPaths=reports/coverage/web/lcov.info,reports/coverage/admin/lcov.info
