sonar.organization=abhi1693
sonar.projectKey=abhi1693_devfeed.tech
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
# PostgreSQL .sql scripts are not Oracle PL/SQL.
sonar.plsql.file.suffixes=.pks,.pkb
# Keep one analysis root so shared coverage and test paths resolve consistently.
sonar.scanner.autoconfig.enabled=false
# Upload success alone must not let a failing quality gate satisfy CI required.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Include infrastructure, load tests and root build files as well as application code.
# Test inclusions below also exclude those files from the source scope.
sonar.sources=.
sonar.tests=tests,apps/web/tests,apps/admin/tests,apps/extensions/tests,scripts/ci
sonar.test.inclusions=tests/**,apps/*/tests/**,scripts/ci/**/*.test.mjs
sonar.exclusions=**/node_modules/**,**/.next/**,**/build/**,**/dist/**,**/.venv/**,reports/**,apps/admin/src/lib/api/generated/**,apps/admin/openapi.json,**/*.png,**/*.jpg,**/*.jpeg,**/*.webp,**/*.gif,**/*.ico,**/*.woff,**/*.woff2,**/*.ttf,**/*.zip

sonar.python.coverage.reportPaths=reports/coverage/python.xml
# Existing pytest JUnit reports provide project-level test counts on master.
sonar.python.xunit.reportPath=reports/python-*.xml
sonar.python.xunit.skipDetails=true
sonar.javascript.lcov.reportPaths=reports/coverage/web/lcov.info,reports/coverage/admin/lcov.info,reports/coverage/browser-budgets/lcov.info
