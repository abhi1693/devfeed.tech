sonar.organization=abhi1693
sonar.projectKey=abhi1693_devfeed.tech
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12
# PostgreSQL .sql scripts are not Oracle PL/SQL.
sonar.plsql.file.suffixes=.pks,.pkb
# Keep one analysis root so shared coverage and test paths resolve consistently.
sonar.scanner.autoconfig.enabled=false
# Upload success alone must not let a failing quality gate satisfy CI required.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Include infrastructure, load tests and root build files as well as application code.
# Test inclusions also exclude matching files from sources. List browser
# fixtures explicitly so DAST/live runtime drivers keep their c8 coverage.
sonar.sources=.
sonar.tests=tests,apps/web/tests,apps/admin/tests,apps/extensions/tests,scripts/ci,scripts/testing
sonar.test.inclusions=tests/**,apps/*/tests/**,scripts/ci/**/*.test.mjs,\
  scripts/testing/article-grid.mjs,\
  scripts/testing/avatar-uploads.mjs,\
  scripts/testing/catalog-scroll.mjs,\
  scripts/testing/compact-loading.mjs,\
  scripts/testing/dev-card-promo.mjs,\
  scripts/testing/dev-card.mjs,\
  scripts/testing/extension-install.mjs,\
  scripts/testing/feed-preferences.mjs,\
  scripts/testing/feed-preparation.mjs,\
  scripts/testing/managed-images.mjs,\
  scripts/testing/mcp.mjs,\
  scripts/testing/must-reads.mjs,\
  scripts/testing/onboarding-topics.mjs,\
  scripts/testing/preview-background.mjs,\
  scripts/testing/profile-editor.mjs,\
  scripts/testing/reader-navigation.mjs,\
  scripts/testing/reading-streak.mjs,\
  scripts/testing/search-filters.mjs,\
  scripts/testing/select-menus.mjs,\
  scripts/testing/sidebar-github.mjs,\
  scripts/testing/sign-in.mjs,\
  scripts/testing/sign-in.py,\
  scripts/testing/topic-follow.mjs
sonar.exclusions=**/node_modules/**,**/.next/**,**/build/**,**/dist/**,**/.venv/**,reports/**,apps/admin/src/lib/api/generated/**,apps/admin/openapi.json,**/*.png,**/*.jpg,**/*.jpeg,**/*.webp,**/*.gif,**/*.ico,**/*.woff,**/*.woff2,**/*.ttf,**/*.zip

sonar.python.coverage.reportPaths=reports/coverage/python.xml
# Existing pytest JUnit reports provide project-level test counts on master.
sonar.python.xunit.reportPath=reports/python-*.xml
sonar.python.xunit.skipDetails=true
sonar.javascript.lcov.reportPaths=reports/coverage/web/lcov.info,reports/coverage/admin/lcov.info,reports/coverage/browser-budgets/lcov.info,reports/coverage/dast/lcov.info,reports/coverage/mutation/lcov.info,reports/coverage/property/lcov.info
