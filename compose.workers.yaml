# One independently sized deployment per priority. Requires the new routing runtime.
# docker compose -f compose.yaml -f compose.workers.yaml --profile workers --profile ai up -d
services:
  high-worker:
    profiles: [workers]
    scale: ${DEVFEED_HIGH_WORKER_REPLICAS:-4}
  default-worker:
    profiles: [workers]
    scale: ${DEVFEED_DEFAULT_WORKER_REPLICAS:-4}
  low-worker:
    profiles: [workers]
    scale: ${DEVFEED_LOW_WORKER_REPLICAS:-1}

  # Retain scoped Images credentials and the external isolated solver runtime.
  # Optional dedicated consumers can be re-enabled with a routing override.
  worker:
    scale: 0
  codex-client:
    scale: 0
  article-analysis-worker:
    scale: 0
  relationships-worker:
    scale: 0
  topic-analysis-worker:
    scale: 0
  research-verification-worker:
    scale: 0
  source-analysis-worker:
    scale: 0
  ingestion-worker:
    scale: 0
  source-discovery-worker:
    scale: 0
  article-enrichment-worker:
    scale: 0
  source-enrichment-worker:
    scale: 0
  notifications-worker:
    scale: 0
