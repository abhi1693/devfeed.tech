[project]
name = "devfeed-mcp"
version = "0.1.5"
description = "Model Context Protocol server for DevFeed discovery and OAuth account access"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.1,<1",
  "redis>=8.1.0,<9",
  "mcp>=2.3.0,<3",
  "pydantic-settings>=2.16.1,<3",
  "starlette>=1.9.0,<2",
  "uvicorn[standard]>=0.54.0,<1",
]

[build-system]
requires = ["setuptools>=84.2.1,<85"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
devfeed_mcp = "src"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" }, { file = "src/**/*.py" },
  { file = "src/py.typed" }, { dir = "build" },
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["devfeed_mcp"]
