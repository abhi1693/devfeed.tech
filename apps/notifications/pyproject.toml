[project]
name = "devfeed-notifications"
version = "0.0.2"
description = "Audience-aware Chimely delivery adapter for the common RQ workers"
requires-python = ">=3.12"
dependencies = ["devfeed-core", "rq>=2.3,<3", "httpx>=0.28,<1"]

[build-system]
requires = ["setuptools>=80,<85"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
devfeed_notifications = "src"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" }, { file = "src/**/*.py" },
  { file = "src/py.typed" }, { dir = "build" },
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["devfeed_notifications"]
