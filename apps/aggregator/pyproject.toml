[project]
name = "devfeed-aggregator"
version = "0.1.6"
description = "Scheduled RSS and Atom ingestion workers"
requires-python = ">=3.12"
dependencies = [
  "devfeed-core",
  "rq>=2.12.0,<3",
]

[project.optional-dependencies]
notifications = ["devfeed-notifications"]
article-enrichment = ["lingua-language-detector>=2.2.0,<3", "trafilatura>=2.3.1,<3"]
images = ["devfeed-core[images,storage]", "cairosvg>=2.9.1,<3"]
ai = ["websockets>=17.3,<18"]
all-workers = [
  "devfeed-notifications",
  "lingua-language-detector>=2.2.0,<3",
  "trafilatura>=2.3.1,<3",
  "websockets>=17.3,<18",
  "devfeed-core[images,storage]",
  "cairosvg>=2.9.1,<3",
]

[project.scripts]
devfeed-worker = "devfeed_aggregator.worker:main"
devfeed-scheduler = "devfeed_aggregator.scheduler:main"

[build-system]
requires = ["setuptools>=84.2.1,<85"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
devfeed_aggregator = "src"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" }, { file = "src/**/*.py" },
  { file = "src/py.typed" }, { dir = "build" },
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["devfeed_aggregator"]
