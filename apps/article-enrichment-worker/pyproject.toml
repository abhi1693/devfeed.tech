[project]
name = "devfeed-article-enrichment-worker"
version = "0.0.42"
description = "Dedicated durable article page enrichment worker"
requires-python = ">=3.12"
dependencies = ["devfeed-aggregator[article-enrichment]"]

[project.scripts]
devfeed-article-enrichment-worker = "devfeed_article_enrichment_worker.main:main"

[build-system]
requires = ["setuptools>=80,<85"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
devfeed_article_enrichment_worker = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }, { file = "src/py.typed" }]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["devfeed_article_enrichment_worker"]
