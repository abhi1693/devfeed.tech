[project]
name = "devfeed-admin-api"
version = "0.1.3"
description = "Isolated DevFeed administration and OIDC service"
requires-python = ">=3.12"
dependencies = [
    "devfeed-core", "devfeed-http[identity,uploads]", "fastapi>=0.161.0,<1", "uvicorn[standard]>=0.54.0,<1",
    "websockets>=17.3,<18", "rq>=2.12.0,<3",
]

[build-system]
requires = ["setuptools>=84.2.1,<85"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
devfeed_admin_api = "src"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" }, { file = "src/**/*.py" },
  { file = "src/py.typed" }, { dir = "build" },
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["devfeed_admin_api"]
