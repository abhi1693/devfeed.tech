[project]
name = "devfeed-admin-api"
version = "0.0.5"
description = "Isolated DevFeed administration and OIDC service"
requires-python = ">=3.12"
dependencies = [
    "devfeed-core", "devfeed-http[identity]", "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
    "websockets>=15,<18",
]

[build-system]
requires = ["setuptools>=80,<85"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
devfeed_admin_api = "src"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" }, { file = "src/**/*.py" },
  { file = "src/py.typed" }, { dir = "build" },
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["devfeed_admin_api"]
