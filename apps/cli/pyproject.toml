[project]
name = "devfeed-cli"
version = "0.0.1"
description = "Command-line tools for feed submission and ingestion operations"
requires-python = ">=3.12"
dependencies = ["devfeed-core", "devfeed-aggregator"]

[project.scripts]
devfeed = "devfeed_cli.main:main"

[build-system]
requires = ["setuptools>=80,<85"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
devfeed_cli = "src"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" }, { file = "src/**/*.py" },
  { file = "src/py.typed" }, { dir = "build" },
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["devfeed_cli"]
