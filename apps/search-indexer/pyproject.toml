[project]
name = "devfeed-search-indexer"
version = "0.0.42"
description = "Durable Typesense index projection worker"
requires-python = ">=3.12"
dependencies = ["devfeed-core"]

[project.scripts]
devfeed-search-indexer = "devfeed_search_indexer.main:main"

[build-system]
requires = ["setuptools>=80,<85"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
devfeed_search_indexer = "src"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" }, { file = "src/**/*.py" },
  { file = "src/py.typed" }, { dir = "build" },
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["devfeed_search_indexer"]
