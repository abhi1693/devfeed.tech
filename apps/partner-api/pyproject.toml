[project]
name = "devfeed-partner-api"
version = "0.0.51"
description = "Isolated DevFeed partner portal and OIDC service"
requires-python = ">=3.12"
dependencies = [
    "devfeed-core", "devfeed-http[identity]", "fastapi>=0.142.2,<1", "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["setuptools>=80,<85"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
devfeed_partner_api = "src"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" }, { file = "src/**/*.py" },
  { file = "src/py.typed" }, { dir = "build" },
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["devfeed_partner_api"]
