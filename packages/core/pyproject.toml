[project]
name = "devfeed-core"
version = "0.1.7"
description = "Shared persistence, configuration and domain services"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.1.6,<2.2",
  "psycopg[binary]>=3.3.6,<4",
  "alembic>=1.20.1,<2",
  "pydantic-settings>=2.16.1,<3",
  "redis>=8.1.0,<9",
  "pydantic>=2.14.1,<3",
  "feedparser>=6.0.14,<7",
  "httpcore>=1.0.9,<2",
  "clickhouse-connect[async]>=1.11,<2",
  "pyyaml>=6.0.3,<7",
  "markdown-it-py>=4.2.0,<5",
  "prometheus-client>=0.26.0,<1",
  "opentelemetry-api>=1.45.1,<2",
  "opentelemetry-sdk>=1.45.1,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.45.1,<2",
  "opentelemetry-exporter-prometheus>=0.66b1,<1",
  "pyroscope-io>=1.4.0,<2",
  "protego>=0.7.0,<0.8",
  "cryptography>=50.0.2,<51",
]

[project.optional-dependencies]
images = ["pillow>=13.0.0,<14"]
storage = ["boto3>=1.43.118,<2"]

[build-system]
requires = ["setuptools>=84.2.1,<85"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
script-files = ["src/devfeed-worker-health"]

[tool.setuptools.package-dir]
devfeed_core = "src"

[tool.setuptools.package-data]
devfeed_core = ["py.typed", "clickhouse_migrations/*.sql"]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" }, { file = "src/**/*.py" }, { file = "src/**/*.sql" },
  { file = "src/devfeed-worker-health" },
  { file = "src/py.typed" }, { dir = "build" },
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["devfeed_core"]
