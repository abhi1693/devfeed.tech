[project]
name = "devfeed-core"
version = "0.0.42"
description = "Shared persistence, configuration and domain services"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0.40,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "pydantic-settings>=2.8,<3",
  "redis>=5.2,<9",
  "pydantic>=2.8,<3",
  "feedparser>=6.0.11,<7",
  "httpcore>=1.0.9,<2",
  "pyyaml>=6,<7",
  "markdown-it-py>=4.2,<5",
  "prometheus-client>=0.22,<1",
  "opentelemetry-api>=1.38,<2",
  "opentelemetry-sdk>=1.38,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.38,<2",
  "pyroscope-io>=1.0.3,<2",
  "protego>=0.6.2,<0.7",
]

[build-system]
requires = ["setuptools>=80,<85"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
devfeed_core = "src"

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" }, { file = "src/**/*.py" },
  { file = "src/py.typed" }, { dir = "build" },
]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["devfeed_core"]
