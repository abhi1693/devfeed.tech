[project]
name = "devfeed-http"
version = "0.0.1"
description = "Shared HTTP integration for independently deployed DevFeed APIs"
requires-python = ">=3.12"
dependencies = ["devfeed-core", "fastapi>=0.142.2,<1"]

[project.optional-dependencies]
identity = ["httpx>=0.28,<1", "PyJWT[crypto]>=2.10,<3"]
uploads = ["boto3>=1.40,<2", "pillow>=11.3,<13", "python-multipart>=0.0.20,<1"]

[build-system]
requires = ["setuptools>=80,<85"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
devfeed_http = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }, { file = "src/py.typed" }, { dir = "build" }]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["devfeed_http"]
