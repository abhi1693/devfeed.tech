[project]
name = "devfeed-http"
version = "0.0.1"
description = "Shared HTTP integration for independently deployed DevFeed APIs"
requires-python = ">=3.12"
dependencies = ["devfeed-core", "fastapi>=0.161.0,<1"]

[project.optional-dependencies]
identity = ["httpx>=0.28.1,<1", "PyJWT[crypto]>=2.15.1,<3"]
uploads = ["devfeed-core[images,storage]", "python-multipart>=0.0.32,<1"]

[build-system]
requires = ["setuptools>=84.2.1,<85"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
devfeed_http = "src"

[tool.setuptools.package-data]
devfeed_http = ["py.typed", "reader-destinations.json"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }, { file = "src/**/*.json" }, { file = "src/py.typed" }, { dir = "build" }]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["devfeed_http"]
