name: devfeed

x-postgres-image: &postgres-image postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2

x-runtime: &runtime
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-core-environment: &core-environment
  # Use a hex password so it is safe inside this connection URL.
  DEVFEED_DATABASE_URL: ${DEVFEED_DATABASE_URL:-postgresql+psycopg://devfeed:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/devfeed}
  DEVFEED_REDIS_URL: ${DEVFEED_REDIS_URL:-redis://redis:6379/0}
  DEVFEED_LOG_LEVEL: ${DEVFEED_LOG_LEVEL:-INFO}
  DEVFEED_LOG_FORMAT: ${DEVFEED_LOG_FORMAT:-json}
  # Resolve optional settings from .env/the shell; absent keys use app defaults.
  DEVFEED_CORS_ORIGINS:
  DEVFEED_JOB_LOG_MAX_ENTRIES:
  DEVFEED_JOB_LOG_TTL_SECONDS:
  DEVFEED_FEED_USER_AGENT:
  DEVFEED_FEED_MAX_BYTES:
  DEVFEED_FEED_MAX_ENTRIES:
  DEVFEED_FEED_TIMEOUT_SECONDS:
  DEVFEED_PAGE_MAX_BYTES:
  DEVFEED_ARTICLE_PAGE_MAX_BYTES:
  DEVFEED_SOURCE_PAGE_MAX_BYTES:
  DEVFEED_PAGE_TIMEOUT_SECONDS:
  DEVFEED_SCHEDULER_BATCH_SIZE:
  DEVFEED_CACHE_ENABLED:
  DEVFEED_CACHE_TTL_SECONDS:
  DEVFEED_CACHE_METADATA_TTL_SECONDS:
  DEVFEED_CACHE_MAX_BYTES:
  DEVFEED_AI_ENABLED:
  DEVFEED_AUTO_APPROVE_TOPICS:
  DEVFEED_AUTO_APPROVE_TOPIC_RELATIONSHIPS:
  DEVFEED_AUTO_RESEARCH_IMPORTS:
  DEVFEED_FULL_AUTOMATION:
  DEVFEED_TOPIC_CORRECTION_MAX_ATTEMPTS:
  DEVFEED_AUTO_REANALYZE_TOPICS:
  DEVFEED_AUTO_RESEARCH_RELATIONSHIPS:
  DEVFEED_AUTO_LINK_TAGS:
  DEVFEED_RELATIONSHIP_RESEARCH_BATCH_SIZE:
  DEVFEED_RELATIONSHIP_RESEARCH_MAX_PENDING:
  DEVFEED_AUTOMATION_BATCH_SIZE:
  DEVFEED_ANALYSIS_MAX_CANDIDATES:
  DEVFEED_ANALYSIS_FALLBACK_CANDIDATES:
  DEVFEED_AI_CAPACITY_COOLDOWN_SECONDS:
  DEVFEED_EVIDENCE_TIMEOUT_SECONDS:
  DEVFEED_CODEX_APP_SERVER_URL:
  DEVFEED_CODEX_MODEL:
  DEVFEED_CODEX_AUTH_TOKEN:
  DEVFEED_CODEX_TIMEOUT_SECONDS:
  DEVFEED_NOTIFICATIONS_ENABLED:
  DEVFEED_CHIMELY_USER_ENVIRONMENT: ${DEVFEED_CHIMELY_USER_ENVIRONMENT:-devfeed-users}

x-chimely-environment: &chimely-environment
  DEVFEED_CHIMELY_API_URL: ${DEVFEED_CHIMELY_API_URL:-http://chimely:8080}
  DEVFEED_CHIMELY_ADMIN_ENVIRONMENT:
  DEVFEED_CHIMELY_USER_ENVIRONMENT: ${DEVFEED_CHIMELY_USER_ENVIRONMENT:-devfeed-users}

x-host-access: &host-access
  # Also support host services on Docker Engine for Linux.
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-backend: &backend
  <<: [*runtime, *host-access]
  image: ${DEVFEED_BACKEND_IMAGE:-ghcr.io/abhi1693/devfeed.tech/backend:master}
  environment: *core-environment
  networks: [default, data]

x-ready: &ready
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

x-worker-runtime: &worker-runtime
  # A container keeps its hostname across restarts. RQ registrations can outlive
  # an interrupted process, so give every startup its own identity.
  command:
    - sh
    - -ec
    - |
      worker_name="$$HOSTNAME-$$(python -c 'import uuid; print(uuid.uuid4().hex)')"
      printf '%s' "$$worker_name" > /tmp/devfeed-worker-name
      exec devfeed worker --queue "$${DEVFEED_WORKER_QUEUE:-all}" --name "$$worker_name"
  healthcheck:
    <<: *healthcheck
    test: [CMD, python, -c, "import os; from pathlib import Path; from redis import Redis; name = Path('/tmp/devfeed-worker-name').read_text().strip(); r = Redis.from_url(os.environ['DEVFEED_REDIS_URL']); assert name and r.exists('rq:worker:' + name) and not r.hexists('rq:worker:' + name, 'death')"]

services:
  postgres:
    image: *postgres-image
    restart: unless-stopped
    environment:
      POSTGRES_USER: devfeed
      POSTGRES_DB: devfeed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 stores its versioned data directory under this mount.
      - postgres-data:/var/lib/postgresql
    networks: [data]
    shm_size: 128mb
    healthcheck:
      <<: *healthcheck
      test: [CMD, pg_isready, -U, devfeed, -d, devfeed]
      interval: 5s

  redis:
    image: redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec, --maxmemory-policy, noeviction]
    volumes:
      - redis-data:/data
    networks: [data]
    healthcheck:
      <<: *healthcheck
      test: [CMD, redis-cli, ping]
      interval: 5s

  migrate:
    <<: *backend
    restart: "no"
    command: [devfeed, db, upgrade]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    <<: *backend
    environment:
      <<: *core-environment
      DEVFEED_SEARCH_ENABLED: ${DEVFEED_SEARCH_ENABLED:-false}
      DEVFEED_SEARCH_URL: ${DEVFEED_SEARCH_URL:-http://typesense:8108}
      DEVFEED_SEARCH_QUERY_KEY: ${DEVFEED_SEARCH_QUERY_KEY:-}
      DEVFEED_SEARCH_COLLECTION_PREFIX: ${DEVFEED_SEARCH_COLLECTION_PREFIX:-devfeed}
    depends_on: *ready
    ports:
      - target: 8000
        published: "${DEVFEED_API_PORT:-8000}"
        host_ip: "${DEVFEED_BIND_IP:-0.0.0.0}"
    healthcheck:
      <<: *healthcheck
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).close()"]

  typesense:
    <<: *runtime
    profiles: [search]
    image: typesense/typesense:30.2@sha256:610f2d34b1f93d00762869da2c67736775e5798d19a2c8b91b014b8a0cc1e110
    command: [--data-dir=/data]
    environment:
      TYPESENSE_API_KEY: ${DEVFEED_SEARCH_ADMIN_KEY:-}
    volumes:
      - search-data:/data
    networks: [data]
    healthcheck:
      <<: *healthcheck
      test: [CMD, bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/8108; printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; read -r status <&3; [[ $$status == *' 200 '* ]]"]

  search-indexer:
    <<: *backend
    profiles: [search]
    command: [sh, -ec, "devfeed search setup && exec devfeed search worker"]
    environment:
      DEVFEED_DATABASE_URL: ${DEVFEED_DATABASE_URL:-postgresql+psycopg://devfeed:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/devfeed}
      DEVFEED_REDIS_URL: ${DEVFEED_REDIS_URL:-redis://redis:6379/0}
      DEVFEED_LOG_FORMAT: ${DEVFEED_LOG_FORMAT:-json}
      DEVFEED_SEARCH_ENABLED: "true"
      DEVFEED_SEARCH_URL: ${DEVFEED_SEARCH_URL:-http://typesense:8108}
      DEVFEED_SEARCH_ADMIN_KEY: ${DEVFEED_SEARCH_ADMIN_KEY:-}
      DEVFEED_SEARCH_QUERY_KEY: ${DEVFEED_SEARCH_QUERY_KEY:-}
      DEVFEED_SEARCH_COLLECTION_PREFIX: ${DEVFEED_SEARCH_COLLECTION_PREFIX:-devfeed}
      DEVFEED_SEARCH_INDEX_BATCH_SIZE: ${DEVFEED_SEARCH_INDEX_BATCH_SIZE:-200}
    depends_on:
      <<: *ready
      typesense:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: [CMD, python, -c, "import time; from pathlib import Path; assert time.time() - float(Path('/tmp/devfeed-search-heartbeat').read_text()) < 120"]

  worker:
    <<: [*backend, *worker-runtime]
    entrypoint: [python, /opt/devfeed/chimely-consumer.py, worker]
    volumes:
      - ./infra/chimely/consumer.py:/opt/devfeed/chimely-consumer.py:ro
      - chimely-worker-credentials:/run/devfeed-chimely:ro
    # Service-level scale survives Compose 2.38 watch rebuilds; deploy.replicas does not.
    scale: ${DEVFEED_WORKER_REPLICAS:-2}
    # Keep AI enabled so ingestion queues analysis, even with a dedicated consumer.
    environment:
      <<: [*core-environment, *chimely-environment]
      DEVFEED_WORKER_QUEUE: ${DEVFEED_WORKER_QUEUE:-all}
      # Only delivery workers need Chimely management API keys.
      DEVFEED_CHIMELY_ADMIN_API_KEY:
      DEVFEED_CHIMELY_USER_API_KEY:
    depends_on:
      <<: *ready
      chimely-provision:
        condition: service_completed_successfully
    # Give an in-flight RQ job time to finish before Docker sends SIGKILL.
    stop_grace_period: 10m

  scheduler:
    <<: *backend
    depends_on: *ready
    command: [devfeed, scheduler]
    healthcheck:
      <<: *healthcheck
      test: [CMD, python, -c, "import os; from redis import Redis; r = Redis.from_url(os.environ['DEVFEED_REDIS_URL']); assert r.exists('devfeed:scheduler:heartbeat')"]

  admin-api:
    <<: [*runtime, *host-access]
    image: ${DEVFEED_ADMIN_API_IMAGE:-ghcr.io/abhi1693/devfeed.tech/admin-api:master}
    entrypoint: [python, /opt/devfeed/chimely-consumer.py, admin]
    # An explicit command retains the image startup when Compose replaces ENTRYPOINT.
    command: [uvicorn, devfeed_admin_api.main:app, --host, 0.0.0.0, --port, "8001", --no-proxy-headers, --no-access-log]
    depends_on:
      <<: *ready
      chimely-provision:
        condition: service_completed_successfully
    networks: [default, data]
    # Account RPC only; ChatGPT credentials remain private to codex-server.
    # No dependency on the AI profile: admin must stay reachable during an outage.
    volumes:
      - codex-socket:/run/codex:ro
      - ./infra/chimely/consumer.py:/opt/devfeed/chimely-consumer.py:ro
      - chimely-admin-credentials:/run/devfeed-chimely:ro
    environment:
      <<: [*core-environment, *chimely-environment]
      # The inbox API uses its HMAC secret, never the management API key.
      DEVFEED_CHIMELY_ADMIN_HMAC_SECRET:
      DEVFEED_ADMIN_BASE_URL: ${DEVFEED_ADMIN_BASE_URL:-http://localhost:${DEVFEED_ADMIN_PORT:-3001}}
      DEVFEED_ADMIN_COOKIE_SECURE: ${DEVFEED_ADMIN_COOKIE_SECURE:-false}
      # Unset values stay absent, rather than becoming invalid empty URLs.
      # Compose resolves these from the shell or the root .env file.
      DEVFEED_OIDC_ISSUER_URL:
      DEVFEED_OIDC_CLIENT_ID:
      DEVFEED_OIDC_CLIENT_SECRET:
      DEVFEED_OIDC_ORGANIZATION_ID:
      DEVFEED_OIDC_TOKEN_ENDPOINT_AUTH_METHOD:
      DEVFEED_OIDC_SCOPES:
      DEVFEED_OIDC_ORGANIZATION_SCOPE_TEMPLATE:
      DEVFEED_OIDC_ORGANIZATION_CLAIM:
      DEVFEED_OIDC_ROLES_CLAIM:
      DEVFEED_OIDC_ROLES_FORMAT:
      DEVFEED_OIDC_ROLE_SCOPE_TEMPLATE:
      DEVFEED_ADMIN_REQUIRED_ROLE:
      DEVFEED_ADMIN_SESSION_TTL_SECONDS:
    healthcheck:
      <<: *healthcheck
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3).close()"]

  user-api:
    <<: [*runtime, *host-access]
    image: ${DEVFEED_USER_API_IMAGE:-ghcr.io/abhi1693/devfeed.tech/user-api:master}
    entrypoint: [python, /opt/devfeed/chimely-consumer.py, user]
    command: [uvicorn, devfeed_user_api.main:app, --host, 0.0.0.0, --port, "8002", --no-proxy-headers, --no-access-log]
    depends_on:
      <<: *ready
      chimely-provision:
        condition: service_completed_successfully
    volumes:
      - ./infra/chimely/consumer.py:/opt/devfeed/chimely-consumer.py:ro
      - chimely-user-credentials:/run/devfeed-chimely:ro
    networks: [default, data]
    environment:
      <<: *chimely-environment
      DEVFEED_NOTIFICATIONS_ENABLED:
      DEVFEED_CHIMELY_USER_HMAC_SECRET:
      # Only user inbox signing, persistence and user identity settings.
      DEVFEED_DATABASE_URL: ${DEVFEED_DATABASE_URL:-postgresql+psycopg://devfeed:${POSTGRES_PASSWORD}@postgres:5432/devfeed}
      DEVFEED_REDIS_URL: ${DEVFEED_REDIS_URL:-redis://redis:6379/0}
      DEVFEED_LOG_LEVEL:
      DEVFEED_LOG_FORMAT:
      DEVFEED_USER_BASE_URL: ${DEVFEED_USER_BASE_URL:-http://localhost:${DEVFEED_WEB_PORT:-3000}}
      DEVFEED_USER_COOKIE_SECURE: ${DEVFEED_USER_COOKIE_SECURE:-false}
      DEVFEED_USER_SESSION_TTL_SECONDS:
      DEVFEED_USER_OIDC_ISSUER_URL:
      DEVFEED_USER_OIDC_CLIENT_ID:
      DEVFEED_USER_OIDC_CLIENT_SECRET:
      DEVFEED_USER_OIDC_TOKEN_ENDPOINT_AUTH_METHOD:
      DEVFEED_USER_OIDC_SCOPES:
      DEVFEED_USER_OIDC_ORGANIZATION_ID:
      DEVFEED_USER_OIDC_ORGANIZATION_SCOPE_TEMPLATE:
      DEVFEED_USER_OIDC_ORGANIZATION_CLAIM:
    healthcheck:
      <<: *healthcheck
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/ready', timeout=3).close()"]

  web:
    <<: *runtime
    image: ${DEVFEED_WEB_IMAGE:-ghcr.io/abhi1693/devfeed.tech/web:master}
    depends_on:
      api:
        condition: service_healthy
    networks: [default]
    environment:
      DEVFEED_PUBLIC_API_URL: http://api:8000
      DEVFEED_USER_API_URL: http://user-api:8002
      DEVFEED_USER_BASE_URL: ${DEVFEED_USER_BASE_URL:-http://localhost:${DEVFEED_WEB_PORT:-3000}}
    ports:
      - target: 3000
        published: "${DEVFEED_WEB_PORT:-3000}"
        host_ip: "${DEVFEED_BIND_IP:-0.0.0.0}"
    healthcheck:
      <<: *healthcheck
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000', {signal: AbortSignal.timeout(10000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      timeout: 12s

  admin:
    <<: *runtime
    image: ${DEVFEED_ADMIN_IMAGE:-ghcr.io/abhi1693/devfeed.tech/admin:master}
    depends_on:
      admin-api:
        condition: service_healthy
    networks: [default]
    environment:
      # The web container receives no database, Redis or OIDC credentials.
      DEVFEED_ADMIN_API_URL: http://admin-api:8001
      DEVFEED_ADMIN_BASE_URL: ${DEVFEED_ADMIN_BASE_URL:-http://localhost:${DEVFEED_ADMIN_PORT:-3001}}
    ports:
      - target: 3000
        published: "${DEVFEED_ADMIN_PORT:-3001}"
        host_ip: "${DEVFEED_BIND_IP:-0.0.0.0}"
    healthcheck:
      <<: *healthcheck
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/login', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]

  chimely-db-init:
    <<: *runtime
    image: *postgres-image
    restart: "no"
    user: postgres
    command: [psql, -X, --no-password, --set, ON_ERROR_STOP=1, --file, /init-chimely.sql]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: devfeed
      PGDATABASE: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # Optional separate database password; defaults to the PostgreSQL password.
      CHIMELY_POSTGRES_PASSWORD: ${CHIMELY_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}}
    volumes:
      - ./infra/postgres/init-chimely.sql:/init-chimely.sql:ro
    networks: [data]

  chimely:
    <<: *runtime
    image: ghcr.io/dodopayments/chimely:0.2.2@sha256:9a0f49ff99c3f7a587e8e2348379b0645306eb919bdb83ff54bf6cf900526a60
    depends_on:
      postgres:
        condition: service_healthy
      chimely-db-init:
        condition: service_completed_successfully
    networks: [default, data]
    environment:
      DATABASE_URL: postgres://chimely:${CHIMELY_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}}@postgres:5432/chimely
      CHIMELY_LISTEN_ADDR: 0.0.0.0:8080
      CHIMELY_ADMIN_EMAIL: ${CHIMELY_ADMIN_EMAIL:-}
      CHIMELY_ADMIN_PASSWORD: ${CHIMELY_ADMIN_PASSWORD:-}
      CHIMELY_ADMIN_TLS_TERMINATED: ${CHIMELY_ADMIN_TLS_TERMINATED:-false}
      CHIMELY_IDEMPOTENCY_RETENTION_DAYS: 30
      CHIMELY_SSE_PING_SECS: 10
      CHIMELY_LOG_FORMAT: ${DEVFEED_LOG_FORMAT:-json}
      RUST_LOG: info
    ports:
      - target: 8080
        published: "${CHIMELY_PORT:-8082}"
        host_ip: "${DEVFEED_BIND_IP:-0.0.0.0}"
    healthcheck:
      <<: *healthcheck
      test: [CMD, bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3; read -r status <&3; [[ \"$$status\" == *' 200 '* ]]"]
      interval: 5s

  chimely-provision:
    <<: *runtime
    image: python:3.12-alpine3.24@sha256:b64631e04e4920160c50fbe8d8df828f7f35f06f425cb44aa09bca53e708a35a
    restart: "no"
    # Only this one-off job can write both credential volumes. Files belong to
    # the app UID; group root lets subsequent provisioning reuse issued keys.
    user: "0:0"
    cap_add: [CHOWN]
    command: [python, /opt/devfeed/provision.py]
    depends_on:
      chimely:
        condition: service_healthy
    networks: [default]
    environment:
      <<: *chimely-environment
      DEVFEED_NOTIFICATIONS_ENABLED:
      CHIMELY_ADMIN_EMAIL: ${CHIMELY_ADMIN_EMAIL:-}
      CHIMELY_ADMIN_PASSWORD: ${CHIMELY_ADMIN_PASSWORD:-}
      CHIMELY_ADMIN_TLS_TERMINATED: ${CHIMELY_ADMIN_TLS_TERMINATED:-false}
      DEVFEED_CHIMELY_ADMIN_API_KEY:
      DEVFEED_CHIMELY_USER_API_KEY:
    volumes:
      - ./infra/chimely/provision.py:/opt/devfeed/provision.py:ro
      - chimely-worker-credentials:/credentials/worker
      - chimely-admin-credentials:/credentials/admin
      - chimely-user-credentials:/credentials/user

  codex-server:
    <<: [*runtime, *host-access]
    profiles: [ai]
    image: devfeed/codex:local
    build:
      context: .
      dockerfile: infra/codex/Dockerfile
    # Model credentials live only here. No repository or host Codex home mount.
    volumes:
      - codex-auth:/var/lib/codex
      - codex-socket:/run/codex
    # A private socket bridge forwards to Codex's container-local loopback listener.
    networks: [default]
    healthcheck:
      <<: *healthcheck
      test: [CMD, node, /opt/devfeed/health.cjs]
      interval: 5s

  codex-client:
    <<: [*backend, *worker-runtime]
    profiles: [ai]
    scale: ${DEVFEED_CODEX_CLIENT_REPLICAS:-1}
    environment:
      <<: *core-environment
      DEVFEED_WORKER_QUEUE: analysis
    depends_on:
      <<: *ready
      codex-server:
        condition: service_healthy
    # Only the socket is shared; sign-in credentials remain in the server volume.
    volumes:
      - codex-socket:/run/codex:ro
    stop_grace_period: 3m

networks:
  default:
  data:
    internal: true

volumes:
  search-data:
  postgres-data:
  redis-data:
  codex-auth:
  codex-socket:
  chimely-worker-credentials:
  chimely-admin-credentials:
  chimely-user-credentials:
