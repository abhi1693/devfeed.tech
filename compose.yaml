name: ${DEVFEED_PRODUCT:-devfeed}

x-postgres-image: &postgres-image ${DEVFEED_IMAGE_REGISTRY:+${DEVFEED_IMAGE_REGISTRY}/docker.io/library/}postgres:18.6-alpine3.24@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2

x-runtime: &runtime
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-core-environment: &core-environment # Use a hex password so it is safe inside this connection URL.
  DEVFEED_PRODUCT: ${DEVFEED_PRODUCT:-devfeed}
  DEVFEED_DATABASE_URL: ${DEVFEED_DATABASE_URL:-postgresql+psycopg://devfeed:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/devfeed}
  DEVFEED_REDIS_URL: ${DEVFEED_REDIS_URL:-redis://redis:6379/0}
  DEVFEED_SITEMAP_REFRESH_SECONDS: ${DEVFEED_SITEMAP_REFRESH_SECONDS:-900}
  DEVFEED_SITEMAP_RETENTION_SECONDS: ${DEVFEED_SITEMAP_RETENTION_SECONDS:-86400}
  DEVFEED_LOG_LEVEL: ${DEVFEED_LOG_LEVEL:-INFO}
  DEVFEED_LOG_FORMAT: ${DEVFEED_LOG_FORMAT:-json}
  DEVFEED_METRICS_ENABLED:
  DEVFEED_METRICS_HOST:
  DEVFEED_METRICS_PORT:
  DEVFEED_TELEMETRY_ENVIRONMENT:
  DEVFEED_OTLP_ENDPOINT:
  OTEL_EXPORTER_OTLP_ENDPOINT:
  OTEL_EXPORTER_OTLP_HEADERS:
  OTEL_SDK_DISABLED:
  DEVFEED_TRACE_SAMPLE_RATIO:
  DEVFEED_PYROSCOPE_SERVER:
  DEVFEED_PROFILING_SAMPLE_RATE:
  # Resolve optional settings from .env/the shell; absent keys use app defaults.
  DEVFEED_DATABASE_POOL_ENABLED:
  DEVFEED_DATABASE_POOL_SIZE:
  DEVFEED_DATABASE_MAX_OVERFLOW:
  DEVFEED_DATABASE_POOL_TIMEOUT_SECONDS:
  DEVFEED_DATABASE_POOL_RECYCLE_SECONDS:
  DEVFEED_DATABASE_CONNECT_TIMEOUT_SECONDS:
  DEVFEED_DATABASE_KEEPALIVES_IDLE_SECONDS:
  DEVFEED_DATABASE_KEEPALIVES_INTERVAL_SECONDS:
  DEVFEED_DATABASE_KEEPALIVES_COUNT:
  DEVFEED_DATABASE_TCP_USER_TIMEOUT_MS:
  DEVFEED_CORS_ORIGINS:
  DEVFEED_JOB_LOG_MAX_ENTRIES:
  DEVFEED_JOB_LOG_TTL_SECONDS:
  DEVFEED_FEED_USER_AGENT:
  DEVFEED_FEED_MAX_BYTES:
  DEVFEED_FEED_MAX_ENTRIES:
  DEVFEED_FEED_TIMEOUT_SECONDS:
  DEVFEED_PAGE_MAX_BYTES:
  DEVFEED_ARTICLE_PAGE_MAX_BYTES:
  DEVFEED_SOURCE_PAGE_MAX_BYTES:
  DEVFEED_PAGE_TIMEOUT_SECONDS:
  DEVFEED_SCHEDULER_BATCH_SIZE:
  DEVFEED_SCHEDULER_CONNECTION_REUSE_ENABLED:
  DEVFEED_IMAGE_STORAGE_ENABLED: ${DEVFEED_IMAGE_STORAGE_ENABLED:-false}
  DEVFEED_IMAGE_PUBLIC_URL:
  DEVFEED_CACHE_ENABLED:
  DEVFEED_CACHE_TTL_SECONDS:
  DEVFEED_CACHE_METADATA_TTL_SECONDS:
  DEVFEED_CACHE_COMPRESS_WRITES:
  DEVFEED_CACHE_MAX_BYTES:
  DEVFEED_AI_ENABLED:
  DEVFEED_AI_CONTENT_NOT_BEFORE: ${DEVFEED_AI_CONTENT_NOT_BEFORE-2026-07-01}
  DEVFEED_AUTO_APPROVE_TOPICS:
  DEVFEED_AUTO_APPROVE_TOPIC_RELATIONSHIPS:
  DEVFEED_AUTO_RESEARCH_IMPORTS:
  DEVFEED_FULL_AUTOMATION:
  DEVFEED_PUBLISHED_ARTICLE_REFRESH_ENABLED: ${DEVFEED_PUBLISHED_ARTICLE_REFRESH_ENABLED:-false}
  DEVFEED_TOPIC_CORRECTION_MAX_ATTEMPTS:
  DEVFEED_AUTO_REANALYZE_TOPICS:
  DEVFEED_AUTO_RESEARCH_RELATIONSHIPS:
  DEVFEED_AUTO_LINK_TAGS:
  DEVFEED_RELATIONSHIP_RESEARCH_BATCH_SIZE:
  DEVFEED_RELATIONSHIP_RESEARCH_MAX_PENDING:
  DEVFEED_JOB_PAYLOAD_RETENTION_DAYS:
  DEVFEED_JOB_PAYLOAD_PRUNE_BATCH_SIZE:
  DEVFEED_AUTOMATION_BATCH_SIZE:
  DEVFEED_AI_COMPACT_ARTICLE_PROMPTS: ${DEVFEED_AI_COMPACT_ARTICLE_PROMPTS:-false}
  DEVFEED_ANALYSIS_MAX_CANDIDATES:
  DEVFEED_ANALYSIS_FALLBACK_CANDIDATES:
  DEVFEED_ANALYSIS_CATALOG_REUSE_ENABLED: ${DEVFEED_ANALYSIS_CATALOG_REUSE_ENABLED:-false}
  DEVFEED_AI_CAPACITY_COOLDOWN_SECONDS:
  DEVFEED_EVIDENCE_TIMEOUT_SECONDS:
  DEVFEED_CODEX_APP_SERVER_URL:
  DEVFEED_CODEX_MODEL:
  DEVFEED_CODEX_AUTH_TOKEN:
  DEVFEED_CODEX_TIMEOUT_SECONDS:
  DEVFEED_JOB_QUEUE_OVERRIDES:

x-host-access: &host-access # Also support host services on Docker Engine for Linux.
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-backend: &backend
  <<: [*runtime, *host-access]
  image: ${DEVFEED_BACKEND_IMAGE:-${DEVFEED_IMAGE_REGISTRY:+${DEVFEED_IMAGE_REGISTRY}/}ghcr.io/abhi1693/devfeed.tech/backend:master}
  environment: *core-environment
  networks: [default, data]

x-ready: &ready
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

x-healthcheck: &healthcheck
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

# Zero retains the current uncapped local defaults; size each pool from observed peaks.
x-worker-runtime: &worker-runtime
  cpus: ${DEVFEED_WORKER_CPUS:-0}
  mem_limit: ${DEVFEED_WORKER_MEMORY_LIMIT:-0}
  # Article analysis can run for 1,500 seconds, then drain bounded telemetry/delivery.
  stop_grace_period: 26m
  # A container keeps its hostname across restarts. RQ registrations can outlive
  # an interrupted process, so give every startup its own identity.
  command:
    - sh
    - -ec
    - |
      worker_name="$$HOSTNAME-$$(python -c 'import uuid; print(uuid.uuid4().hex)')"
      python -c 'import sys; from devfeed_core.runtime_files import runtime_marker, write_runtime_marker; write_runtime_marker(runtime_marker("worker-name"), sys.argv[1])' "$$worker_name"
      exec devfeed-worker --queue "$${DEVFEED_WORKER_QUEUE:-default}" --name "$$worker_name"
  healthcheck:
    <<: *healthcheck
    test: [CMD, devfeed-worker-health]

x-worker-environment: &worker-environment
  DEVFEED_WORKER_HEALTH_PATH: /tmp/devfeed-worker-health

services:
  postgres:
    image: *postgres-image
    restart: unless-stopped
    environment:
      POSTGRES_USER: devfeed
      POSTGRES_DB: devfeed
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 stores its versioned data directory under this mount.
      - postgres-data:/var/lib/postgresql
    networks: [data]
    shm_size: 128mb
    healthcheck:
      <<: *healthcheck
      test: [CMD, pg_isready, -U, devfeed, -d, devfeed]
      interval: 5s

  redis:
    image: ${DEVFEED_IMAGE_REGISTRY:+${DEVFEED_IMAGE_REGISTRY}/docker.io/library/}redis:8-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
    restart: unless-stopped
    command:
      [redis-server, --appendonly, "yes", --appendfsync, everysec, --maxmemory-policy, noeviction]
    volumes:
      - redis-data:/data
    networks: [data]
    healthcheck:
      <<: *healthcheck
      test: [CMD, redis-cli, ping]
      interval: 5s

  migrate:
    <<: *backend
    restart: "no"
    command:
      - devfeed
      - db
      - upgrade
    environment:
      <<: *core-environment
      DEVFEED_DATABASE_URL: ${DEVFEED_DIRECT_DATABASE_URL:-${DEVFEED_DATABASE_URL:-postgresql+psycopg://devfeed:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/devfeed}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    <<: *backend
    environment:
      <<: *core-environment
      DEVFEED_SEARCH_ENABLED: ${DEVFEED_SEARCH_ENABLED:-false}
      DEVFEED_SEARCH_URL: ${DEVFEED_SEARCH_URL:-http://typesense:8108}
      DEVFEED_SEARCH_QUERY_KEY: ${DEVFEED_SEARCH_QUERY_KEY:-}
      DEVFEED_PARTNER_TRACKING_KEY: ${DEVFEED_PARTNER_TRACKING_KEY:-}
      DEVFEED_PARTNER_CALLER_KEY: ${DEVFEED_PARTNER_CALLER_KEY:-}
      DEVFEED_SEARCH_COLLECTION_PREFIX: ${DEVFEED_SEARCH_COLLECTION_PREFIX:-${DEVFEED_PRODUCT:-devfeed}}
    depends_on: *ready
    ports:
      - target: 8000
        published: "${DEVFEED_API_PORT:-8000}"
        host_ip: "${DEVFEED_BIND_IP:-0.0.0.0}"
    healthcheck:
      <<: *healthcheck
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).close()",
        ]

  mcp:
    <<: *runtime
    profiles: [mcp]
    networks: [default, data]
    image: ${DEVFEED_MCP_IMAGE:-${DEVFEED_IMAGE_REGISTRY:+${DEVFEED_IMAGE_REGISTRY}/}ghcr.io/abhi1693/devfeed.tech/mcp:master}
    environment:
      DEVFEED_MCP_ACCESS_TOKEN_TTL_SECONDS: ${DEVFEED_MCP_ACCESS_TOKEN_TTL_SECONDS:-900}
      DEVFEED_MCP_API_URL: http://api:8000
      DEVFEED_MCP_USER_API_URL: ${DEVFEED_MCP_USER_API_URL:-}
      DEVFEED_MCP_PUBLIC_URL: ${DEVFEED_MCP_PUBLIC_URL:-}
      DEVFEED_MCP_OAUTH_ISSUER_URL: ${DEVFEED_MCP_OAUTH_ISSUER_URL:-}
      DEVFEED_MCP_WEB_URL: ${DEVFEED_MCP_WEB_URL:-}
      DEVFEED_MCP_REDIS_URL: ${DEVFEED_MCP_REDIS_URL:-}
      DEVFEED_MCP_ALLOWED_HOSTS: ${DEVFEED_MCP_ALLOWED_HOSTS:-["localhost", "localhost:*", "127.0.0.1", "127.0.0.1:*"]}
      DEVFEED_MCP_ALLOWED_ORIGINS: ${DEVFEED_MCP_ALLOWED_ORIGINS:-[]}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - target: 8003
        published: "${DEVFEED_MCP_PORT:-8003}"
        host_ip: "${DEVFEED_MCP_BIND_IP:-127.0.0.1}"
    healthcheck:
      <<: *healthcheck
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health/ready', timeout=12).close()",
        ]
      timeout: 15s

  typesense:
    <<: *runtime
    profiles: [search]
    image: ${DEVFEED_IMAGE_REGISTRY:+${DEVFEED_IMAGE_REGISTRY}/docker.io/}typesense/typesense:30.2@sha256:610f2d34b1f93d00762869da2c67736775e5798d19a2c8b91b014b8a0cc1e110
    command: [--data-dir=/data]
    environment:
      TYPESENSE_API_KEY: ${DEVFEED_SEARCH_ADMIN_KEY:-}
    volumes:
      - search-data:/data
    networks: [data]
    healthcheck:
      <<: *healthcheck
      test:
        [
          CMD,
          bash,
          -ec,
          "exec 3<>/dev/tcp/127.0.0.1/8108; printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; read -r status <&3; [[ $$status == *' 200 '* ]]",
        ]

  search-setup:
    <<: *backend
    profiles: [search]
    restart: "no"
    command: [devfeed, search, setup]
    environment:
      DEVFEED_DATABASE_URL: ${DEVFEED_DATABASE_URL:-postgresql+psycopg://devfeed:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/devfeed}
      DEVFEED_REDIS_URL: ${DEVFEED_REDIS_URL:-redis://redis:6379/0}
      DEVFEED_LOG_FORMAT: ${DEVFEED_LOG_FORMAT:-json}
      DEVFEED_SEARCH_ENABLED: "true"
      DEVFEED_SEARCH_URL: ${DEVFEED_SEARCH_URL:-http://typesense:8108}
      DEVFEED_SEARCH_ADMIN_KEY: ${DEVFEED_SEARCH_ADMIN_KEY:-}
      DEVFEED_SEARCH_QUERY_KEY: ${DEVFEED_SEARCH_QUERY_KEY:-}
      DEVFEED_SEARCH_COLLECTION_PREFIX: ${DEVFEED_SEARCH_COLLECTION_PREFIX:-${DEVFEED_PRODUCT:-devfeed}}
      DEVFEED_SEARCH_INDEX_BATCH_SIZE: ${DEVFEED_SEARCH_INDEX_BATCH_SIZE:-200}
    depends_on:
      <<: *ready
      typesense:
        condition: service_healthy

  search-indexer:
    <<: *backend
    profiles: [search]
    command: [devfeed-search-indexer]
    environment:
      DEVFEED_DATABASE_URL: ${DEVFEED_DATABASE_URL:-postgresql+psycopg://devfeed:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/devfeed}
      DEVFEED_REDIS_URL: ${DEVFEED_REDIS_URL:-redis://redis:6379/0}
      DEVFEED_LOG_FORMAT: ${DEVFEED_LOG_FORMAT:-json}
      DEVFEED_SEARCH_ENABLED: "true"
      DEVFEED_SEARCH_URL: ${DEVFEED_SEARCH_URL:-http://typesense:8108}
      DEVFEED_SEARCH_ADMIN_KEY: ${DEVFEED_SEARCH_ADMIN_KEY:-}
      DEVFEED_SEARCH_COLLECTION_PREFIX: ${DEVFEED_SEARCH_COLLECTION_PREFIX:-${DEVFEED_PRODUCT:-devfeed}}
      DEVFEED_SEARCH_INDEX_BATCH_SIZE: ${DEVFEED_SEARCH_INDEX_BATCH_SIZE:-200}
    depends_on:
      <<: *ready
      search-setup:
        condition: service_completed_successfully
      typesense:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test:
        [
          CMD,
          python,
          -c,
          "import time; from devfeed_core.runtime_files import runtime_marker; assert time.time() - float(runtime_marker('search-heartbeat').read_text()) < 120",
        ]

  scheduler:
    <<: *backend
    depends_on: *ready
    command: [devfeed, scheduler]
    healthcheck:
      <<: *healthcheck
      test: [CMD, python, -m, devfeed_aggregator.scheduler_probe]

  admin-api:
    <<: [*runtime, *host-access]
    image: ${DEVFEED_ADMIN_API_IMAGE:-${DEVFEED_IMAGE_REGISTRY:+${DEVFEED_IMAGE_REGISTRY}/}ghcr.io/abhi1693/devfeed.tech/admin-api:master}
    command:
      [
        uvicorn,
        devfeed_admin_api.main:app,
        --host,
        0.0.0.0,
        --port,
        "8001",
        --no-proxy-headers,
        --no-access-log,
      ]
    depends_on:
      <<: *ready
    networks: [default, data]
    # Account RPC only; ChatGPT credentials remain private to codex-server.
    # No dependency on the AI profile: admin must stay reachable during an outage.
    volumes:
      - codex-socket:/run/codex:ro
    environment:
      <<: *core-environment
      DEVFEED_PARTNER_CREDENTIAL_KEY:
      # Server-only credentials for bounded product ad image uploads.
      DEVFEED_IMAGE_STORAGE_ENDPOINT:
      DEVFEED_IMAGE_STORAGE_BUCKET:
      DEVFEED_IMAGE_STORAGE_ACCESS_KEY:
      DEVFEED_IMAGE_STORAGE_SECRET_KEY:
      DEVFEED_ADMIN_BASE_URL: ${DEVFEED_ADMIN_BASE_URL:-http://localhost:${DEVFEED_ADMIN_PORT:-3001}}
      DEVFEED_ADMIN_COOKIE_SECURE: ${DEVFEED_ADMIN_COOKIE_SECURE:-false}
      # Unset values stay absent, rather than becoming invalid empty URLs.
      # Compose resolves these from the shell or the root .env file.
      DEVFEED_OIDC_ISSUER_URL:
      DEVFEED_OIDC_CLIENT_ID:
      # Identity provider IDs are shared with the reader.
      DEVFEED_OIDC_GITHUB_IDP_ID:
      DEVFEED_OIDC_GOOGLE_IDP_ID:
      DEVFEED_OIDC_CLIENT_SECRET:
      DEVFEED_OIDC_ORGANIZATION_ID:
      DEVFEED_OIDC_TOKEN_ENDPOINT_AUTH_METHOD:
      DEVFEED_OIDC_SCOPES:
      DEVFEED_OIDC_ORGANIZATION_SCOPE_TEMPLATE:
      DEVFEED_OIDC_ORGANIZATION_CLAIM:
      DEVFEED_OIDC_ROLES_CLAIM:
      DEVFEED_OIDC_ROLES_FORMAT:
      DEVFEED_OIDC_ROLE_SCOPE_TEMPLATE:
      DEVFEED_ADMIN_REQUIRED_ROLE:
      DEVFEED_ADMIN_SESSION_TTL_SECONDS:
    healthcheck:
      <<: *healthcheck
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=3).close()",
        ]

  partner-api:
    <<: [*runtime, *host-access]
    image: ${DEVFEED_PARTNER_API_IMAGE:-${DEVFEED_IMAGE_REGISTRY:+${DEVFEED_IMAGE_REGISTRY}/}ghcr.io/abhi1693/devfeed.tech/partner-api:master}
    depends_on: *ready
    networks: [default, data]
    environment:
      <<: *core-environment
      DEVFEED_PARTNER_BASE_URL: ${DEVFEED_PARTNER_BASE_URL:-http://localhost:${DEVFEED_PARTNER_PORT:-3002}}
      DEVFEED_PARTNER_COOKIE_SECURE: ${DEVFEED_PARTNER_COOKIE_SECURE:-false}
      DEVFEED_PARTNER_CREDENTIAL_KEY:
      # Shared image bucket; never passed to either frontend or the public API.
      DEVFEED_IMAGE_STORAGE_ENDPOINT:
      DEVFEED_IMAGE_STORAGE_BUCKET:
      DEVFEED_IMAGE_STORAGE_ACCESS_KEY:
      DEVFEED_IMAGE_STORAGE_SECRET_KEY:
      # Unset values stay absent, rather than becoming invalid empty URLs.
      # Compose resolves these from the shell or the root .env file.
      DEVFEED_OIDC_ISSUER_URL:
      DEVFEED_OIDC_CLIENT_ID: ${DEVFEED_PARTNER_OIDC_CLIENT_ID:-}
      # Identity provider IDs are shared with the reader.
      DEVFEED_OIDC_GITHUB_IDP_ID:
      DEVFEED_OIDC_GOOGLE_IDP_ID:
      DEVFEED_OIDC_CLIENT_SECRET: ${DEVFEED_PARTNER_OIDC_CLIENT_SECRET:-}
      DEVFEED_OIDC_ORGANIZATION_ID:
      DEVFEED_OIDC_TOKEN_ENDPOINT_AUTH_METHOD:
      DEVFEED_OIDC_SCOPES:
      DEVFEED_OIDC_ORGANIZATION_SCOPE_TEMPLATE:
      DEVFEED_OIDC_ORGANIZATION_CLAIM:
      DEVFEED_OIDC_ROLES_CLAIM:
      DEVFEED_OIDC_ROLES_FORMAT:
      DEVFEED_OIDC_ROLE_SCOPE_TEMPLATE:
      DEVFEED_PARTNER_SESSION_TTL_SECONDS:
    healthcheck:
      <<: *healthcheck
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health/ready', timeout=3).close()",
        ]

  user-api:
    <<: [*runtime, *host-access]
    image: ${DEVFEED_USER_API_IMAGE:-${DEVFEED_IMAGE_REGISTRY:+${DEVFEED_IMAGE_REGISTRY}/}ghcr.io/abhi1693/devfeed.tech/user-api:master}
    command:
      [
        uvicorn,
        devfeed_user_api.main:app,
        --host,
        0.0.0.0,
        --port,
        "8002",
        --no-proxy-headers,
        --no-access-log,
      ]
    depends_on:
      <<: *ready
    networks: [default, data]
    environment:
      DEVFEED_JOB_QUEUE_OVERRIDES:
      DEVFEED_DATABASE_URL: ${DEVFEED_DATABASE_URL:-postgresql+psycopg://devfeed:${POSTGRES_PASSWORD}@postgres:5432/devfeed}
      DEVFEED_REDIS_URL: ${DEVFEED_REDIS_URL:-redis://redis:6379/0}
      DEVFEED_LOG_LEVEL:
      DEVFEED_LOG_FORMAT:
      # Trusted personalized placement issuer; never passed to frontend services.
      DEVFEED_PARTNER_TRACKING_KEY: ${DEVFEED_PARTNER_TRACKING_KEY:-}
      DEVFEED_X_PIXEL_ENABLED: ${DEVFEED_X_PIXEL_ENABLED:-false}
      X_PIXEL_TOKEN: ${X_PIXEL_TOKEN:-}
      X_SIGNUP_EVENT_ID: ${X_SIGNUP_EVENT_ID:-}
      # Server-only storage credentials for bounded avatar uploads.
      DEVFEED_IMAGE_STORAGE_ENABLED: ${DEVFEED_IMAGE_STORAGE_ENABLED:-false}
      DEVFEED_IMAGE_STORAGE_ENDPOINT:
      DEVFEED_IMAGE_STORAGE_BUCKET:
      DEVFEED_IMAGE_PUBLIC_URL:
      DEVFEED_IMAGE_STORAGE_ACCESS_KEY:
      DEVFEED_IMAGE_STORAGE_SECRET_KEY:
      DEVFEED_USER_BASE_URL: ${DEVFEED_USER_BASE_URL:-http://localhost:${DEVFEED_WEB_PORT:-3000}}
      DEVFEED_USER_EXTENSION_IDS: ${DEVFEED_USER_EXTENSION_IDS:-[]}
      DEVFEED_USER_ALLOWED_ORIGINS: ${DEVFEED_USER_ALLOWED_ORIGINS:-[]}
      DEVFEED_USER_COOKIE_SECURE: ${DEVFEED_USER_COOKIE_SECURE:-false}
      DEVFEED_USER_SESSION_TTL_SECONDS:
      DEVFEED_USER_SESSION_ABSOLUTE_TTL_SECONDS:
      DEVFEED_USER_MCP_SESSION_TTL_SECONDS: ${DEVFEED_USER_MCP_SESSION_TTL_SECONDS:-2592000}
      DEVFEED_USER_MCP_SESSION_ABSOLUTE_TTL_SECONDS: ${DEVFEED_USER_MCP_SESSION_ABSOLUTE_TTL_SECONDS:-7776000}
      DEVFEED_USER_MCP_RESOURCE_URL: ${DEVFEED_MCP_OAUTH_ISSUER_URL:+${DEVFEED_MCP_PUBLIC_URL:-}}
      DEVFEED_USER_MCP_ISSUER_URL: ${DEVFEED_MCP_OAUTH_ISSUER_URL:-}
      DEVFEED_USER_OIDC_ISSUER_URL:
      DEVFEED_USER_OIDC_CLIENT_ID:
      DEVFEED_USER_OIDC_CLIENT_SECRET:
      DEVFEED_OIDC_GITHUB_IDP_ID:
      DEVFEED_OIDC_GOOGLE_IDP_ID:
      DEVFEED_USER_OIDC_TOKEN_ENDPOINT_AUTH_METHOD:
      DEVFEED_USER_OIDC_SCOPES:
      DEVFEED_USER_OIDC_ORGANIZATION_ID:
      DEVFEED_USER_OIDC_ORGANIZATION_SCOPE_TEMPLATE:
      DEVFEED_USER_OIDC_ORGANIZATION_CLAIM:
    healthcheck:
      <<: *healthcheck
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/ready', timeout=3).close()",
        ]

  web:
    <<: *runtime
    image: ${DEVFEED_WEB_IMAGE:-${DEVFEED_IMAGE_REGISTRY:+${DEVFEED_IMAGE_REGISTRY}/}ghcr.io/abhi1693/devfeed.tech/web:master}
    depends_on:
      api:
        condition: service_healthy
    networks: [default]
    environment:
      DEVFEED_PRODUCT: ${DEVFEED_PRODUCT:-devfeed}
      DEVFEED_MCP_PUBLIC_URL: ${DEVFEED_MCP_PUBLIC_URL:-}
      DEVFEED_MCP_INTERNAL_URL: ${DEVFEED_MCP_INTERNAL_URL:-}
      DEVFEED_PUBLIC_API_URL: http://api:8000
      DEVFEED_PARTNER_CALLER_KEY: ${DEVFEED_PARTNER_CALLER_KEY:-}
      DEVFEED_PARTNER_CALLER_IP_HEADER: ${DEVFEED_PARTNER_CALLER_IP_HEADER:-}
      DEVFEED_USER_API_URL: http://user-api:8002
      DEVFEED_USER_BASE_URL: ${DEVFEED_USER_BASE_URL:-http://localhost:${DEVFEED_WEB_PORT:-3000}}
      DEVFEED_USER_EXTENSION_IDS: ${DEVFEED_USER_EXTENSION_IDS:-[]}
      DEVFEED_USER_ALLOWED_ORIGINS: ${DEVFEED_USER_ALLOWED_ORIGINS:-[]}
      DEVFEED_ANALYTICS_ENABLED: ${DEVFEED_ANALYTICS_ENABLED:-false}
      GOOGLE_ANALYTICS_ID: ${GOOGLE_ANALYTICS_ID:-G-N4V5CW5C0M}
      DEVFEED_X_PIXEL_ENABLED: ${DEVFEED_X_PIXEL_ENABLED:-false}
      DEVFEED_EXTENSION_ANALYTICS_ENABLED: ${DEVFEED_EXTENSION_ANALYTICS_ENABLED:-false}
      DEVFEED_EXTENSION_GA_API_SECRET: ${DEVFEED_EXTENSION_GA_API_SECRET:-}
    ports:
      - target: 3000
        published: "${DEVFEED_WEB_PORT:-3000}"
        host_ip: "${DEVFEED_BIND_IP:-0.0.0.0}"
    healthcheck:
      <<: *healthcheck
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000', {signal: AbortSignal.timeout(10000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      timeout: 12s

  admin:
    <<: *runtime
    image: ${DEVFEED_ADMIN_IMAGE:-${DEVFEED_IMAGE_REGISTRY:+${DEVFEED_IMAGE_REGISTRY}/}ghcr.io/abhi1693/devfeed.tech/admin:master}
    depends_on:
      admin-api:
        condition: service_healthy
    networks: [default]
    environment:
      # The web container receives no database, Redis or OIDC credentials.
      DEVFEED_ADMIN_API_URL: http://admin-api:8001
      DEVFEED_ADMIN_BASE_URL: ${DEVFEED_ADMIN_BASE_URL:-http://localhost:${DEVFEED_ADMIN_PORT:-3001}}
    ports:
      - target: 3000
        published: "${DEVFEED_ADMIN_PORT:-3001}"
        host_ip: "${DEVFEED_BIND_IP:-0.0.0.0}"
    healthcheck:
      <<: *healthcheck
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/login', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]

  partner:
    <<: *runtime
    image: ${DEVFEED_PARTNER_IMAGE:-${DEVFEED_IMAGE_REGISTRY:+${DEVFEED_IMAGE_REGISTRY}/}ghcr.io/abhi1693/devfeed.tech/partner:master}
    depends_on:
      partner-api:
        condition: service_healthy
    networks: [default]
    environment:
      # The web container receives no database, Redis or OIDC credentials.
      DEVFEED_PARTNER_API_URL: http://partner-api:8004
      DEVFEED_PARTNER_BASE_URL: ${DEVFEED_PARTNER_BASE_URL:-http://localhost:${DEVFEED_PARTNER_PORT:-3002}}
    ports:
      - target: 3000
        published: "${DEVFEED_PARTNER_PORT:-3002}"
        host_ip: "${DEVFEED_BIND_IP:-0.0.0.0}"
    healthcheck:
      <<: *healthcheck
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/login', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]

  codex-server:
    <<: [*runtime, *host-access]
    profiles: [ai]
    image: devfeed/codex:local
    build:
      context: .
      dockerfile: infra/codex/Dockerfile
      args:
        DOCKERHUB_PREFIX: ${DEVFEED_IMAGE_REGISTRY:+${DEVFEED_IMAGE_REGISTRY}/docker.io/library/}
    # Model credentials live only here. No repository or host Codex home mount.
    volumes:
      - codex-auth:/var/lib/codex
      - codex-socket:/run/codex
    # A private socket bridge forwards to Codex's container-local loopback listener.
    networks: [default]
    healthcheck:
      <<: *healthcheck
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:4502/readyz]
      interval: 5s

  # One independently sized worker deployment per priority by default.
  # Full backend dependencies permit every ordinary job kind on any priority.
  high-worker: &priority-worker
    scale: ${DEVFEED_HIGH_WORKER_REPLICAS:-4}
    <<: [*backend, *worker-runtime]
    environment: &priority-worker-environment
      <<: [*core-environment, *worker-environment]
      DEVFEED_WORKER_QUEUE: high
      DEVFEED_PARTNER_CREDENTIAL_KEY:
    depends_on:
      <<: *ready
    volumes:
      - codex-socket:/run/codex:ro

  default-worker:
    <<: *priority-worker
    scale: ${DEVFEED_DEFAULT_WORKER_REPLICAS:-4}
    environment:
      <<: *priority-worker-environment
      DEVFEED_WORKER_QUEUE: default

  low-worker:
    <<: *priority-worker
    scale: ${DEVFEED_LOW_WORKER_REPLICAS:-1}
    environment:
      <<: *priority-worker-environment
      DEVFEED_WORKER_QUEUE: low

  images-worker:
    <<: [*backend, *worker-runtime]
    depends_on: *ready
    image: ${DEVFEED_IMAGES_WORKER_IMAGE:-${DEVFEED_IMAGE_REGISTRY:+${DEVFEED_IMAGE_REGISTRY}/}ghcr.io/abhi1693/devfeed.tech/images-worker:master}
    command: [devfeed-images-worker]
    scale: ${DEVFEED_IMAGES_WORKER_REPLICAS:-1}
    environment:
      <<: [*core-environment, *worker-environment]
      DEVFEED_IMAGE_STORAGE_ENDPOINT:
      DEVFEED_IMAGE_STORAGE_BUCKET:
      DEVFEED_IMAGE_STORAGE_ACCESS_KEY:
      DEVFEED_IMAGE_STORAGE_SECRET_KEY:
      DEVFEED_IMAGE_MAX_BYTES:
      DEVFEED_IMGPROXY_URL: ${DEVFEED_IMGPROXY_URL:-http://imgproxy:8080}
      DEVFEED_IMGPROXY_KEY:
      DEVFEED_IMGPROXY_SALT:

  imgproxy:
    <<: *runtime
    profiles: [images]
    image: ${DEVFEED_IMAGE_REGISTRY:+${DEVFEED_IMAGE_REGISTRY}/}ghcr.io/imgproxy/imgproxy:v4.0.15@sha256:4ec770c72bffea108ba404dc86d3be88e6bf4fd58958782770ff890cca4c7a82
    environment:
      IMGPROXY_BIND: :8080
      IMGPROXY_KEY: ${DEVFEED_IMGPROXY_KEY:-}
      IMGPROXY_SALT: ${DEVFEED_IMGPROXY_SALT:-}
      IMGPROXY_ALLOWED_SOURCES: ${DEVFEED_IMAGE_PUBLIC_URL:-https://images.invalid}/originals/
      IMGPROXY_ALLOWED_PROCESSING_OPTIONS: rs,q,f
      IMGPROXY_MAX_SRC_FILE_SIZE: ${DEVFEED_IMAGE_MAX_BYTES:-10000000}
      IMGPROXY_MAX_SRC_RESOLUTION: 40
      IMGPROXY_MAX_RESULT_DIMENSION: 4096
      IMGPROXY_MAX_ANIMATION_FRAMES: 1
      IMGPROXY_WORKERS: 2
      IMGPROXY_REQUESTS_QUEUE_SIZE: 10
      IMGPROXY_TIMEOUT: 15
      IMGPROXY_DOWNLOAD_TIMEOUT: 8
      IMGPROXY_ALLOW_LOOPBACK_SOURCE_ADDRESSES: "false"
      IMGPROXY_ALLOW_LINK_LOCAL_SOURCE_ADDRESSES: "false"
      IMGPROXY_ALLOW_PRIVATE_SOURCE_ADDRESSES: "false"
      IMGPROXY_LOG_LEVEL: error
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD, imgproxy, health]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  default:
  data:
    internal: true

volumes:
  search-data:
  postgres-data:
  redis-data:
  codex-auth:
  codex-socket:
