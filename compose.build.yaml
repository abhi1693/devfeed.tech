# Optional local-source build override. Use together with compose.yaml.
x-backend-build: &backend-build
  build:
    context: .
    dockerfile: Dockerfile
    cache_from:
      - type=registry,ref=ghcr.io/abhi1693/devfeed.tech/backend:buildcache-backend-linux-amd64
      - type=registry,ref=ghcr.io/abhi1693/devfeed.tech/backend:buildcache-backend-linux-arm64

x-backend-develop: &backend-develop
  watch:
    - {action: rebuild, path: ./packages/core}
    - {action: rebuild, path: ./packages/http}
    - {action: rebuild, path: ./apps/api}
    - {action: rebuild, path: ./apps/aggregator}
    - {action: rebuild, path: ./apps/notifications}
    - {action: rebuild, path: ./apps/cli}
    - {action: rebuild, path: ./apps/admin-api/pyproject.toml}
    - {action: rebuild, path: ./apps/user-api/pyproject.toml}
    - {action: rebuild, path: ./pyproject.toml}
    - {action: rebuild, path: ./uv.lock}
    - {action: rebuild, path: ./.python-version}
    - {action: rebuild, path: ./Dockerfile}
    - {action: rebuild, path: ./.dockerignore}

services:
  migrate:
    <<: *backend-build
    image: devfeed/migrate:local
  api:
    <<: *backend-build
    image: devfeed/api:local
    develop: *backend-develop
  search-indexer:
    <<: *backend-build
    image: devfeed/search-indexer:local
    develop: *backend-develop
  worker:
    <<: *backend-build
    image: devfeed/worker:local
    develop: *backend-develop
  scheduler:
    <<: *backend-build
    image: devfeed/scheduler:local
    develop: *backend-develop
  codex-client:
    <<: *backend-build
    image: devfeed/codex-client:local
    develop: *backend-develop
  article-analysis-worker:
    <<: *backend-build
    image: devfeed/article-analysis-worker:local
    develop: *backend-develop
  topic-analysis-worker:
    <<: *backend-build
    image: devfeed/topic-analysis-worker:local
    develop: *backend-develop
  research-verification-worker:
    <<: *backend-build
    image: devfeed/research-verification-worker:local
    develop: *backend-develop
  source-analysis-worker:
    <<: *backend-build
    image: devfeed/source-analysis-worker:local
    develop: *backend-develop
  relationships-worker:
    <<: *backend-build
    image: devfeed/relationships-worker:local
    develop: *backend-develop
  ingestion-worker:
    <<: *backend-build
    image: devfeed/ingestion-worker:local
    develop: *backend-develop
  article-enrichment-worker:
    <<: *backend-build
    image: devfeed/article-enrichment-worker:local
    develop: *backend-develop
  source-enrichment-worker:
    <<: *backend-build
    image: devfeed/source-enrichment-worker:local
    develop: *backend-develop
  images-worker:
    <<: *backend-build
    image: devfeed/images-worker:local
    develop: *backend-develop
  notifications-worker:
    <<: *backend-build
    image: devfeed/notifications-worker:local
    develop: *backend-develop
  admin-api:
    image: devfeed/admin-api:local
    build:
      context: .
      dockerfile: apps/admin-api/Dockerfile
      cache_from:
        - type=registry,ref=ghcr.io/abhi1693/devfeed.tech/admin-api:buildcache-admin-api-linux-amd64
        - type=registry,ref=ghcr.io/abhi1693/devfeed.tech/admin-api:buildcache-admin-api-linux-arm64
    develop:
      watch:
        - {action: rebuild, path: ./packages/core}
        - {action: rebuild, path: ./packages/http}
        - {action: rebuild, path: ./apps/admin-api}
        - {action: rebuild, path: ./apps/notifications}
        - {action: rebuild, path: ./pyproject.toml}
        - {action: rebuild, path: ./uv.lock}
        - {action: rebuild, path: ./.python-version}
        - {action: rebuild, path: ./.dockerignore}
  user-api:
    image: devfeed/user-api:local
    build:
      context: .
      dockerfile: apps/user-api/Dockerfile
      cache_from:
        - type=registry,ref=ghcr.io/abhi1693/devfeed.tech/user-api:buildcache-user-api-linux-amd64
        - type=registry,ref=ghcr.io/abhi1693/devfeed.tech/user-api:buildcache-user-api-linux-arm64
    develop:
      watch:
        - {action: rebuild, path: ./packages/core}
        - {action: rebuild, path: ./packages/http}
        - {action: rebuild, path: ./apps/user-api}
        - {action: rebuild, path: ./pyproject.toml}
        - {action: rebuild, path: ./uv.lock}
        - {action: rebuild, path: ./.python-version}
        - {action: rebuild, path: ./.dockerignore}
  web:
    image: devfeed/web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    develop:
      watch:
        - action: rebuild
          path: ./apps/web
          ignore: [node_modules/, .next/, "*.tsbuildinfo"]
        - {action: rebuild, path: ./packages/theme}
        - {action: rebuild, path: ./packages/ui}
        - {action: rebuild, path: ./package.json}
        - {action: rebuild, path: ./package-lock.json}
        - {action: rebuild, path: ./apps/admin/package.json}
        - {action: rebuild, path: ./.dockerignore}

  admin:
    image: devfeed/admin:local
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      cache_from:
        - type=registry,ref=ghcr.io/abhi1693/devfeed.tech/admin:buildcache-admin-linux-amd64
        - type=registry,ref=ghcr.io/abhi1693/devfeed.tech/admin:buildcache-admin-linux-arm64
    develop:
      watch:
        - action: rebuild
          path: ./apps/admin
          # Next type-checks tests too; fixes there must retrigger failed builds.
          ignore: [node_modules/, .next/, "*.tsbuildinfo"]
        - {action: rebuild, path: ./packages/theme}
        - {action: rebuild, path: ./packages/ui}
        - {action: rebuild, path: ./package.json}
        - {action: rebuild, path: ./package-lock.json}
        - {action: rebuild, path: ./apps/web/package.json}
        - {action: rebuild, path: ./.dockerignore}
  codex-server:
    develop:
      watch:
        - {action: rebuild, path: ./infra/codex}
