name: Security
on:
  workflow_call: null
permissions:
  contents: read
jobs:
  configuration:
    name: Workflow and configuration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test private Codex transport
        run: node --test tests/codex_transport.test.cjs
      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: compose-validation-only
        run: |
          docker compose --env-file compose.env.example config --quiet
          docker compose --env-file compose.env.example -f compose.yaml -f compose.build.yaml config --quiet
          python scripts/ci/check_compose.py
  security:
    uses: abhi1693/actions/.github/workflows/security.yml@afba12afb85bf40be9328c92dc53b779f18d5c6d # v1.0.1
    with:
      node-version: '24'
      python-version: '3.12'
      uv-version: 0.12.10
      npm-audit: true
      python-audit: true
      python-all-packages: true
      codeql-languages: '["python","actions"]'
      codeql-config: ./.github/codeql.yml
    permissions:
      contents: read
      security-events: write
  javascript-codeql:
    name: JavaScript and TypeScript CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-extended
          config-file: ./.github/codeql.yml
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript
          output: ${{ runner.temp }}/codeql
      - name: Block on unapproved analysis findings
        run: python3 scripts/check_codeql_sarif.py "$RUNNER_TEMP/codeql"
