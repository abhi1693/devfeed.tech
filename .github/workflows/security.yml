name: Security
on:
  workflow_call: null
permissions:
  contents: read
jobs:
  configuration:
    name: Workflow and configuration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js for Codex checks
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Audit locked Codex dependencies
        run: npm audit --prefix infra/codex --omit=dev --audit-level=high
      - name: Install locked JavaScript coverage tooling
        run: npm ci --ignore-scripts
      - name: Test Codex transport and compiler caching with coverage
        run: |
          node node_modules/c8/bin/c8.js --include 'infra/codex/*.cjs' \
            --include '.github/actions/next-build-cache/key.mjs' \
            --reporter=lcovonly --reporter=json-summary \
            --reports-dir=reports/coverage/security \
            node --test tests/codex_transport.test.cjs tests/next-build-cache.test.mjs
      - name: Upload private Codex transport coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-coverage-${{ github.run_attempt }}
          path: |
            reports/coverage/security/lcov.info
            reports/coverage/security/coverage-summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: compose-validation-only
        run: |
          docker compose --env-file compose.env.example config --quiet
          docker compose --env-file compose.env.example -f compose.yaml -f compose.build.yaml config --quiet
          python scripts/ci/check_compose.py
  security:
    uses: abhi1693/actions/.github/workflows/security.yml@afba12afb85bf40be9328c92dc53b779f18d5c6d # v1.0.1
    with:
      node-version: "24"
      python-version: "3.12"
      uv-version: 0.12.10
      npm-audit: true
      python-audit: true
      python-all-packages: true
      codeql-languages: '["python","actions"]'
      codeql-config: ./.github/codeql.yml
    permissions:
      contents: read
      security-events: write
  javascript-codeql:
    name: JavaScript and TypeScript CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-extended
          config-file: ./.github/codeql.yml
      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript
          output: ${{ runner.temp }}/codeql
      - name: Block on unapproved analysis findings
        run: python3 scripts/check_codeql_sarif.py "$RUNNER_TEMP/codeql"
