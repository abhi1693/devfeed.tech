name: Security
on:
  workflow_call: null
permissions:
  contents: read
jobs:
  configuration:
    name: Workflow and configuration checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test private Codex transport
        run: node --test tests/codex_transport.test.cjs
      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: compose-validation-only
        run: |
          docker compose --env-file compose.env.example config --quiet
          docker compose --env-file compose.env.example -f compose.yaml -f compose.build.yaml config --quiet
          python scripts/ci/check_compose.py
  security:
    uses: abhi1693/actions/.github/workflows/security.yml@afba12afb85bf40be9328c92dc53b779f18d5c6d # v1.0.1
    with:
      node-version: '24'
      python-version: '3.12'
      uv-version: 0.12.10
      npm-audit: true
      python-audit: true
      python-all-packages: true
      codeql-languages: '["python","javascript-typescript","actions"]'
      codeql-config: ./.github/codeql.yml
      codeql-trusted-workflows: '["abhi1693/actions/.github/workflows/node-ci.yml@afba12afb85bf40be9328c92dc53b779f18d5c6d","abhi1693/actions/.github/workflows/python-ci.yml@afba12afb85bf40be9328c92dc53b779f18d5c6d","abhi1693/actions/.github/workflows/security.yml@afba12afb85bf40be9328c92dc53b779f18d5c6d","abhi1693/actions/.github/workflows/container-images.yml@afba12afb85bf40be9328c92dc53b779f18d5c6d"]'
    permissions:
      contents: read
      security-events: write
