name: Recovery

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "7 4 * * *"

permissions:
  contents: read

concurrency:
  group: recovery-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    name: Recovery
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.10"
          enable-cache: true
      - name: Install
        run: uv sync --all-packages --locked
      - name: Test
        run: uv run --locked python -m scripts.ci.failure_recovery
      - name: Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recovery-arm64-${{ github.run_attempt }}
          path: reports/failure-recovery
          if-no-files-found: error
          retention-days: 14
