name: Catalog refresh scale
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/catalog-refresh-benchmark.yml
      - apps/admin-api/src/overview_projection.py
      - apps/admin-api/src/pipeline_projection.py
      - apps/admin-api/src/pipeline_reads.py
      - packages/core/src/read_models.py
      - scripts/profile_catalog_refresh.py
      - scripts/profile_read_models.py
      - scripts/ci/catalog_refresh_report.py
      - tests/tooling/ci/test_catalog_refresh_workflow.py
permissions:
  contents: read
concurrency:
  group: catalog-refresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-scale:
    name: PostgreSQL 17 / ARM64 / 150k articles
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable
          POSTGRES_DB: devfeed_catalog_base_test
        ports:
          - 5432:5432
        options: >-
          --shm-size=512m --cpus=2 --memory=4g
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DEVFEED_TEST_DATABASE_URL: postgresql+psycopg://postgres@127.0.0.1:5432/devfeed_catalog_base_test
      # libpq supplies the isolated service's test-only password outside the URL.
      PGPASSWORD: disposable
      DEVFEED_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: |
            candidate/uv.lock
            baseline/uv.lock
          cache-suffix: catalog-scale
      - name: Install isolated applications
        run: |
          sh candidate/scripts/ci/python-bootstrap.sh candidate --editable --all-packages
          sh candidate/scripts/ci/python-bootstrap.sh baseline --editable --all-packages
          cp candidate/scripts/profile_catalog_refresh.py baseline/scripts/profile_catalog_refresh.py
          cp candidate/scripts/profile_read_models.py baseline/scripts/profile_read_models.py
      - name: Prepare the shared fixed fixture
        working-directory: baseline
        run: |
          mkdir -p ../reports
          .venv/bin/python scripts/profile_catalog_refresh.py --seed --prepare-only \
            --require-native-arm64 --scale 1 --history-bytes 8192 --batch 200 \
            --output ../reports/prepared.json
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          dataset = json.loads(Path("../reports/prepared.json").read_text())["dataset"]
          assert dataset["articles"] == 150000, dataset
          assert dataset["retained_article_cards"] >= 19679, dataset
          PY
      - name: Clone the fixture before either scenario
        id: clone-fixture
        working-directory: candidate
        run: |
          .venv/bin/python - <<'PY'
          import os
          from sqlalchemy import create_engine
          from sqlalchemy.engine import make_url
          url = make_url(os.environ["DEVFEED_TEST_DATABASE_URL"])
          engine = create_engine(url.set(database="postgres"), isolation_level="AUTOCOMMIT")
          with engine.connect() as connection:
              connection.exec_driver_sql(
                  "CREATE DATABASE devfeed_catalog_head_test "
                  "TEMPLATE devfeed_catalog_base_test STRATEGY FILE_COPY"
              )
          engine.dispose()
          PY
      - name: Measure baseline
        working-directory: baseline
        run: |
          .venv/bin/python scripts/profile_catalog_refresh.py --expect either --require-native-arm64 \
            --batch 200 --batches 20 --age-refresh-seconds 61 --output ../reports/baseline.json
      - name: Measure candidate on the same runner
        if: always() && !cancelled() && steps.clone-fixture.outcome == 'success'
        working-directory: candidate
        run: |
          DEVFEED_TEST_DATABASE_URL=postgresql+psycopg://postgres@127.0.0.1:5432/devfeed_catalog_head_test \
            .venv/bin/python scripts/profile_catalog_refresh.py --expect fixed --require-native-arm64 \
            --batch 200 --batches 20 --age-refresh-seconds 61 --output ../reports/candidate.json
      - name: Summarize before, after, and signed changes
        if: always()
        env:
          MEASUREMENT_RESULT: ${{ job.status }}
        run: |
          report_status=0
          python3 candidate/scripts/ci/catalog_refresh_report.py \
            --job-result "$MEASUREMENT_RESULT" || report_status=$?
          cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$report_status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: catalog-refresh-arm64-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: error
          retention-days: 30
  report:
    name: Publish catalog refresh PR results
    needs: native-scale
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # No checkout: downloaded reports are data, never executable code.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: catalog-refresh-arm64-*
          path: report
          merge-multiple: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MEASUREMENT_RESULT: ${{ needs.native-scale.result }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const marker = '<!-- devfeed-catalog-refresh-scale -->';
            const pr = context.payload.pull_request;
            const current = await github.rest.pulls.get({...context.repo, pull_number: pr.number});
            if (current.data.head.sha !== pr.head.sha) return;
            const attempt = Number(process.env.GITHUB_RUN_ATTEMPT);
            const jobResult = process.env.MEASUREMENT_RESULT;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const integer = value => Number.isSafeInteger(value) && value > 0;
            const read = (file, limit) => {
              const stat = fs.lstatSync(file);
              if (!stat.isFile() || stat.size < 1 || stat.size > limit) throw new Error('Invalid report file');
              return fs.readFileSync(file);
            };
            let metadata, summary;
            try {
              if (!integer(attempt)) throw new Error('Invalid run attempt');
              // A successful measurement may be reused by a report-only rerun.
              // A failed rerun must provide its own current-attempt diagnostics.
              const flat = fs.existsSync('report/summary.json');
              const artifacts = flat ? [] : fs.readdirSync('report')
                .map(name => /^catalog-refresh-arm64-(\d+)$/.exec(name))
                .filter(Boolean).map(match => Number(match[1]))
                .filter(value => integer(value) && value <= attempt);
              const artifactAttempt = Math.max(...artifacts);
              if (!flat && (!integer(artifactAttempt) ||
                  (jobResult !== 'success' && artifactAttempt !== attempt))) {
                throw new Error('No matching benchmark artifact');
              }
              const directory = flat ? 'report' : `report/catalog-refresh-arm64-${artifactAttempt}`;
              metadata = JSON.parse(read(`${directory}/summary.json`, 10000).toString('utf8'));
              if (!metadata || metadata.schema !== 1 || metadata.run_id !== String(context.runId) ||
                  !integer(metadata.run_attempt) || metadata.run_attempt > attempt ||
                  (!flat && metadata.run_attempt !== artifactAttempt) ||
                  (jobResult !== 'success' && metadata.run_attempt !== attempt) ||
                  !/^[0-9a-f]{40}$/.test(metadata.base_sha) || metadata.base_sha !== pr.base.sha ||
                  !/^[0-9a-f]{40}$/.test(metadata.head_sha) || metadata.head_sha !== pr.head.sha ||
                  !['passed', 'failed', 'incomplete'].includes(metadata.status) ||
                  !/^[0-9a-f]{64}$/.test(metadata.summary_sha256)) {
                throw new Error('Benchmark metadata does not match this run and PR');
              }
              const markdown = read(`${directory}/summary.md`, 50000);
              if (crypto.createHash('sha256').update(markdown).digest('hex') !== metadata.summary_sha256) {
                throw new Error('Benchmark summary checksum mismatch');
              }
              summary = markdown.toString('utf8');
            } catch {
              metadata = null;
              summary = null;
            }
            const passed = metadata?.status === 'passed' && jobResult === 'success';
            const lines = [marker];
            if (summary) {
              if (!passed) {
                summary = summary.replace('**PASS**', metadata.status === 'incomplete' ? '**INCOMPLETE**' : '**FAIL**');
              }
              if (metadata.status === 'passed' && !passed) {
                lines.push(`**FAIL** — benchmark job result: ${jobResult}. The artifact alone does not establish a passing run.`, '');
              }
              lines.push(summary.trimEnd());
            } else {
              lines.push('### Catalog refresh scale', '',
                '**Results unavailable / FAIL:** no valid benchmark report for this run and commit could be loaded. Setup or measurement may have failed before results were written; no improvement is established. Inspect the linked job logs and artifacts.');
            }
            const measuredAttempt = metadata?.run_attempt;
            lines.push('', `Before: [${pr.base.sha.slice(0, 12)}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${pr.base.sha}) · After: [${pr.head.sha.slice(0, 12)}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${pr.head.sha})`,
              `[Raw JSON, SQL plans, and job logs](${url}#artifacts) · report attempt ${attempt}` +
              (measuredAttempt ? ` · measurement attempt ${measuredAttempt}` : ' · measurement unavailable'));
            const body = lines.join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number: pr.number});
            // Reuse the same results comment across commits and report-only reruns.
            const previous = comments.find(comment => comment.user.type === 'Bot' && comment.body?.startsWith(marker));
            const latest = await github.rest.pulls.get({...context.repo, pull_number: pr.number});
            if (latest.data.head.sha !== pr.head.sha) return;
            if (previous) {
              await github.rest.issues.updateComment({...context.repo, comment_id: previous.id, body});
            } else {
              await github.rest.issues.createComment({...context.repo, issue_number: pr.number, body});
            }
            if (!metadata) core.setFailed('Catalog refresh artifact is missing or invalid');
            else if (!passed) core.setFailed('Catalog refresh benchmark did not pass');
