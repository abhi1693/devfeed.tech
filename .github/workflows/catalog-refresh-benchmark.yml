name: Catalog refresh scale
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/catalog-refresh-benchmark.yml
      - apps/admin-api/src/overview_projection.py
      - apps/admin-api/src/pipeline_projection.py
      - apps/admin-api/src/pipeline_reads.py
      - packages/core/src/read_models.py
      - scripts/profile_catalog_refresh.py
      - scripts/profile_read_models.py
permissions:
  contents: read
concurrency:
  group: catalog-refresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  native-scale:
    name: PostgreSQL 17 / ARM64 / 150k articles
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable
          POSTGRES_DB: devfeed_catalog_base_test
        ports:
          - 5432:5432
        options: >-
          --shm-size=512m --cpus=2 --memory=4g
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DEVFEED_TEST_DATABASE_URL: postgresql+psycopg://postgres:disposable@127.0.0.1:5432/devfeed_catalog_base_test
      DEVFEED_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: |
            candidate/uv.lock
            baseline/uv.lock
          cache-suffix: catalog-scale
      - name: Install isolated applications
        run: |
          sh candidate/scripts/ci/python-bootstrap.sh candidate --editable --all-packages
          sh candidate/scripts/ci/python-bootstrap.sh baseline --editable --all-packages
          cp candidate/scripts/profile_catalog_refresh.py baseline/scripts/profile_catalog_refresh.py
          cp candidate/scripts/profile_read_models.py baseline/scripts/profile_read_models.py
      - name: Prepare the shared fixed fixture
        working-directory: baseline
        run: |
          mkdir -p ../reports
          .venv/bin/python scripts/profile_catalog_refresh.py --seed --prepare-only \
            --require-native-arm64 --scale 1 --history-bytes 8192 --batch 200 \
            --output ../reports/prepared.json
          .venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          dataset = json.loads(Path("../reports/prepared.json").read_text())["dataset"]
          assert dataset["articles"] == 150000, dataset
          assert dataset["retained_article_cards"] >= 19679, dataset
          PY
      - name: Clone the fixture before either scenario
        working-directory: candidate
        run: |
          .venv/bin/python - <<'PY'
          import os
          from sqlalchemy import create_engine
          from sqlalchemy.engine import make_url
          url = make_url(os.environ["DEVFEED_TEST_DATABASE_URL"])
          engine = create_engine(url.set(database="postgres"), isolation_level="AUTOCOMMIT")
          with engine.connect() as connection:
              connection.exec_driver_sql(
                  "CREATE DATABASE devfeed_catalog_head_test "
                  "TEMPLATE devfeed_catalog_base_test STRATEGY FILE_COPY"
              )
          engine.dispose()
          PY
      - name: Measure baseline and candidate on the same runner
        run: |
          cd baseline
          .venv/bin/python scripts/profile_catalog_refresh.py --expect either --require-native-arm64 \
            --batch 200 --batches 20 --age-refresh-seconds 61 --output ../reports/baseline.json
          cd ../candidate
          DEVFEED_TEST_DATABASE_URL=postgresql+psycopg://postgres:disposable@127.0.0.1:5432/devfeed_catalog_head_test \
            .venv/bin/python scripts/profile_catalog_refresh.py --expect fixed --require-native-arm64 \
            --batch 200 --batches 20 --age-refresh-seconds 61 --output ../reports/candidate.json
      - name: Summarize behavioral gates
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("Native ARM64 PostgreSQL 17, cloned 150,000-article fixtures.\n\n")
              for path in sorted(Path("reports").glob("*.json")):
                  data = json.loads(path.read_text())
                  summary.write(f"**{path.stem}**\n\n```json\n")
                  summary.write(json.dumps(data.get("gates", {"phase": data.get("phase")}), indent=2))
                  summary.write("\n```\n\n")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: catalog-refresh-arm64-${{ github.run_attempt }}
          path: reports/
          if-no-files-found: error
          retention-days: 30
