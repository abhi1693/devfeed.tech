name: Browser extension release

on:
  push:
    tags: [v*]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag for the release to package
        required: true
        type: string
      skip_asset_sync:
        description: Skip release asset attachment when the release is already immutable
        required: false
        default: false
        type: boolean
      prepare_release:
        description: Prepare signed assets on a draft release (run this workflow from the release tag)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: extension-release-${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verified-ci:
    name: Require successful CI for the release commit
    runs-on: ubuntu-24.04
    # Tag CI includes tests followed by release image builds and scans.
    timeout-minutes: 95
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.sha || inputs.release_tag || github.ref }}
          persist-credentials: false
      - name: Wait for the release-tag CI gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          release_sha="$(git rev-parse HEAD)"
          python3 scripts/ci/require_release_ci.py \
            --repository "$GITHUB_REPOSITORY" --sha "$release_sha" --tag "$RELEASE_TAG" \
            --timeout 5400
  packages:
    name: Build and attach Chrome and Edge packages
    needs: verified-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out the tagged source and release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.sha || inputs.release_tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare a draft release for signed packages
        if: ${{ github.event_name == 'push' || inputs.prepare_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          SKIP_ASSET_SYNC: ${{ inputs.skip_asset_sync }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" || "$SKIP_ASSET_SYNC" == "true" ]]; then
            echo "Draft preparation must run from the release tag with asset sync enabled." >&2
            exit 1
          fi
          python3 scripts/sync_extension_release_assets.py --prepare-draft

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Require an extension version bump for extension-facing changes
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          base_tag="$(git describe --tags --match 'v[0-9]*' --abbrev=0 HEAD^)"
          python3 scripts/check_extension_release.py \
            --base-tag "$base_tag" --release-tag "$RELEASE_TAG"

      - name: Build Chrome and Edge packages
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm run extension:build:all
          python3 apps/extensions/package.py chrome
          python3 apps/extensions/package.py edge

      - name: Verify and attach packages to the GitHub release
        if: ${{ github.event_name != 'push' && !inputs.prepare_release && (github.event_name == 'release' || !inputs.skip_asset_sync) }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: python3 scripts/sync_extension_release_assets.py

      - name: Verify and attach packages to the draft release
        if: ${{ github.event_name == 'push' || inputs.prepare_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: python3 scripts/sync_extension_release_assets.py --draft-only

      - name: Sign extension build provenance
        if: ${{ github.event_name == 'push' || inputs.prepare_release }}
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: apps/extensions/dist/devfeed-*-extension-*.zip
          create-storage-record: false

      - name: Verify and attach the signed provenance bundle
        if: ${{ github.event_name == 'push' || inputs.prepare_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: python3 scripts/sync_extension_release_assets.py --attach-attestation "$ATTESTATION_BUNDLE"

      - name: Submit packages to browser stores
        if: ${{ github.event_name != 'push' && !inputs.prepare_release && (github.event_name == 'release' || inputs.skip_asset_sync) }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          CWS_SERVICE_ACCOUNT_JSON: ${{ secrets.CWS_SERVICE_ACCOUNT_JSON }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          EDGE_ADDONS_API_KEY: ${{ secrets.EDGE_ADDONS_API_KEY }}
          EDGE_ADDONS_CLIENT_ID: ${{ vars.EDGE_ADDONS_CLIENT_ID }}
          EDGE_ADDONS_PRODUCT_ID: ${{ vars.EDGE_ADDONS_PRODUCT_ID }}
        run: node scripts/publish_extension_stores.mjs
