name: Containers
on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  images:
    uses: abhi1693/actions/.github/workflows/container-images.yml@98222de88f6768904e43a1a92a32e2bdc9a16e4c
    with:
      manifest: .github/images.json
      publish: ${{ inputs.publish }}
      version-file: pyproject.toml
      latest: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
