name: Containers
on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  images:
    uses: abhi1693/actions/.github/workflows/container-images.yml@34e92ba1eee6a47e9b10f13e2180114fc01b6027
    with:
      manifest: .github/images.json
      publish: ${{ inputs.publish }}
      version-file: pyproject.toml
      latest: false
      release-tag-prefix: v
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
