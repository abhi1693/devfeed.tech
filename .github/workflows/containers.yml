name: Containers
on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  images:
    uses: abhi1693/actions/.github/workflows/container-images.yml@v1
    with:
      manifest: .github/images.json
      publish: ${{ inputs.publish }}
      version-file: pyproject.toml
      latest: false
      trusted-branches: ${{ github.event_name == 'workflow_dispatch' && format('["master",{0}]', toJSON(github.ref_name)) || '["master"]' }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
