name: Containers

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  metadata:
    name: Resolve image version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the application version
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$REF_TYPE" = tag ]; then test "$REF_NAME" = "v$version"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-backend:
    name: Build Backend API and workers (ARM64)
    if: inputs.publish
    needs: metadata
    uses: abhi1693/actions/.github/workflows/docker-build-push.yml@88a3b7801601645e3d08e8b2994823057015af9d
    permissions:
      contents: read
      packages: write
    with:
      image-title: Backend
      matrix: |
        [
          {"runner": "ubuntu-24.04-arm", "platform": "linux/arm64"}
        ]
      image: ghcr.io/${{ github.repository }}/backend
      flavor: latest=false
      tags: type=raw,value=candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      file: Dockerfile
      cache-scope: backend
      labels: |
        org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
        org.opencontainers.image.revision=${{ github.sha }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  build-admin-api:
    name: Build Admin API (ARM64)
    if: inputs.publish
    needs: metadata
    uses: abhi1693/actions/.github/workflows/docker-build-push.yml@88a3b7801601645e3d08e8b2994823057015af9d
    permissions:
      contents: read
      packages: write
    with:
      image-title: Admin API
      matrix: |
        [
          {"runner": "ubuntu-24.04-arm", "platform": "linux/arm64"}
        ]
      image: ghcr.io/${{ github.repository }}/admin-api
      flavor: latest=false
      tags: type=raw,value=candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      file: apps/admin-api/Dockerfile
      cache-scope: admin-api
      labels: |
        org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
        org.opencontainers.image.revision=${{ github.sha }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  build-user-api:
    name: Build User API (ARM64)
    if: inputs.publish
    needs: metadata
    uses: abhi1693/actions/.github/workflows/docker-build-push.yml@88a3b7801601645e3d08e8b2994823057015af9d
    permissions:
      contents: read
      packages: write
    with:
      image-title: User API
      matrix: |
        [
          {"runner": "ubuntu-24.04-arm", "platform": "linux/arm64"}
        ]
      image: ghcr.io/${{ github.repository }}/user-api
      flavor: latest=false
      tags: type=raw,value=candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      file: apps/user-api/Dockerfile
      cache-scope: user-api
      labels: |
        org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
        org.opencontainers.image.revision=${{ github.sha }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  build-admin:
    name: Build Admin app (ARM64)
    if: inputs.publish
    needs: metadata
    uses: abhi1693/actions/.github/workflows/docker-build-push.yml@88a3b7801601645e3d08e8b2994823057015af9d
    permissions:
      contents: read
      packages: write
    with:
      image-title: Admin UI
      matrix: |
        [
          {"runner": "ubuntu-24.04-arm", "platform": "linux/arm64"}
        ]
      image: ghcr.io/${{ github.repository }}/admin
      flavor: latest=false
      tags: type=raw,value=candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      file: apps/admin/Dockerfile
      cache-scope: admin
      labels: |
        org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
        org.opencontainers.image.revision=${{ github.sha }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  build-web:
    name: Build User app (ARM64)
    if: inputs.publish
    needs: metadata
    uses: abhi1693/actions/.github/workflows/docker-build-push.yml@88a3b7801601645e3d08e8b2994823057015af9d
    permissions:
      contents: read
      packages: write
    with:
      image-title: User UI
      matrix: |
        [
          {"runner": "ubuntu-24.04-arm", "platform": "linux/arm64"}
        ]
      image: ghcr.io/${{ github.repository }}/web
      flavor: latest=false
      tags: type=raw,value=candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      file: apps/web/Dockerfile
      cache-scope: web
      labels: |
        org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
        org.opencontainers.image.revision=${{ github.sha }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  build-codex:
    name: Build Codex service (ARM64)
    if: inputs.publish
    needs: metadata
    uses: abhi1693/actions/.github/workflows/docker-build-push.yml@88a3b7801601645e3d08e8b2994823057015af9d
    permissions:
      contents: read
      packages: write
    with:
      image-title: Codex service
      matrix: |
        [
          {"runner": "ubuntu-24.04-arm", "platform": "linux/arm64"}
        ]
      image: ghcr.io/${{ github.repository }}/codex
      flavor: latest=false
      tags: type=raw,value=candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      file: infra/codex/Dockerfile
      cache-scope: codex
      labels: |
        org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
        org.opencontainers.image.revision=${{ github.sha }}
    secrets:
      github-token: ${{ secrets.GITHUB_TOKEN }}

  verify:
    name: ${{ matrix.title }} — ${{ matrix.arch }} scan and smoke test
    needs: [metadata, build-backend, build-admin-api, build-user-api, build-admin, build-web, build-codex]
    if: >-
      ${{ !cancelled() && needs.metadata.result == 'success' &&
          (!inputs.publish ||
           (needs.build-backend.result == 'success' &&
            needs.build-admin-api.result == 'success' && needs.build-user-api.result == 'success' && needs.build-admin.result == 'success' && needs.build-web.result == 'success' && needs.build-codex.result == 'success')) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      TRIVY_PLATFORM: linux/${{ matrix.arch }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        component: [backend, admin-api, user-api, admin, web, codex]
        arch: [arm64]
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - component: backend
            title: Backend
            file: Dockerfile
          - component: admin-api
            title: Admin API
            file: apps/admin-api/Dockerfile
          - component: user-api
            title: User API
            file: apps/user-api/Dockerfile
          - component: admin
            title: Admin UI
            file: apps/admin/Dockerfile
          - component: web
            title: User UI
            file: apps/web/Dockerfile
          - component: codex
            title: Codex service
            file: infra/codex/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: inputs.publish
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build locally or pull the exact published digest
        id: image
        env:
          PUBLISH: ${{ inputs.publish }}
          COMPONENT: ${{ matrix.component }}
          ARCH: ${{ matrix.arch }}
          DOCKERFILE: ${{ matrix.file }}
          BACKEND_DIGEST: ${{ needs.build-backend.outputs.digest }}
          ADMIN_API_DIGEST: ${{ needs.build-admin-api.outputs.digest }}
          USER_API_DIGEST: ${{ needs.build-user-api.outputs.digest }}
          ADMIN_DIGEST: ${{ needs.build-admin.outputs.digest }}
          CODEX_DIGEST: ${{ needs.build-codex.outputs.digest }}
          WEB_DIGEST: ${{ needs.build-web.outputs.digest }}
        run: |
          mkdir -p reports
          if [ "$PUBLISH" = true ]; then
            case "$COMPONENT" in
              backend) digest=$BACKEND_DIGEST ;;
              admin-api) digest=$ADMIN_API_DIGEST ;;
              user-api) digest=$USER_API_DIGEST ;;
              admin) digest=$ADMIN_DIGEST ;;
              web) digest=$WEB_DIGEST ;;
              codex) digest=$CODEX_DIGEST ;;
            esac
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            image="ghcr.io/${GITHUB_REPOSITORY}/${COMPONENT}@${digest}"
            docker buildx imagetools inspect "$image" --raw > reports/index.json
            python scripts/ci/check_image_index.py reports/index.json
            docker pull --platform "linux/$ARCH" "$image"
          else
            image="devfeed-${COMPONENT}:check"
            docker build --platform "linux/$ARCH" -f "$DOCKERFILE" -t "$image" .
          fi
          docker image inspect "$image" --format '{{json .}}' |
            jq '{Id, Architecture, Os, Size}' > reports/image-size.json
          jq -r '"Runtime image: \(.Size / 1000000 | floor) MB (uncompressed), \(.Os)/\(.Architecture)"' \
            reports/image-size.json >> "$GITHUB_STEP_SUMMARY"
          echo "ref=$image" >> "$GITHUB_OUTPUT"
      - name: Generate the platform SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ steps.image.outputs.ref }}
          format: cyclonedx
          output: reports/sbom.cdx.json
          scanners: vuln
          timeout: 15m
      - name: Block vulnerable runtime images
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ steps.image.outputs.ref }}
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          scanners: vuln,secret
          exit-code: '1'
          format: json
          output: reports/trivy.json
          timeout: 15m
      - name: Smoke-test the actual runtime image
        if: ${{ !cancelled() && steps.image.outcome == 'success' }}
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          COMPONENT: ${{ matrix.component }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: bash scripts/ci/smoke-image.sh "$IMAGE" "$COMPONENT" "$ARCH" "$VERSION"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: image-${{ matrix.component }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: reports
          if-no-files-found: error
          retention-days: 30

  attest:
    name: Attest ${{ matrix.component }} image
    needs: [verify, build-backend, build-admin-api, build-user-api, build-admin, build-web, build-codex]
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, admin-api, user-api, admin, web, codex]
    steps:
      - name: Select verified digest
        id: digest
        env:
          COMPONENT: ${{ matrix.component }}
          BACKEND: ${{ needs.build-backend.outputs.digest }}
          ADMIN_API: ${{ needs.build-admin-api.outputs.digest }}
          USER_API: ${{ needs.build-user-api.outputs.digest }}
          ADMIN: ${{ needs.build-admin.outputs.digest }}
          CODEX: ${{ needs.build-codex.outputs.digest }}
          WEB: ${{ needs.build-web.outputs.digest }}
        run: |
          case "$COMPONENT" in
            backend) digest=$BACKEND ;;
            admin-api) digest=$ADMIN_API ;;
            user-api) digest=$USER_API ;;
            admin) digest=$ADMIN ;;
            web) digest=$WEB ;;
            codex) digest=$CODEX ;;
          esac
          echo "value=$digest" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.component }}
          subject-digest: ${{ steps.digest.outputs.value }}
          push-to-registry: true

  image-manifest:
    name: Publish verified branch or release tags
    needs: [metadata, verify, attest, build-backend, build-admin-api, build-user-api, build-admin, build-web, build-codex]
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-images-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Record the verified image set for downstream deployment
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          BACKEND_TAG: ${{ needs.build-backend.outputs.tags }}
          ADMIN_API_TAG: ${{ needs.build-admin-api.outputs.tags }}
          USER_API_TAG: ${{ needs.build-user-api.outputs.tags }}
          ADMIN_TAG: ${{ needs.build-admin.outputs.tags }}
          CODEX_TAG: ${{ needs.build-codex.outputs.tags }}
          WEB_TAG: ${{ needs.build-web.outputs.tags }}
          BACKEND: ${{ needs.build-backend.outputs.digest }}
          ADMIN_API: ${{ needs.build-admin-api.outputs.digest }}
          USER_API: ${{ needs.build-user-api.outputs.digest }}
          ADMIN: ${{ needs.build-admin.outputs.digest }}
          CODEX: ${{ needs.build-codex.outputs.digest }}
          WEB: ${{ needs.build-web.outputs.digest }}
        run: |
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg revision "$GITHUB_SHA" \
            --arg version "$VERSION" --arg run_id "$GITHUB_RUN_ID" \
            --arg codex_tag "$CODEX_TAG" --arg backend_tag "$BACKEND_TAG" --arg admin_api_tag "$ADMIN_API_TAG" --arg user_api_tag "$USER_API_TAG" --arg admin_tag "$ADMIN_TAG" --arg web_tag "$WEB_TAG" \
            --arg codex "$CODEX" --arg backend "$BACKEND" --arg admin_api "$ADMIN_API" --arg user_api "$USER_API" --arg admin "$ADMIN" --arg web "$WEB" \
            '{schema_version: 1, repository: $repository, revision: $revision,
              version: $version, run_id: $run_id,
              build_tags: {codex: $codex_tag, backend: $backend_tag, "admin-api": $admin_api_tag, "user-api": $user_api_tag, admin: $admin_tag, web: $web_tag},
              platforms: ["linux/arm64"],
              images: {codex: ("ghcr.io/" + $repository + "/codex@" + $codex), backend: ("ghcr.io/" + $repository + "/backend@" + $backend),
                "admin-api": ("ghcr.io/" + $repository + "/admin-api@" + $admin_api),
                "user-api": ("ghcr.io/" + $repository + "/user-api@" + $user_api),
                admin: ("ghcr.io/" + $repository + "/admin@" + $admin),
                web: ("ghcr.io/" + $repository + "/web@" + $web)}}' > image-manifest.json
      - name: Advance branch tags or create immutable release tags
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python scripts/ci/publish_images.py image-manifest.json --ref-type "$REF_TYPE" --ref-name "$REF_NAME"
          cat image-manifest.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-manifest-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: image-manifest.json
          if-no-files-found: error
          retention-days: 90
