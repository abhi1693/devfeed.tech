name: Weekly audits
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies:
    uses: abhi1693/actions/.github/workflows/security.yml@bf8cd38aa8456310278ed96bfa83a3132f235df1 # v1.0.4
    permissions:
      contents: read
      security-events: write
    with:
      secret-scan: false
      workflow-lint: false
      node-version: "26.12.1"
      python-version: "3.12"
      uv-version: 0.13.5
      npm-audit: true
      python-audit: true
      python-all-packages: true
  codex:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1
        with:
          node-version: "26.12.1"
      - run: npm audit --prefix infra/codex --omit=dev --audit-level=high
  release:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.manifest.outputs.images }}
    steps:
      - name: Read the published release image list
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          images=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/images.json?ref=$tag" \
            -H 'Accept: application/vnd.github.raw+json' | \
            jq -ce --arg version "${tag#v}" '[.images[] | .image + ":" + $version] | select(length > 0)')
          echo "images=$images" >> "$GITHUB_OUTPUT"
  images:
    needs: release
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.release.outputs.images) }}
    steps:
      - name: Audit published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.0
          image-ref: ${{ matrix.image }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          timeout: 15m
