name: ZAP
on:
  schedule:
    # Active attacks add coverage beyond the passive release gate; run only this suite nightly.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [passive, active]
        default: passive
  workflow_call:
    inputs:
      mode:
        type: string
        default: passive
permissions:
  contents: read
concurrency:
  group: zap-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  scan:
    name: Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SCAN_MODE: ${{ github.event_name == 'schedule' && 'active' || inputs.mode || 'passive' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.10"
          enable-cache: true
      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: |
          uv sync --all-packages --locked
          npm ci
          npx playwright install --with-deps chromium
      - name: Scan
        run: uv run --locked python scripts/ci/dast.py --mode "$SCAN_MODE"
      - name: Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/dast/results.json
            reports/dast/summary.md
          if-no-files-found: error
          retention-days: 14
