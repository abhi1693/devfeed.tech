name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # Never interrupt a publishing run halfway through its image set.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  containers:
    needs: [tests, security]
    uses: ./.github/workflows/containers.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      publish: >-
        ${{ (github.event_name == 'push' &&
             (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) ||
            (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') }}

  required:
    name: CI required
    if: always()
    needs: [tests, security, containers]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every gate to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
