name: CI
on:
  push:
    branches:
      - master
    tags:
      - v*
  pull_request: null
  merge_group: null
  workflow_dispatch: null
  schedule:
    - cron: 23 4 * * 1
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # Keep immutable release runs; only the newest branch/PR revision needs validation.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  # Backend and frontend start independently. Only unit work runs in this stage.
  python-lint:
    name: Unit / Python lint, types and versions (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.1"
          enable-cache: true
      - run: sh scripts/ci/python-bootstrap.sh . --editable --all-packages
      - run: bash .github/scripts/python-checks.sh
  python-unit-shards:
    name: Unit / Python shard ${{ matrix.shard }} (ARM64)
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    uses: abhi1693/actions/.github/workflows/python-ci.yml@bf8cd38aa8456310278ed96bfa83a3132f235df1 # v1.0.4
    with:
      runs-on: ubuntu-24.04-arm
      timeout-minutes: 30
      python-version: "3.12"
      node-version: "24"
      enable-cache: true
      uv-version: 0.13.1
      sync-command: sh scripts/ci/python-bootstrap.sh . --editable --all-packages
      test-command: bash scripts/ci/python-tests.sh unit ${{ matrix.shard }} 4
      test-results-path: |
        reports/python-unit-${{ matrix.shard }}.xml
        reports/coverage/python-unit-${{ matrix.shard }}/
      test-results-name: unit-shard-${{ matrix.shard }}-arm64-${{ github.run_attempt }}
  python-unit:
    name: Unit / Combined backend coverage (ARM64)
    needs: python-unit-shards
    if: always() && !cancelled()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.1"
          enable-cache: true
      - run: sh scripts/ci/python-bootstrap.sh . --editable --all-packages
      - name: Download every unit shard from this attempt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: unit-shard-*-arm64-${{ github.run_attempt }}
          path: reports/
          merge-multiple: true
      - name: Validate unit shards and enforce combined coverage
        env:
          UNIT_SHARDS_RESULT: ${{ needs.python-unit-shards.result }}
        run: |
          test "$UNIT_SHARDS_RESULT" = success
          bash scripts/ci/python-tests.sh unit-merge 0 4
      - name: Upload canonical unit reports
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-unit-arm64-${{ github.run_attempt }}
          path: |
            reports/python-unit.xml
            reports/coverage/python-unit/coverage.db
            reports/coverage/unit.json
            reports/coverage/unit.xml
            reports/coverage/html/
            reports/coverage/summary.json
            reports/coverage/summary.md
          if-no-files-found: error
  python-loadtest:
    name: Unit / Loadtest histogram contracts (ARM64)
    uses: abhi1693/actions/.github/workflows/python-ci.yml@bf8cd38aa8456310278ed96bfa83a3132f235df1 # v1.0.4
    with:
      runs-on: ubuntu-24.04-arm
      timeout-minutes: 10
      python-version: "3.12"
      uv-version: 0.13.1
      sync-command: sh scripts/ci/python-bootstrap.sh . --editable --all-packages --group loadtest
      test-command: |
        mkdir -p reports/coverage/python-loadtest
        COVERAGE_FILE=reports/coverage/python-loadtest/coverage.db \
          uv run --locked --no-sync --no-build coverage run --source=loadtests loadtests/test_histogram.py
      test-results-path: reports/
      test-results-name: python-loadtest-arm64-${{ github.run_attempt }}
  coverage-report:
    name: Report / Backend unit coverage PR comment
    needs: python-unit
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # No checkout: downloaded reports are data, never executable code.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: python-unit-arm64-*
          path: report
          merge-multiple: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          UNIT_RESULT: ${{ needs.python-unit.result }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- devfeed-backend-unit-coverage -->';
            const pr = context.payload.pull_request;
            const current = await github.rest.pulls.get({...context.repo, pull_number: pr.number});
            if (current.data.head.sha !== pr.head.sha) return;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const workspaces = [
              'apps/admin-api', 'apps/aggregator', 'apps/api', 'apps/article-enrichment-worker',
              'apps/cli', 'apps/images-worker', 'apps/mcp', 'apps/notifications', 'apps/partner-api',
              'apps/search-indexer', 'apps/source-discovery-worker', 'apps/user-api',
              'packages/core', 'packages/http'
            ];
            const counters = ['covered_lines', 'num_statements', 'covered_branches', 'num_branches'];
            const integer = value => Number.isSafeInteger(value) && value >= 0;
            const metrics = value => {
              if (!value || !counters.every(key => integer(value[key])) ||
                  value.covered_lines > value.num_statements || value.covered_branches > value.num_branches) {
                throw new Error('Invalid coverage counts');
              }
              const percent = (covered, total) => total ? 100 * covered / total : 100;
              return [percent(value.covered_lines, value.num_statements),
                percent(value.covered_branches, value.num_branches),
                percent(value.covered_lines + value.covered_branches, value.num_statements + value.num_branches)];
            };
            let summary, measured;
            try {
              // A report-only rerun reuses the successful unit job's earlier artifact.
              const attempt = Number(process.env.GITHUB_RUN_ATTEMPT);
              // download-artifact flattens a single match, even with merge-multiple: false.
              const flat = fs.existsSync('report/coverage/summary.json');
              const artifacts = flat ? [] : fs.readdirSync('report')
                .map(name => /^python-unit-arm64-(\d+)$/.exec(name))
                .filter(Boolean).map(match => Number(match[1]))
                .filter(value => integer(value) && value > 0 && value <= attempt);
              const artifactAttempt = Math.max(...artifacts);
              if (!flat && (!integer(artifactAttempt) ||
                  (process.env.UNIT_RESULT !== 'success' && artifactAttempt !== attempt))) {
                throw new Error('No matching unit artifact');
              }
              const file = flat ? 'report/coverage/summary.json' :
                `report/python-unit-arm64-${artifactAttempt}/coverage/summary.json`;
              const raw = fs.readFileSync(file, 'utf8');
              if (raw.length > 30000) throw new Error('Oversized coverage report');
              summary = JSON.parse(raw);
              if (!integer(summary.unit_attempt) || summary.unit_attempt < 1 ||
                  summary.unit_attempt > attempt || (!flat && summary.unit_attempt !== artifactAttempt) ||
                  (process.env.UNIT_RESULT !== 'success' && summary.unit_attempt !== attempt)) {
                throw new Error('Coverage belongs to a different unit attempt');
              }
              if (summary.schema !== 1 || summary.valid !== true ||
                  !['passed', 'failed'].includes(summary.status) ||
                  !Number.isFinite(summary.minimum) || summary.minimum <= 0 || summary.minimum > 100 ||
                  !integer(summary.unit_exit_code) || !integer(summary.source_files) || !summary.source_files ||
                  Object.keys(summary.packages).sort().join('|') !== workspaces.join('|')) {
                throw new Error('Incomplete coverage report');
              }
              measured = metrics(summary.totals);
              if (!summary.totals.num_statements) throw new Error('Empty coverage report');
              const sum = Object.fromEntries(counters.map(key => [key, 0]));
              for (const name of workspaces) {
                metrics(summary.packages[name]);
                for (const key of counters) sum[key] += summary.packages[name][key];
              }
              if (!counters.every(key => sum[key] === summary.totals[key])) throw new Error('Inconsistent totals');
              const tests = summary.tests;
              if (!tests || !['total', 'passed', 'failed', 'skipped'].every(key => integer(tests[key])) ||
                  !tests.total || tests.total !== tests.passed + tests.failed + tests.skipped) {
                throw new Error('Invalid unit test counts');
              }
            } catch {
              summary = null;
            }
            const lines = [marker, '### Backend unit coverage', ''];
            if (summary) {
              const tests = summary.tests;
              const passed = process.env.UNIT_RESULT === 'success' && summary.status === 'passed' &&
                summary.unit_exit_code === 0 && tests.failed === 0 && tests.skipped === 0 &&
                Number(measured[2].toFixed(2)) >= summary.minimum;
              lines.push(`**${passed ? 'PASS' : 'FAIL'}** · minimum combined coverage **${summary.minimum.toFixed(2)}%**.`, '',
                `Tests: ${tests.passed} passed, ${tests.failed} failed, ${tests.skipped} skipped. Source files: ${summary.source_files}.`, '',
                '| Workspace | Lines | Branches | Combined |', '| --- | ---: | ---: | ---: |');
              const row = (name, values) => `| ${name} | ${values.map(value => `${value.toFixed(2)}%`).join(' | ')} |`;
              lines.push(row('All backend code', measured));
              for (const name of workspaces) lines.push(row(name, metrics(summary.packages[name])));
              lines.push('', 'Unit coverage includes every backend workspace. PostgreSQL/Redis integration tests run separately.');
            } else {
              lines.push('**Coverage unavailable:** no valid unit coverage artifact could be loaded. Inspect the Python unit and coverage-report logs; this does not count as a passing coverage check.');
            }
            lines.push('', `Commit: ${pr.head.sha.slice(0, 12)} · [HTML, JSON, XML reports and job logs](${url}) · attempt ${process.env.GITHUB_RUN_ATTEMPT}`);
            const body = lines.join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number: pr.number});
            const previous = comments.find(comment => comment.user.type === 'Bot' && comment.body?.startsWith(marker));
            const latest = await github.rest.pulls.get({...context.repo, pull_number: pr.number});
            if (latest.data.head.sha !== pr.head.sha) return;
            if (previous) {
              await github.rest.issues.updateComment({...context.repo, comment_id: previous.id, body});
            } else {
              await github.rest.issues.createComment({...context.repo, issue_number: pr.number, body});
            }
            if (!summary) core.setFailed('Backend coverage artifact is missing or invalid');
  admin-web:
    uses: abhi1693/actions/.github/workflows/node-ci.yml@bf8cd38aa8456310278ed96bfa83a3132f235df1 # v1.0.4
    with:
      checks: '["generate", "lint", "test", "build"]'
      scripts: '{"generate": "admin:generate", "lint": "admin:lint", "test": "ci:admin-web-test", "build": "admin:build"}'
      timeout-minutes: 20
      runs-on: ubuntu-24.04-arm
      node-version: "24"
      build-cache-paths: |
        apps/admin/.next/cache/turbopack
        apps/admin/.next/cache/webpack
        apps/admin/.next/cache/swc
        apps/admin/.next/cache/.tsbuildinfo
      build-cache-scope: next-admin-unit-v1
      project-env: '{"NEXT_TELEMETRY_DISABLED":"1","DEVFEED_DATABASE_URL":"postgresql+psycopg://ci@database.invalid/ci","DEVFEED_REDIS_URL":"redis://redis.invalid/15"}'
      test-results-path: |
        reports/admin.xml
        reports/coverage/admin/lcov.info
      test-results-name: admin-test-results-${{ github.run_attempt }}
      python-version: "3.12"
      uv-version: 0.13.1
      uv-sync-args: '["--all-packages"]'
      generated-paths: '["apps/admin/openapi.json","apps/admin/src/lib/api/generated"]'
    name: Unit / Admin UI lint, tests and build
  partner-web:
    name: Unit / Partner portal lint, tests and build
    uses: abhi1693/actions/.github/workflows/node-ci.yml@bf8cd38aa8456310278ed96bfa83a3132f235df1 # v1.0.4
    with:
      checks: '["lint", "test", "build"]'
      scripts: '{"lint": "partner:lint", "test": "ci:partner-test", "build": "partner:build"}'
      timeout-minutes: 20
      runs-on: ubuntu-24.04-arm
      node-version: "24"
      build-cache-paths: |
        apps/partner/.next/cache/turbopack
        apps/partner/.next/cache/webpack
        apps/partner/.next/cache/swc
        apps/partner/.next/cache/.tsbuildinfo
      build-cache-scope: next-partner-browser-v1
      test-results-path: |
        reports/partner.xml
        reports/coverage/partner/lcov.info
      test-results-name: partner-test-results-${{ github.run_attempt }}
      project-env: '{"NEXT_TELEMETRY_DISABLED":"1"}'
  user-web:
    uses: abhi1693/actions/.github/workflows/node-ci.yml@bf8cd38aa8456310278ed96bfa83a3132f235df1 # v1.0.4
    with:
      checks: '["lint", "test", "build"]'
      scripts: '{"lint": "web:lint", "test": "ci:user-web-test", "build": "web:build"}'
      timeout-minutes: 15
      runs-on: ubuntu-24.04-arm
      node-version: "24"
      build-cache-paths: |
        apps/web/.next/cache/turbopack
        apps/web/.next/cache/webpack
        apps/web/.next/cache/swc
        apps/web/.next/cache/.tsbuildinfo
      build-cache-scope: next-web-unit-v1
      project-env: '{"NEXT_TELEMETRY_DISABLED":"1"}'
      test-results-path: |
        reports/user.xml
        reports/coverage/web/lcov.info
      test-results-name: user-test-results-${{ github.run_attempt }}
    name: Unit / User UI lint, tests and build
  extensions:
    name: Unit / Browser extension types, tests and builds
    uses: abhi1693/actions/.github/workflows/node-ci.yml@bf8cd38aa8456310278ed96bfa83a3132f235df1 # v1.0.4
    with:
      checks: '["lint", "test", "build"]'
      scripts: '{"lint": "extension:check", "test": "extension:test", "build": "extension:build:all"}'
      timeout-minutes: 10
      runs-on: ubuntu-24.04-arm
      node-version: "24"
  backend-unit:
    name: Stage / Backend unit checks
    needs: [python-lint, python-unit, python-loadtest]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - name: Require backend unit checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: >-
          echo "$RESULTS" | jq -e
          '[.["python-lint"], .["python-unit"], .["python-loadtest"]] | all(.result == "success")'
  frontend-unit:
    name: Stage / Frontend unit checks
    needs: [admin-web, partner-web, user-web, extensions]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - name: Require frontend unit checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: >-
          echo "$RESULTS" | jq -e
          '[.["admin-web"], .["partner-web"], .["user-web"], .extensions] | all(.result == "success")'
  api-compat:
    name: API compatibility
    needs: backend-unit
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      CANDIDATE_SHA: ${{ github.sha }}
      OASDIFF_CONFIG: .oasdiff.yaml
      DEVFEED_DATABASE_URL: postgresql+psycopg://schema@database.invalid/schema
      DEVFEED_REDIS_URL: redis://redis.invalid/15
      OTEL_SDK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect
        id: changes
        run: |
          git diff --name-only "$BASE_SHA" "$CANDIDATE_SHA" -- \
            apps/api apps/user-api apps/admin-api apps/mcp packages/core packages/http \
            apps/admin/openapi.json pyproject.toml uv.lock .env.example \
            scripts/ci/api_contracts.py tests/test_api_compatibility.py tests/test_api_contracts.py \
            .oasdiff.yaml .github/api-compatibility .github/workflows/ci.yml > "$RUNNER_TEMP/api-files.txt"
          if [[ -s "$RUNNER_TEMP/api-files.txt" ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'API compatibility: no API-affecting changes.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Base
        if: steps.changes.outputs.changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          path: .api-base
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.changes.outputs.changed == 'true'
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.changes.outputs.changed == 'true'
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Tool
        if: steps.changes.outputs.changed == 'true'
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --output "$RUNNER_TEMP/oasdiff.tar.gz" \
            https://github.com/oasdiff/oasdiff/releases/download/v1.33.0/oasdiff_1.33.0_linux_amd64.tar.gz
          printf '%s  %s\n' \
            43a4e328e2d13ba1552d760aa68d2485c75c5621f309f6ff64ae895188345247 \
            "$RUNNER_TEMP/oasdiff.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/oasdiff.tar.gz" -C "$RUNNER_TEMP" oasdiff
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Head schemas
        id: head
        if: steps.changes.outputs.changed == 'true'
        run: |
          sh scripts/ci/python-bootstrap.sh . --editable --all-packages
          uv run --no-sync --no-build --locked python scripts/ci/api_contracts.py export head
      - name: Base schemas
        id: base
        if: steps.changes.outputs.changed == 'true'
        run: |
          sh scripts/ci/python-bootstrap.sh .api-base --editable --all-packages
          uv run --directory .api-base --no-sync --no-build --locked python \
            "$GITHUB_WORKSPACE/scripts/ci/api_contracts.py" export \
            base
      - name: Probes
        id: probes
        if: steps.changes.outputs.changed == 'true'
        run: uv run --no-sync --no-build --locked python scripts/ci/api_contracts.py verify
      - name: Check public API
        id: public
        if: ${{ !cancelled() && steps.probes.outcome == 'success' }}
        uses: oasdiff/oasdiff-action/breaking@b9325c9e0a27ab65b0da3b766522cedec6be81dc # v0.1.18
        with:
          base: reports/api-compatibility/base/public.json
          revision: reports/api-compatibility/head/public.json
          fail-on: WARN
          flatten-allof: true
          allow-external-refs: false
          review: false
          github-token: ""
          output-to-file: reports/api-compatibility/public.breaking.txt
      - name: Check user API
        id: user
        if: ${{ !cancelled() && steps.probes.outcome == 'success' }}
        uses: oasdiff/oasdiff-action/breaking@b9325c9e0a27ab65b0da3b766522cedec6be81dc # v0.1.18
        with:
          base: reports/api-compatibility/base/user.json
          revision: reports/api-compatibility/head/user.json
          fail-on: WARN
          flatten-allof: true
          allow-external-refs: false
          review: false
          github-token: ""
          output-to-file: reports/api-compatibility/user.breaking.txt
      - name: Check admin API
        id: admin
        if: ${{ !cancelled() && steps.probes.outcome == 'success' }}
        uses: oasdiff/oasdiff-action/breaking@b9325c9e0a27ab65b0da3b766522cedec6be81dc # v0.1.18
        with:
          base: reports/api-compatibility/base/admin.json
          revision: reports/api-compatibility/head/admin.json
          fail-on: WARN
          flatten-allof: true
          allow-external-refs: false
          review: false
          github-token: ""
          output-to-file: reports/api-compatibility/admin.breaking.txt
      - name: Check public MCP
        id: mcp_public
        if: ${{ !cancelled() && steps.probes.outcome == 'success' }}
        uses: oasdiff/oasdiff-action/breaking@b9325c9e0a27ab65b0da3b766522cedec6be81dc # v0.1.18
        with:
          base: reports/api-compatibility/base/mcp-public.json
          revision: reports/api-compatibility/head/mcp-public.json
          fail-on: WARN
          flatten-allof: true
          allow-external-refs: false
          review: false
          github-token: ""
          output-to-file: reports/api-compatibility/mcp-public.breaking.txt
      - name: Check account MCP
        id: mcp_account
        if: ${{ !cancelled() && steps.probes.outcome == 'success' }}
        uses: oasdiff/oasdiff-action/breaking@b9325c9e0a27ab65b0da3b766522cedec6be81dc # v0.1.18
        with:
          base: reports/api-compatibility/base/mcp-account.json
          revision: reports/api-compatibility/head/mcp-account.json
          fail-on: WARN
          flatten-allof: true
          allow-external-refs: false
          review: false
          github-token: ""
          output-to-file: reports/api-compatibility/mcp-account.breaking.txt
      - name: API summary
        if: always() && steps.changes.outputs.changed == 'true'
        env:
          API_PUBLIC_RESULT: ${{ steps.public.outcome }}
          API_USER_RESULT: ${{ steps.user.outcome }}
          API_ADMIN_RESULT: ${{ steps.admin.outcome }}
          API_MCP_PUBLIC_RESULT: ${{ steps.mcp_public.outcome }}
          API_MCP_ACCOUNT_RESULT: ${{ steps.mcp_account.outcome }}
        run: |
          {
            echo '### API compatibility'
            echo
            echo '| Contract | Result |'
            echo '| --- | --- |'
            printf '| public | %s |\n' "$API_PUBLIC_RESULT"
            printf '| user | %s |\n' "$API_USER_RESULT"
            printf '| admin | %s |\n' "$API_ADMIN_RESULT"
            printf '| mcp-public | %s |\n' "$API_MCP_PUBLIC_RESULT"
            printf '| mcp-account | %s |\n' "$API_MCP_ACCOUNT_RESULT"
            echo
            echo 'Compared generated PR base and merge-candidate schemas using their own locked dependencies.'
            echo 'WARN and ERR findings fail CI. Schemas and reports are in the api-compatibility artifact.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload API reports
        if: always() && steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-compatibility-${{ github.run_attempt }}
          path: reports/api-compatibility
          if-no-files-found: error
          retention-days: 14
  api-fuzz:
    needs: backend-unit
    name: API fuzzing
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    uses: abhi1693/actions/.github/workflows/python-ci.yml@bf8cd38aa8456310278ed96bfa83a3132f235df1 # v1.0.4
    with:
      runs-on: ubuntu-24.04-arm
      timeout-minutes: 15
      python-version: "3.12"
      uv-version: 0.13.1
      sync-command: sh scripts/ci/python-bootstrap.sh . --editable --all-packages --group fuzz
      test-command: uv run --group fuzz --locked --no-sync --no-build python scripts/ci/api_fuzz.py --profile pr
      test-results-path: reports/api-fuzz/
      test-results-name: api-fuzz-pr-${{ github.run_attempt }}
  # Backend integration starts only after the complete backend unit coverage gate.
  python-integration:
    name: Integration / Python shard ${{ matrix.shard }} (ARM64)
    needs: backend-unit
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    uses: abhi1693/actions/.github/workflows/python-ci.yml@bf8cd38aa8456310278ed96bfa83a3132f235df1 # v1.0.4
    with:
      runs-on: ubuntu-24.04-arm
      timeout-minutes: 30
      python-version: "3.12"
      enable-cache: true
      uv-version: 0.13.1
      sync-command: sh scripts/ci/python-bootstrap.sh . --editable --all-packages
      test-command: bash scripts/ci/python-tests.sh integration ${{ matrix.shard }} 6
      test-results-path: |
        reports/python-integration-${{ matrix.shard }}.xml
        reports/coverage/python-integration-${{ matrix.shard }}/coverage.db
      test-results-name: python-integration-${{ matrix.shard }}-arm64-${{ github.run_attempt }}
  # Check upgrades separately from tests that start with an empty current schema.
  migration-upgrade:
    name: Integration / Populated database upgrades
    needs: backend-unit
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.1"
          enable-cache: true
      - run: sh scripts/ci/python-bootstrap.sh . --editable --all-packages
      - name: Upgrade the previous release and populated legacy schemas
        shell: bash
        run: |
          mkdir -p reports
          uv run --locked --no-sync --no-build python scripts/ci/migration_upgrade.py 2>&1 | tee reports/migration-upgrade.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: migration-upgrade-${{ github.run_attempt }}
          path: reports/migration-upgrade.log
          if-no-files-found: error
  # Browser E2E jobs cover the reader, admin and real API boundary independently.
  reader-browser:
    name: Reader browser (${{ matrix.label }})
    needs: frontend-unit
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - suite: web
            label: Web
          - suite: chrome
            label: Chrome extension
          - suite: edge
            label: Edge extension
          - suite: partner-web
            label: Partner web
          - suite: partner-chrome
            label: Partner Chrome
          - suite: partner-edge
            label: Partner Edge
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      UV_NO_SYNC: "1"
      UV_NO_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Install
        run: |
          sh scripts/ci/python-bootstrap.sh . --editable --all-packages
          npm ci --ignore-scripts
      - name: Next.js compiler cache
        if: matrix.suite == 'web' || startsWith(matrix.suite, 'partner-')
        uses: abhi1693/actions/next-build-cache@4bc25a3100cbfbece517ddad161d59d13c029675 # v1.0.5
        with:
          app-directory: apps/web
          profile: reader-${{ matrix.suite }}-v1
      - name: Check
        env:
          READER_SUITE: ${{ matrix.suite }}
        run: |
          bash scripts/ci/reader-parity.sh "$READER_SUITE"
          mkdir -p reports
          printf '{"suite":"%s","sha":"%s","attempt":"%s","status":"success"}\n' \
            "$READER_SUITE" "$GITHUB_SHA" "$GITHUB_RUN_ATTEMPT" > reports/reader-parity-result.json
      - name: Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reader-parity-${{ matrix.suite }}-${{ github.run_attempt }}
          path: |
            reports
            apps/extensions/dist/*.png
            apps/extensions/dist/**/*-*.png
          if-no-files-found: error
          retention-days: 14
  reader-parity:
    name: Reader browser gate
    needs: reader-browser
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Download web reports
        if: always() && !cancelled()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reader-parity-web-${{ github.run_attempt }}
          path: reader-reports/web
      - name: Download chrome reports
        if: always() && !cancelled()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reader-parity-chrome-${{ github.run_attempt }}
          path: reader-reports/chrome
      - name: Download edge reports
        if: always() && !cancelled()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reader-parity-edge-${{ github.run_attempt }}
          path: reader-reports/edge
      - name: Download partner-web reports
        if: always() && !cancelled()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reader-parity-partner-web-${{ github.run_attempt }}
          path: reader-reports/partner-web
      - name: Download partner-chrome reports
        if: always() && !cancelled()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reader-parity-partner-chrome-${{ github.run_attempt }}
          path: reader-reports/partner-chrome
      - name: Download partner-edge reports
        if: always() && !cancelled()
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reader-parity-partner-edge-${{ github.run_attempt }}
          path: reader-reports/partner-edge
      - name: Require all reader suites
        if: always() && !cancelled()
        env:
          READER_RESULT: ${{ needs.reader-browser.result }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_ATTEMPT: ${{ github.run_attempt }}
        run: |
          status=0
          if [[ "$READER_RESULT" != success ]]; then
            echo "Reader worker result: $READER_RESULT"
            status=1
          fi
          for suite in web chrome edge partner-web partner-chrome partner-edge; do
            if ! jq -e --arg suite "$suite" --arg sha "$SOURCE_SHA" --arg attempt "$SOURCE_ATTEMPT" \
              '.suite == $suite and .sha == $sha and .attempt == $attempt and .status == "success"' \
              "reader-reports/$suite/reports/reader-parity-result.json"; then
              echo "Missing or unsuccessful current-source report: $suite"
              status=1
            fi
          done
          # Each selected worker proves all three callers on its SAME live gateway.
          for runtime in web chrome edge; do
            if ! jq -e --arg runtime "$runtime" --arg sha "$SOURCE_SHA" --arg attempt "$SOURCE_ATTEMPT" '
              {web: "203.0.113.20", chrome: "203.0.113.30", edge: "203.0.113.40"} as $ips |
              ["/v1/partner-placements/query", "/v1/partner-tracking/events"] as $paths |
              def proofs($ip): . == {($paths[0]): [$ip], ($paths[1]): [$ip]};
              .version == 1 and .source_sha == $sha and .attempt == $attempt and
              .completed == true and .full_runtime_count == 1 and
              (.gateway_process_id | type == "number" and . > 0 and floor == .) and
              .caller_ips == [$ips.web, $ips.chrome, $ips.edge] and
              (.caller_probes | map(.caller) == ["web", "chrome", "edge"]) and
              all(.caller_probes[]; .caller as $caller | .caller_proofs | proofs($ips[$caller])) and
              (.full_runtime_checks | length == 1) and
              .full_runtime_checks[0].runtime == $runtime and
              (.full_runtime_checks[0].caller_proofs | proofs($ips[$runtime])) and
              .full_runtime_checks[0].checkpoints == [
                "history-isolation", "feed-continuity", "mounted-expiry",
                "gateway-caller-proofs", "full-placement-matrix"
              ]
            ' "reader-reports/partner-$runtime/reports/partner-placements/runtime-proof-$runtime.json"; then
              echo "Missing or incomplete same-gateway partner proof: $runtime"
              status=1
            fi
          done
          mkdir -p reports/accessibility
          for surface in web chrome edge; do
            if ! cp -R -- "reader-reports/$surface/reports/accessibility/$surface" \
              reports/accessibility/; then
              status=1
            fi
          done
          exit "$status"
      - name: Summary
        if: always() && !cancelled()
        run: node scripts/ci/accessibility-report.mjs
      - name: Reports
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reader-parity-${{ github.run_attempt }}
          path: |
            reader-reports
            reports/accessibility
          if-no-files-found: error
          retention-days: 14
  admin-browser:
    name: Admin browser tests
    needs: frontend-unit
    uses: abhi1693/actions/.github/workflows/node-ci.yml@bf8cd38aa8456310278ed96bfa83a3132f235df1 # v1.0.4
    with:
      checks: '["test"]'
      scripts: '{"test": "ci:admin-browser"}'
      timeout-minutes: 20
      runs-on: ubuntu-24.04
      node-version: "24"
      build-cache-paths: |
        apps/admin/.next/cache/turbopack
        apps/admin/.next/cache/webpack
        apps/admin/.next/cache/swc
        apps/admin/.next/cache/.tsbuildinfo
      build-cache-scope: next-admin-browser-v1
      project-env: '{"NEXT_TELEMETRY_DISABLED":"1"}'
      browser-results-path: reports
      test-results-name: admin-browser-${{ github.run_attempt }}
  partner-browser:
    name: Integration / Partner portal browser tests
    needs: frontend-unit
    uses: abhi1693/actions/.github/workflows/node-ci.yml@bf8cd38aa8456310278ed96bfa83a3132f235df1 # v1.0.4
    with:
      checks: '["test"]'
      scripts: '{"test": "ci:partner-browser"}'
      timeout-minutes: 20
      runs-on: ubuntu-24.04-arm
      node-version: "24"
      build-cache-paths: |
        apps/partner/.next/cache/turbopack
        apps/partner/.next/cache/webpack
        apps/partner/.next/cache/swc
        apps/partner/.next/cache/.tsbuildinfo
      build-cache-scope: next-partner-browser-v1
      project-env: '{"NEXT_TELEMETRY_DISABLED":"1"}'
      browser-results-path: reports/partner
      test-results-name: partner-browser-${{ github.run_attempt }}
  live-browser:
    name: Live API browser tests
    needs: [backend-unit, frontend-unit]
    uses: abhi1693/actions/.github/workflows/node-ci.yml@bf8cd38aa8456310278ed96bfa83a3132f235df1 # v1.0.4
    with:
      checks: '["test"]'
      scripts: '{"test": "ci:live-browser"}'
      timeout-minutes: 20
      runs-on: ubuntu-24.04
      node-version: "24"
      build-cache-paths: |
        apps/web/.next/cache/turbopack
        apps/web/.next/cache/webpack
        apps/web/.next/cache/swc
        apps/web/.next/cache/.tsbuildinfo
      build-cache-scope: next-live-browser-v1
      python-version: "3.12"
      uv-version: 0.13.1
      uv-sync-args: '["--all-packages"]'
      project-env: '{"NEXT_TELEMETRY_DISABLED":"1"}'
      browser-results-path: reports/live-browser
      test-results-name: live-browser-${{ github.run_attempt }}
  browser-budgets:
    name: Browser budgets
    needs: frontend-unit
    if: >-
      success() &&
      (github.event_name == 'pull_request' || github.event_name == 'merge_group' ||
       (github.event_name == 'push' && github.ref == 'refs/heads/master'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      coverage: ${{ steps.changes.outputs.needed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == push ]]; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            node scripts/ci/browser-performance-changes.mjs
          fi
      - name: Node
        if: steps.changes.outputs.needed == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          package-manager-cache: false
      - name: Dependencies
        if: steps.changes.outputs.needed == 'true'
        run: npm ci --ignore-scripts
      - name: Chromium
        if: steps.changes.outputs.needed == 'true'
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Next.js compiler cache
        if: steps.changes.outputs.needed == 'true'
        uses: abhi1693/actions/next-build-cache@4bc25a3100cbfbece517ddad161d59d13c029675 # v1.0.5
        with:
          app-directory: apps/web
          profile: browser-budgets-v1
      - name: Budgets
        if: steps.changes.outputs.needed == 'true'
        run: npm run ci:browser-budgets
      - name: Coverage
        if: always() && steps.changes.outputs.needed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-coverage-${{ github.run_attempt }}
          path: |
            reports/coverage/browser-budgets/lcov.info
            reports/coverage/browser-budgets/coverage-summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Reports
        if: always() && steps.changes.outputs.needed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-budgets-${{ github.run_attempt }}
          path: reports/browser-performance/
          if-no-files-found: error
          retention-days: 14
  browser-report:
    name: Browser report
    needs: browser-budgets
    if: >-
      always() && !cancelled() &&
      (needs.browser-budgets.outputs.coverage == 'true' || needs.browser-budgets.result == 'skipped') &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Reports are data; this job never checks out or executes PR code.
      - name: Download
        if: needs.browser-budgets.result != 'skipped'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: browser-budgets-${{ github.run_attempt }}
          path: report
      - name: Prepare
        id: prepare
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BUDGET_RESULT: ${{ needs.browser-budgets.result }}
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;
            const current = await github.rest.pulls.get({...context.repo, pull_number: pr.number});
            if (current.data.head.sha !== pr.head.sha) return;
            core.setOutput('current', 'true');
            const passed = process.env.BUDGET_RESULT === 'success';
            const skipped = process.env.BUDGET_RESULT === 'skipped';
            let summary;
            if (skipped) {
              summary = 'Browser budgets were unavailable for this commit.';
            } else {
              try {
                const file = 'report/summary.md';
                const stat = fs.lstatSync(file);
                if (!stat.isFile() || stat.size === 0 || stat.size > 50000) throw new Error('Invalid report');
                summary = fs.readFileSync(file, 'utf8');
                const pages = ['Latest', 'Article preview', 'Topics', 'Sources', 'Public profile', 'Leaderboard'];
                if (!summary.startsWith('# Browser budgets\n') ||
                    (passed && pages.some(page => !summary.includes(`| ${page} (`)))) throw new Error('Incomplete report');
              } catch {
                summary = 'Results unavailable. Inspect the browser job logs; missing results never count as a pass.';
                core.setFailed('Browser report is missing or invalid');
              }
            }
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const content = summary.replace(/^# Browser budgets\n+/, '');
            const measured = passed && summary.startsWith('# Browser budgets\n');
            let status = '❌ Measurement failed';
            if (skipped) status = '⏸️ Not measured';
            else if (measured) status = content.includes('**⚠️') ? '⚠️ Targets exceeded' : '✅ Targets met';
            const commit = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${pr.head.sha}`;
            const body = `### Lighthouse · ${status}\n\n${content}\n[Full reports and logs](${url}) · [${pr.head.sha.slice(0, 7)}](${commit}) · Attempt ${process.env.GITHUB_RUN_ATTEMPT}`;
            fs.writeFileSync('browser-comment.md', body);
      - name: Comment
        if: always() && !cancelled() && steps.prepare.outputs.current == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: browser-budgets
          path: browser-comment.md
          only_update: ${{ needs.browser-budgets.result == 'skipped' }}
  performance:
    name: PR performance
    needs: backend-unit
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/performance.yml
    permissions:
      contents: read
      pull-requests: write
  property:
    name: Properties
    needs: frontend-unit
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'merge_group' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    uses: ./.github/workflows/property.yml
    with:
      mode: pr
  security:
    name: Security checks
    needs: [backend-unit, frontend-unit]
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
  recovery:
    name: Recovery
    needs: backend-unit
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'merge_group' ||
      (github.event_name == 'push' && (github.ref_type == 'tag' || github.ref == 'refs/heads/master'))
    uses: ./.github/workflows/recovery.yml
    with:
      changes_only: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
  dast:
    name: ZAP
    needs: [backend-unit, frontend-unit]
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'merge_group' ||
      (github.event_name == 'push' && (github.ref_type == 'tag' || github.ref == 'refs/heads/master'))
    uses: ./.github/workflows/dast.yml
    with:
      mode: passive
      changes_only: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
  sonarqube:
    name: SonarQube
    needs:
      - security
      - python-unit
      - python-loadtest
      - python-integration
      - admin-web
      - partner-web
      - user-web
      - browser-budgets
      - dast
      - mutation
      - property
      - recovery
    # Fork PRs and Dependabot do not receive the analysis token.
    if: >-
      always() && !cancelled() &&
      needs.security.result == 'success' &&
      needs.python-unit.result == 'success' && needs.python-loadtest.result == 'success' &&
      needs.python-integration.result == 'success' &&
      needs.admin-web.result == 'success' && needs.partner-web.result == 'success' && needs.user-web.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download Python coverage from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-*-arm64-${{ github.run_attempt }}
          merge-multiple: true
          path: reports
      - name: Download reader and admin coverage from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-test-results-${{ github.run_attempt }}"
          merge-multiple: true
          path: reports
      - name: Security transport coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-coverage-${{ github.run_attempt }}
          path: reports/coverage/security
      - name: Browser coverage
        if: needs.browser-budgets.outputs.coverage == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: browser-coverage-${{ github.run_attempt }}
          path: reports/coverage/browser-budgets
      - name: ZAP coverage
        if: needs.dast.outputs.coverage == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: zap-coverage-${{ github.run_attempt }}
          path: reports/coverage/dast
      - name: Mutation coverage
        if: needs.mutation.outputs.coverage == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mutation-coverage-${{ github.run_attempt }}
          path: reports/coverage/mutation
      - name: Property coverage
        if: needs.property.outputs.coverage == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: property-coverage-${{ github.run_attempt }}
          path: reports/coverage/property
      - name: Recovery coverage
        if: needs.recovery.outputs.coverage == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: recovery-coverage-${{ github.run_attempt }}
          path: reports/coverage/recovery
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Set up Node.js for JavaScript and TypeScript analysis
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Combine coverage and resolve monorepo paths
        env:
          SECURITY_COVERAGE_REQUIRED: "true"
          BROWSER_COVERAGE_REQUIRED: ${{ needs.browser-budgets.outputs.coverage == 'true' }}
          DAST_COVERAGE_REQUIRED: ${{ needs.dast.outputs.coverage == 'true' }}
          MUTATION_COVERAGE_REQUIRED: ${{ needs.mutation.outputs.coverage == 'true' }}
          PROPERTY_COVERAGE_REQUIRED: ${{ needs.property.outputs.coverage == 'true' }}
          RECOVERY_COVERAGE_REQUIRED: ${{ needs.recovery.outputs.coverage == 'true' }}
        run: |
          uv sync --only-group coverage --no-install-workspace --locked --no-build
          uv run --no-sync --no-build python scripts/ci/sonar_coverage.py
      - name: Cache SonarQube analyzers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Analyze with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  backend-integration:
    name: Stage / Backend integration checks
    needs:
      [
        backend-unit,
        python-integration,
        migration-upgrade,
        api-compat,
        api-fuzz,
        recovery,
        performance,
      ]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - name: Require backend integration checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e --arg event "$EVENT_NAME" '
            ([.["backend-unit"], .["python-integration"], .["migration-upgrade"]]
             | all(.result == "success")) and
            (if $event == "pull_request" or $event == "merge_group"
             then .["api-compat"].result == "success" and .["api-fuzz"].result == "success"
             else .["api-compat"].result == "skipped" and .["api-fuzz"].result == "skipped" end) and
            (if $event == "pull_request" then .performance.result == "success"
             else .performance.result == "skipped" end) and
            (if $event == "pull_request" or $event == "merge_group" or $event == "push"
             then .recovery.result == "success" else .recovery.result == "skipped" end)'
  frontend-integration:
    name: Stage / Frontend integration checks
    needs:
      [
        frontend-unit,
        reader-parity,
        admin-browser,
        partner-browser,
        browser-budgets,
        property,
        mutation,
      ]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - name: Require frontend integration checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e --arg event "$EVENT_NAME" --arg ref_type "$REF_TYPE" '
            ([.["frontend-unit"], .["reader-parity"], .["admin-browser"], .["partner-browser"]]
             | all(.result == "success")) and
            (if $event == "pull_request" or $event == "merge_group" or ($event == "push" and $ref_type == "branch")
             then .["browser-budgets"].result == "success" and .property.result == "success" and .mutation.result == "success"
             else .["browser-budgets"].result == "skipped" and .property.result == "skipped" and .mutation.result == "skipped" end)'
  validation:
    name: Stage / Tests, security and analysis
    needs: [backend-integration, frontend-integration, live-browser, security, dast, sonarqube]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    steps:
      - name: Require validation before building images
        env:
          EVENT_NAME: ${{ github.event_name }}
          SONAR_EXPECTED: >-
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
                (github.event_name == 'pull_request' &&
                 github.event.pull_request.head.repo.full_name == github.repository &&
                 github.actor != 'dependabot[bot]') }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e --arg event "$EVENT_NAME" --arg sonar "$SONAR_EXPECTED" '
            ([.["backend-integration"], .["frontend-integration"], .["live-browser"], .security]
             | all(.result == "success")) and
            (if $event == "pull_request" or $event == "merge_group" or $event == "push"
             then .dast.result == "success" else .dast.result == "skipped" end) and
            (if $sonar == "true" then .sonarqube.result == "success"
             else .sonarqube.result == "skipped" end)'
  containers:
    name: ARM64 image checks
    needs: validation
    if: github.event_name != 'push' || github.ref_type != 'tag'
    uses: ./.github/workflows/containers.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      publish: false
  release-images:
    name: ARM64 release images
    needs:
      - validation
      - python-unit
      - python-loadtest
      - admin-web
      - partner-web
      - user-web
      - extensions
      - python-integration
      - migration-upgrade
      - reader-parity
      - admin-browser
      - live-browser
      - security
      - recovery
      - dast
    if: github.event_name == 'push' && github.ref_type == 'tag'
    uses: ./.github/workflows/containers.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      publish: ${{ github.actor != 'renovate[bot]' && github.event_name == 'push' && github.ref_type == 'tag' }}
  mutation:
    name: Mutation
    needs: frontend-unit
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'merge_group' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')
    uses: ./.github/workflows/mutation.yml
  required:
    name: CI required
    if: ${{ always() && !cancelled() }}
    needs:
      - python-lint
      - python-unit-shards
      - backend-unit
      - frontend-unit
      - backend-integration
      - frontend-integration
      - validation
      - python-unit
      - python-loadtest
      - coverage-report
      - admin-web
      - partner-web
      - user-web
      - extensions
      - api-compat
      - api-fuzz
      - python-integration
      - migration-upgrade
      - reader-parity
      - admin-browser
      - partner-browser
      - live-browser
      - security
      - dast
      - containers
      - release-images
      - performance
      - recovery
      - browser-budgets
      - browser-report
      - sonarqube
      - mutation
      - property
    runs-on: ubuntu-24.04
    steps:
      - name: Require every gate to succeed
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          COVERAGE_COMMENT_REQUIRED: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
          BROWSER_COMMENT_REQUIRED: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && (needs.browser-budgets.outputs.coverage == 'true' || needs.browser-budgets.result == 'skipped') }}
          SONAR_EXPECTED: >-
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
                (github.event_name == 'pull_request' &&
                 github.event.pull_request.head.repo.full_name == github.repository &&
                 github.actor != 'dependabot[bot]') }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e --arg event "$EVENT_NAME" --arg ref_type "$REF_TYPE" --arg comment "$COVERAGE_COMMENT_REQUIRED" --arg browser_comment "$BROWSER_COMMENT_REQUIRED" --arg sonar "$SONAR_EXPECTED" '
            ([.["python-lint"], .["python-unit-shards"], .["python-unit"], .["python-loadtest"],
              .["backend-unit"], .["frontend-unit"], .["backend-integration"], .["frontend-integration"], .validation,
              .["admin-web"], .["partner-web"], .["user-web"], .extensions,
              .["python-integration"], .["migration-upgrade"], .["reader-parity"],
              .["admin-browser"], .["partner-browser"], .["live-browser"], .security]
             | all(.result == "success")) and
            (if $event == "push" and $ref_type == "tag"
             then .["release-images"].result == "success" and .containers.result == "skipped"
             else .containers.result == "success" and .["release-images"].result == "skipped" end) and
            (if $event == "pull_request" or $event == "merge_group" or $event == "push"
             then .recovery.result == "success" else .recovery.result == "skipped" end) and
            (if $event == "pull_request" then .performance.result == "success"
             else .performance.result == "skipped" end) and
            (if $event == "pull_request" or $event == "merge_group"
             then .["api-compat"].result == "success" and .["api-fuzz"].result == "success"
             else .["api-compat"].result == "skipped" and .["api-fuzz"].result == "skipped" end) and
            (if $event == "pull_request" or $event == "merge_group" or ($event == "push" and $ref_type == "branch")
             then .mutation.result == "success" and .property.result == "success"
             else .mutation.result == "skipped" and .property.result == "skipped" end) and
            (if $event == "pull_request" or $event == "merge_group" or ($event == "push" and $ref_type == "branch")
             then .["browser-budgets"].result == "success"
             else .["browser-budgets"].result == "skipped" end) and
            (if $event == "pull_request" or $event == "merge_group" or $event == "push"
             then .dast.result == "success" else .dast.result == "skipped" end) and
            (if $comment == "true" then .["coverage-report"].result == "success"
             else .["coverage-report"].result == "skipped" end) and
            (if $browser_comment == "true" then .["browser-report"].result == "success"
             else .["browser-report"].result == "skipped" end) and
            (if $sonar == "true" then .sonarqube.result == "success"
             else .sonarqube.result == "skipped" end)'
