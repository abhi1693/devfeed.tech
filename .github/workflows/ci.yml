name: CI
on:
  push:
    branches:
      - master
    tags:
      - v*
  pull_request: null
  merge_group: null
  workflow_dispatch: null
  schedule:
    - cron: 23 4 * * 1
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # Keep immutable release runs; only the newest branch/PR revision needs validation.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  # Unit tests, including each suite's static checks and builds.
  python-unit:
    uses: abhi1693/actions/.github/workflows/python-ci.yml@afba12afb85bf40be9328c92dc53b779f18d5c6d # v1.0.1
    with:
      runs-on: ubuntu-24.04-arm
      timeout-minutes: 30
      python-version: "3.12"
      enable-cache: true
      uv-version: 0.12.10
      sync-command: uv sync --all-packages --locked
      lint-command: bash .github/scripts/python-checks.sh
      test-command: bash scripts/ci/python-tests.sh unit
      test-results-path: reports/python-unit.xml
      test-results-name: python-unit-arm64-${{ github.run_attempt }}
    name: Unit / Python lint and tests (ARM64)
  admin-web:
    uses: abhi1693/actions/.github/workflows/node-ci.yml@afba12afb85bf40be9328c92dc53b779f18d5c6d # v1.0.1
    with:
      checks: '["generate", "lint", "test", "build"]'
      scripts: '{"generate": "admin:generate", "lint": "admin:lint", "test": "ci:admin-web-test", "build": "admin:build"}'
      timeout-minutes: 20
      runs-on: ubuntu-24.04-arm
      node-version: "24"
      project-env: '{"NEXT_TELEMETRY_DISABLED":"1","DEVFEED_DATABASE_URL":"postgresql+psycopg://ci@database.invalid/ci","DEVFEED_REDIS_URL":"redis://redis.invalid/15"}'
      test-results-path: reports/admin.xml
      test-results-name: admin-test-results-${{ github.run_attempt }}
      python-version: "3.12"
      uv-version: 0.12.10
      uv-sync-args: '["--all-packages"]'
      generated-paths: '["apps/admin/openapi.json","apps/admin/src/lib/api/generated"]'
    name: Unit / Admin UI lint, tests and build
  user-web:
    uses: abhi1693/actions/.github/workflows/node-ci.yml@afba12afb85bf40be9328c92dc53b779f18d5c6d # v1.0.1
    with:
      checks: '["lint", "test", "build"]'
      scripts: '{"lint": "web:lint", "test": "ci:user-web-test", "build": "web:build"}'
      timeout-minutes: 15
      runs-on: ubuntu-24.04-arm
      node-version: "24"
      project-env: '{"NEXT_TELEMETRY_DISABLED":"1"}'
      test-results-path: reports/user.xml
      test-results-name: user-test-results-${{ github.run_attempt }}
    name: Unit / User UI lint, tests and build
  extensions:
    name: Unit / Browser extension types, tests and builds
    uses: abhi1693/actions/.github/workflows/node-ci.yml@afba12afb85bf40be9328c92dc53b779f18d5c6d # v1.0.1
    with:
      checks: '["lint", "test", "build"]'
      scripts: '{"lint": "extension:check", "test": "extension:test", "build": "extension:build:all"}'
      timeout-minutes: 10
      runs-on: ubuntu-24.04-arm
      node-version: "24"
  # Integration tests run in parallel with isolated services for each shard.
  python-integration:
    name: Integration / Python shard ${{ matrix.shard }} (ARM64)
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    uses: abhi1693/actions/.github/workflows/python-ci.yml@afba12afb85bf40be9328c92dc53b779f18d5c6d # v1.0.1
    with:
      runs-on: ubuntu-24.04-arm
      timeout-minutes: 20
      python-version: "3.12"
      enable-cache: true
      uv-version: 0.12.10
      sync-command: uv sync --all-packages --locked
      test-command: bash scripts/ci/python-tests.sh integration ${{ matrix.shard }} 3
      test-results-path: reports/python-integration-${{ matrix.shard }}.xml
      test-results-name: python-integration-arm64-${{ matrix.shard }}-${{ github.run_attempt }}
  # Check upgrades separately from tests that start with an empty current schema.
  migration-upgrade:
    name: Integration / Populated database upgrades
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.10"
          enable-cache: true
      - run: uv sync --all-packages --locked
      - name: Upgrade the previous release and populated legacy schemas
        shell: bash
        run: |
          mkdir -p reports
          uv run --locked python scripts/ci/migration_upgrade.py 2>&1 | tee reports/migration-upgrade.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: migration-upgrade-${{ github.run_attempt }}
          path: reports/migration-upgrade.log
          if-no-files-found: error
  # Browser E2E jobs cover the reader, admin and real API boundary independently.
  reader-parity:
    name: E2E / Reader in web, Chrome and Edge
    uses: abhi1693/actions/.github/workflows/node-ci.yml@afba12afb85bf40be9328c92dc53b779f18d5c6d # v1.0.1
    with:
      checks: '["test"]'
      scripts: '{"test": "ci:reader-parity"}'
      timeout-minutes: 20
      runs-on: ubuntu-24.04
      node-version: "24"
      python-version: "3.12"
      uv-version: 0.12.10
      uv-sync-args: '["--all-packages"]'
      project-env: '{"NEXT_TELEMETRY_DISABLED":"1"}'
      browser-results-path: reports
      test-results-name: reader-parity-${{ github.run_attempt }}
  admin-browser:
    name: E2E / Admin browser journeys
    uses: abhi1693/actions/.github/workflows/node-ci.yml@afba12afb85bf40be9328c92dc53b779f18d5c6d # v1.0.1
    with:
      checks: '["test"]'
      scripts: '{"test": "ci:admin-browser"}'
      timeout-minutes: 20
      runs-on: ubuntu-24.04
      node-version: "24"
      project-env: '{"NEXT_TELEMETRY_DISABLED":"1"}'
      browser-results-path: reports
      test-results-name: admin-browser-${{ github.run_attempt }}
  live-browser:
    name: E2E / Login and persistence through real APIs
    uses: abhi1693/actions/.github/workflows/node-ci.yml@afba12afb85bf40be9328c92dc53b779f18d5c6d # v1.0.1
    with:
      checks: '["test"]'
      scripts: '{"test": "ci:live-browser"}'
      timeout-minutes: 20
      runs-on: ubuntu-24.04
      node-version: "24"
      python-version: "3.12"
      uv-version: 0.12.10
      uv-sync-args: '["--all-packages"]'
      project-env: '{"NEXT_TELEMETRY_DISABLED":"1"}'
      browser-results-path: reports/live-browser
      test-results-name: live-browser-${{ github.run_attempt }}
  performance:
    name: PR performance
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/performance.yml
    permissions:
      contents: read
      pull-requests: write
  security:
    name: Security checks
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
  containers:
    name: ARM64 image checks
    if: github.event_name != 'push' || github.ref_type != 'tag'
    uses: ./.github/workflows/containers.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      publish: false
  release-images:
    name: ARM64 release images
    needs:
      - python-unit
      - admin-web
      - user-web
      - extensions
      - python-integration
      - migration-upgrade
      - reader-parity
      - admin-browser
      - live-browser
      - security
    if: github.event_name == 'push' && github.ref_type == 'tag'
    uses: ./.github/workflows/containers.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      publish:
        ${{ github.actor != 'renovate[bot]' && github.event_name == 'push' && github.ref_type == 'tag' }}
  required:
    name: CI required
    if: ${{ always() && !cancelled() }}
    needs:
      - python-unit
      - admin-web
      - user-web
      - extensions
      - python-integration
      - migration-upgrade
      - reader-parity
      - admin-browser
      - live-browser
      - security
      - containers
      - release-images
      - performance
    runs-on: ubuntu-24.04
    steps:
      - name: Require every gate to succeed
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e --arg event "$EVENT_NAME" --arg ref_type "$REF_TYPE" '
            ([.["python-unit"], .["admin-web"], .["user-web"], .extensions,
              .["python-integration"], .["migration-upgrade"], .["reader-parity"],
              .["admin-browser"], .["live-browser"], .security]
             | all(.result == "success")) and
            (if $event == "push" and $ref_type == "tag"
             then .["release-images"].result == "success" and .containers.result == "skipped"
             else .containers.result == "success" and .["release-images"].result == "skipped" end) and
            (if $event == "pull_request" then .performance.result == "success"
             else .performance.result == "skipped" end)'
