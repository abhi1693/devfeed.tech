name: CI
on:
  push:
    branches:
      - master
    tags:
      - v*
  pull_request: null
  merge_group: null
  workflow_dispatch: null
  schedule:
    - cron: 23 4 * * 1
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  # Keep immutable release runs; only the newest branch/PR revision needs validation.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  # Unit tests, including each suite's static checks and builds.
  python-unit:
    uses: abhi1693/actions/.github/workflows/python-ci.yml@afba12afb85bf40be9328c92dc53b779f18d5c6d # v1.0.1
    with:
      runs-on: ubuntu-24.04-arm
      timeout-minutes: 30
      python-version: "3.12"
      node-version: "24"
      enable-cache: true
      uv-version: 0.12.10
      sync-command: uv sync --all-packages --locked
      lint-command: bash .github/scripts/python-checks.sh
      test-command: bash scripts/ci/python-tests.sh unit
      test-results-path: |
        reports/python-unit.xml
        reports/coverage/
      test-results-name: python-unit-arm64-${{ github.run_attempt }}
    name: Unit / Python lint and tests (ARM64)
  coverage-report:
    name: Report / Backend unit coverage PR comment
    needs: python-unit
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # No checkout: downloaded reports are data, never executable code.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: python-unit-arm64-*
          path: report
          merge-multiple: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          UNIT_RESULT: ${{ needs.python-unit.result }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- devfeed-backend-unit-coverage -->';
            const pr = context.payload.pull_request;
            const current = await github.rest.pulls.get({...context.repo, pull_number: pr.number});
            if (current.data.head.sha !== pr.head.sha) return;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const workspaces = [
              'apps/admin-api', 'apps/aggregator', 'apps/api', 'apps/article-enrichment-worker',
              'apps/cli', 'apps/images-worker', 'apps/mcp', 'apps/notifications',
              'apps/search-indexer', 'apps/source-discovery-worker', 'apps/user-api',
              'packages/core', 'packages/http'
            ];
            const counters = ['covered_lines', 'num_statements', 'covered_branches', 'num_branches'];
            const integer = value => Number.isSafeInteger(value) && value >= 0;
            const metrics = value => {
              if (!value || !counters.every(key => integer(value[key])) ||
                  value.covered_lines > value.num_statements || value.covered_branches > value.num_branches) {
                throw new Error('Invalid coverage counts');
              }
              const percent = (covered, total) => total ? 100 * covered / total : 100;
              return [percent(value.covered_lines, value.num_statements),
                percent(value.covered_branches, value.num_branches),
                percent(value.covered_lines + value.covered_branches, value.num_statements + value.num_branches)];
            };
            let summary, measured;
            try {
              // A report-only rerun reuses the successful unit job's earlier artifact.
              const attempt = Number(process.env.GITHUB_RUN_ATTEMPT);
              // download-artifact flattens a single match, even with merge-multiple: false.
              const flat = fs.existsSync('report/coverage/summary.json');
              const artifacts = flat ? [] : fs.readdirSync('report')
                .map(name => /^python-unit-arm64-(\d+)$/.exec(name))
                .filter(Boolean).map(match => Number(match[1]))
                .filter(value => integer(value) && value > 0 && value <= attempt);
              const artifactAttempt = Math.max(...artifacts);
              if (!flat && (!integer(artifactAttempt) ||
                  (process.env.UNIT_RESULT !== 'success' && artifactAttempt !== attempt))) {
                throw new Error('No matching unit artifact');
              }
              const file = flat ? 'report/coverage/summary.json' :
                `report/python-unit-arm64-${artifactAttempt}/coverage/summary.json`;
              const raw = fs.readFileSync(file, 'utf8');
              if (raw.length > 30000) throw new Error('Oversized coverage report');
              summary = JSON.parse(raw);
              if (!integer(summary.unit_attempt) || summary.unit_attempt < 1 ||
                  summary.unit_attempt > attempt || (!flat && summary.unit_attempt !== artifactAttempt) ||
                  (process.env.UNIT_RESULT !== 'success' && summary.unit_attempt !== attempt)) {
                throw new Error('Coverage belongs to a different unit attempt');
              }
              if (summary.schema !== 1 || summary.valid !== true ||
                  !['passed', 'failed'].includes(summary.status) ||
                  !Number.isFinite(summary.minimum) || summary.minimum <= 0 || summary.minimum > 100 ||
                  !integer(summary.unit_exit_code) || !integer(summary.source_files) || !summary.source_files ||
                  Object.keys(summary.packages).sort().join('|') !== workspaces.join('|')) {
                throw new Error('Incomplete coverage report');
              }
              measured = metrics(summary.totals);
              if (!summary.totals.num_statements) throw new Error('Empty coverage report');
              const sum = Object.fromEntries(counters.map(key => [key, 0]));
              for (const name of workspaces) {
                metrics(summary.packages[name]);
                for (const key of counters) sum[key] += summary.packages[name][key];
              }
              if (!counters.every(key => sum[key] === summary.totals[key])) throw new Error('Inconsistent totals');
              const tests = summary.tests;
              if (!tests || !['total', 'passed', 'failed', 'skipped'].every(key => integer(tests[key])) ||
                  !tests.total || tests.total !== tests.passed + tests.failed + tests.skipped) {
                throw new Error('Invalid unit test counts');
              }
            } catch {
              summary = null;
            }
            const lines = [marker, '### Backend unit coverage', ''];
            if (summary) {
              const tests = summary.tests;
              const passed = process.env.UNIT_RESULT === 'success' && summary.status === 'passed' &&
                summary.unit_exit_code === 0 && tests.failed === 0 && tests.skipped === 0 &&
                Number(measured[2].toFixed(2)) >= summary.minimum;
              lines.push(`**${passed ? 'PASS' : 'FAIL'}** · minimum combined coverage **${summary.minimum.toFixed(2)}%**.`, '',
                `Tests: ${tests.passed} passed, ${tests.failed} failed, ${tests.skipped} skipped. Source files: ${summary.source_files}.`, '',
                '| Workspace | Lines | Branches | Combined |', '| --- | ---: | ---: | ---: |');
              const row = (name, values) => `| ${name} | ${values.map(value => `${value.toFixed(2)}%`).join(' | ')} |`;
              lines.push(row('All backend code', measured));
              for (const name of workspaces) lines.push(row(name, metrics(summary.packages[name])));
              lines.push('', 'Unit coverage includes every backend workspace. PostgreSQL/Redis integration tests run separately.');
            } else {
              lines.push('**Coverage unavailable:** no valid unit coverage artifact could be loaded. Inspect the Python unit and coverage-report logs; this does not count as a passing coverage check.');
            }
            lines.push('', `Commit: ${pr.head.sha.slice(0, 12)} · [HTML, JSON, XML reports and job logs](${url}) · attempt ${process.env.GITHUB_RUN_ATTEMPT}`);
            const body = lines.join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number: pr.number});
            const previous = comments.find(comment => comment.user.type === 'Bot' && comment.body?.startsWith(marker));
            const latest = await github.rest.pulls.get({...context.repo, pull_number: pr.number});
            if (latest.data.head.sha !== pr.head.sha) return;
            if (previous) {
              await github.rest.issues.updateComment({...context.repo, comment_id: previous.id, body});
            } else {
              await github.rest.issues.createComment({...context.repo, issue_number: pr.number, body});
            }
            if (!summary) core.setFailed('Backend coverage artifact is missing or invalid');
  admin-web:
    uses: abhi1693/actions/.github/workflows/node-ci.yml@afba12afb85bf40be9328c92dc53b779f18d5c6d # v1.0.1
    with:
      checks: '["generate", "lint", "test", "build"]'
      scripts: '{"generate": "admin:generate", "lint": "admin:lint", "test": "ci:admin-web-test", "build": "admin:build"}'
      timeout-minutes: 20
      runs-on: ubuntu-24.04-arm
      node-version: "24"
      project-env: '{"NEXT_TELEMETRY_DISABLED":"1","DEVFEED_DATABASE_URL":"postgresql+psycopg://ci@database.invalid/ci","DEVFEED_REDIS_URL":"redis://redis.invalid/15"}'
      test-results-path: |
        reports/admin.xml
        reports/coverage/admin/lcov.info
      test-results-name: admin-test-results-${{ github.run_attempt }}
      python-version: "3.12"
      uv-version: 0.12.10
      uv-sync-args: '["--all-packages"]'
      generated-paths: '["apps/admin/openapi.json","apps/admin/src/lib/api/generated"]'
    name: Unit / Admin UI lint, tests and build
  user-web:
    uses: abhi1693/actions/.github/workflows/node-ci.yml@afba12afb85bf40be9328c92dc53b779f18d5c6d # v1.0.1
    with:
      checks: '["lint", "test", "build"]'
      scripts: '{"lint": "web:lint", "test": "ci:user-web-test", "build": "web:build"}'
      timeout-minutes: 15
      runs-on: ubuntu-24.04-arm
      node-version: "24"
      project-env: '{"NEXT_TELEMETRY_DISABLED":"1"}'
      test-results-path: |
        reports/user.xml
        reports/coverage/web/lcov.info
      test-results-name: user-test-results-${{ github.run_attempt }}
    name: Unit / User UI lint, tests and build
  extensions:
    name: Unit / Browser extension types, tests and builds
    uses: abhi1693/actions/.github/workflows/node-ci.yml@afba12afb85bf40be9328c92dc53b779f18d5c6d # v1.0.1
    with:
      checks: '["lint", "test", "build"]'
      scripts: '{"lint": "extension:check", "test": "extension:test", "build": "extension:build:all"}'
      timeout-minutes: 10
      runs-on: ubuntu-24.04-arm
      node-version: "24"
  # Integration tests run in parallel with isolated services for each shard.
  python-integration:
    name: Integration / Python shard ${{ matrix.shard }} (ARM64)
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    uses: abhi1693/actions/.github/workflows/python-ci.yml@afba12afb85bf40be9328c92dc53b779f18d5c6d # v1.0.1
    with:
      runs-on: ubuntu-24.04-arm
      timeout-minutes: 20
      python-version: "3.12"
      enable-cache: true
      uv-version: 0.12.10
      sync-command: uv sync --all-packages --locked
      test-command: bash scripts/ci/python-tests.sh integration ${{ matrix.shard }} 3
      test-results-path: |
        reports/python-integration-${{ matrix.shard }}.xml
        reports/coverage/python-integration-${{ matrix.shard }}/coverage.db
      test-results-name: python-integration-${{ matrix.shard }}-arm64-${{ github.run_attempt }}
  # Check upgrades separately from tests that start with an empty current schema.
  migration-upgrade:
    name: Integration / Populated database upgrades
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.10"
          enable-cache: true
      - run: uv sync --all-packages --locked
      - name: Upgrade the previous release and populated legacy schemas
        shell: bash
        run: |
          mkdir -p reports
          uv run --locked python scripts/ci/migration_upgrade.py 2>&1 | tee reports/migration-upgrade.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: migration-upgrade-${{ github.run_attempt }}
          path: reports/migration-upgrade.log
          if-no-files-found: error
  # Browser E2E jobs cover the reader, admin and real API boundary independently.
  reader-parity:
    name: E2E / Reader checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      UV_NO_SYNC: "1"
      UV_NO_BUILD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.10"
          enable-cache: true
      - name: Install
        run: |
          uv sync --all-packages --locked --no-install-workspace --no-build
          uv build --all-packages --wheel --no-build --out-dir "$RUNNER_TEMP/reader-wheels"
          uv pip install --no-build --no-deps "$RUNNER_TEMP"/reader-wheels/*.whl
          npm ci --ignore-scripts
      - name: Check
        run: npm run ci:reader-parity
      - name: Summary
        if: always()
        run: node scripts/ci/accessibility-report.mjs
      - name: Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reader-parity-${{ github.run_attempt }}
          path: |
            reports
            apps/extensions/dist/*.png
            apps/extensions/dist/**/*-*.png
          if-no-files-found: error
          retention-days: 14
  admin-browser:
    name: E2E / Admin browser journeys
    uses: abhi1693/actions/.github/workflows/node-ci.yml@afba12afb85bf40be9328c92dc53b779f18d5c6d # v1.0.1
    with:
      checks: '["test"]'
      scripts: '{"test": "ci:admin-browser"}'
      timeout-minutes: 20
      runs-on: ubuntu-24.04
      node-version: "24"
      project-env: '{"NEXT_TELEMETRY_DISABLED":"1"}'
      browser-results-path: reports
      test-results-name: admin-browser-${{ github.run_attempt }}
  live-browser:
    name: E2E / Login and persistence through real APIs
    uses: abhi1693/actions/.github/workflows/node-ci.yml@afba12afb85bf40be9328c92dc53b779f18d5c6d # v1.0.1
    with:
      checks: '["test"]'
      scripts: '{"test": "ci:live-browser"}'
      timeout-minutes: 20
      runs-on: ubuntu-24.04
      node-version: "24"
      python-version: "3.12"
      uv-version: 0.12.10
      uv-sync-args: '["--all-packages"]'
      project-env: '{"NEXT_TELEMETRY_DISABLED":"1"}'
      browser-results-path: reports/live-browser
      test-results-name: live-browser-${{ github.run_attempt }}
  performance:
    name: PR performance
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/performance.yml
    permissions:
      contents: read
      pull-requests: write
  security:
    name: Security checks
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
  sonarqube:
    name: SonarQube
    needs:
      - python-unit
      - python-integration
      - admin-web
      - user-web
    # Fork PRs and Dependabot do not receive the analysis token.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source and history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download Python coverage from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-*-arm64-${{ github.run_attempt }}
          merge-multiple: true
          path: reports
      - name: Download reader and admin coverage from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-test-results-${{ github.run_attempt }}"
          merge-multiple: true
          path: reports
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.10"
          enable-cache: true
      - name: Set up Node.js for JavaScript and TypeScript analysis
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Combine coverage and resolve monorepo paths
        run: |
          uv sync --only-group coverage --no-install-workspace --locked --no-build
          uv run --no-sync --no-build python scripts/ci/sonar_coverage.py
      - name: Cache SonarQube analyzers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-${{ runner.arch }}-v1
      - name: Analyze with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  containers:
    name: ARM64 image checks
    if: github.event_name != 'push' || github.ref_type != 'tag'
    uses: ./.github/workflows/containers.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      publish: false
  release-images:
    name: ARM64 release images
    needs:
      - python-unit
      - admin-web
      - user-web
      - extensions
      - python-integration
      - migration-upgrade
      - reader-parity
      - admin-browser
      - live-browser
      - security
    if: github.event_name == 'push' && github.ref_type == 'tag'
    uses: ./.github/workflows/containers.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      publish: ${{ github.actor != 'renovate[bot]' && github.event_name == 'push' && github.ref_type == 'tag' }}
  required:
    name: CI required
    if: ${{ always() && !cancelled() }}
    needs:
      - python-unit
      - coverage-report
      - admin-web
      - user-web
      - extensions
      - python-integration
      - migration-upgrade
      - reader-parity
      - admin-browser
      - live-browser
      - security
      - containers
      - release-images
      - performance
      - sonarqube
    runs-on: ubuntu-24.04
    steps:
      - name: Require every gate to succeed
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          COVERAGE_COMMENT_REQUIRED: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
          SONAR_EXPECTED: >-
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
                (github.event_name == 'pull_request' &&
                 github.event.pull_request.head.repo.full_name == github.repository &&
                 github.actor != 'dependabot[bot]') }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e --arg event "$EVENT_NAME" --arg ref_type "$REF_TYPE" --arg comment "$COVERAGE_COMMENT_REQUIRED" --arg sonar "$SONAR_EXPECTED" '
            ([.["python-unit"], .["admin-web"], .["user-web"], .extensions,
              .["python-integration"], .["migration-upgrade"], .["reader-parity"],
              .["admin-browser"], .["live-browser"], .security]
             | all(.result == "success")) and
            (if $event == "push" and $ref_type == "tag"
             then .["release-images"].result == "success" and .containers.result == "skipped"
             else .containers.result == "success" and .["release-images"].result == "skipped" end) and
            (if $event == "pull_request" then .performance.result == "success"
             else .performance.result == "skipped" end) and
            (if $comment == "true" then .["coverage-report"].result == "success"
             else .["coverage-report"].result == "skipped" end) and
            (if $sonar == "true" then .sonarqube.result == "success"
             else .sonarqube.result == "skipped" end)'
