name: CI
on:
  push:
    branches:
      - master
    tags:
      - v*
  pull_request: null
  merge_group: null
  workflow_dispatch: null
  schedule:
    - cron: 23 4 * * 1
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tests:
    name: Application tests
    uses: ./.github/workflows/tests.yml
  performance:
    name: PR performance
    needs:
      - tests
      - security
      - containers
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/performance.yml
    permissions:
      contents: read
      pull-requests: write
  security:
    name: Security checks
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
  containers:
    name: ARM64 release images
    needs:
      - tests
      - security
    uses: ./.github/workflows/containers.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      publish:
        ${{ github.actor != 'dependabot[bot]' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' &&
        github.ref_type == 'branch')) }}
  required:
    name: CI required
    if: ${{ always() && !cancelled() }}
    needs:
      - tests
      - security
      - containers
      - performance
    runs-on: ubuntu-24.04
    steps:
      - name: Require every gate to succeed
        env:
          EVENT_NAME: ${{ github.event_name }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e --arg event "$EVENT_NAME" '
            .tests.result == "success" and .security.result == "success" and
            .containers.result == "success" and
            (if $event == "pull_request" then .performance.result == "success"
             else .performance.result == "skipped" end)'
