name: Feed options scale comparison
on:
  pull_request:
    paths:
      - apps/api/src/feed.py
      - packages/core/src/publication.py
      - packages/core/src/models.py
      - packages/core/src/schemas.py
      - scripts/feed_options_benchmark.py
      - tests/feeds/test_feed_options.py
      - .github/workflows/feed-options-performance.yml
permissions:
  contents: read
jobs:
  measure:
    name: PostgreSQL 17 source facets at scale
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: benchmark
          POSTGRES_PASSWORD: benchmark
          POSTGRES_DB: feed_options_benchmark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U benchmark -d feed_options_benchmark_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Install benchmark environment
        run: sh scripts/ci/python-bootstrap.sh . --editable --all-packages
      - name: Compare fixed datasets and concurrent ingestion
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEVFEED_TEST_DATABASE_URL: postgresql+psycopg://benchmark:benchmark@127.0.0.1:5432/feed_options_benchmark_test
        run: >-
          uv run --locked --no-sync --no-build python scripts/feed_options_benchmark.py
          --baseline-ref "$BASE_SHA" --rows 2000 100000 1000000 --repeats 5
          --output reports/feed-options-benchmark --require-arm64
      - name: Publish measurement summary
        if: always()
        run: |
          if [ -f reports/feed-options-benchmark/summary.md ]; then
            cat reports/feed-options-benchmark/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: feed-options-scale-${{ github.run_attempt }}
          path: reports/feed-options-benchmark/
          if-no-files-found: error
          retention-days: 30
  report:
    name: Publish feed-options scale results
    needs: measure
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    concurrency:
      group: feed-options-scale-report-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      # No checkout: benchmark artifacts are read as data, never executed.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: feed-options-scale-${{ github.run_attempt }}
          path: report
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MEASUREMENT_RESULT: ${{ needs.measure.result }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- devfeed-feed-options-scale -->';
            const pr = context.payload.pull_request;
            const current = await github.rest.pulls.get({...context.repo, pull_number: pr.number});
            if (current.data.state !== 'open' || current.data.head.sha !== pr.head.sha) return;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commit = sha => `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${sha}`;
            const attempt = Number(process.env.GITHUB_RUN_ATTEMPT);
            const measurement = process.env.MEASUREMENT_RESULT;
            const read = (file, limit) => {
              const stat = fs.lstatSync(file);
              if (!stat.isFile() || stat.size > limit) throw new Error('Invalid report file');
              return fs.readFileSync(file, 'utf8');
            };
            let summary, complete = false;
            try {
              const result = JSON.parse(read('report/results.json', 5000000));
              if (result.candidate_sha !== pr.head.sha || result.baseline_sha !== pr.base.sha) {
                throw new Error('Benchmark belongs to different revisions');
              }
              summary = read('report/summary.md', 50000).trim();
              if (!summary) throw new Error('Empty benchmark summary');
              const cases = result.cases;
              const matrixComplete = Array.isArray(cases) && cases.length > 0 &&
                cases.every(row => row?.equivalent === true) &&
                (!Object.hasOwn(result, 'expected_cases') ||
                  (Number.isSafeInteger(result.expected_cases) &&
                    result.expected_cases > 0 && cases.length === result.expected_cases));
              complete = typeof result.completed_at === 'string' &&
                Number.isFinite(Date.parse(result.completed_at)) && matrixComplete;
            } catch (error) {
              core.warning(`Unable to load benchmark results: ${error.message}`);
              summary = null;
            }
            const passed = measurement === 'success' && complete && summary !== null;
            const status = passed ? 'COMPLETE' : summary ? 'PARTIAL / FAILED RUN' : 'RESULTS UNAVAILABLE';
            const lines = [marker,
              `<!-- devfeed-feed-options-scale-run:${context.runId}:${attempt} -->`,
              '### Feed-options scale comparison', '', `**${status}** · measurement job: **${measurement}**.`, '',
              `Baseline: [${pr.base.sha.slice(0, 12)}](${commit(pr.base.sha)}) · Candidate: [${pr.head.sha.slice(0, 12)}](${commit(pr.head.sha)})`, '',
              `[Full SQL plans, timing samples and job logs](${url}) · attempt ${attempt}`, ''];
            if (!passed) {
              lines.push(summary
                ? 'The run did not complete successfully. Results below are partial evidence and do not establish a passing full benchmark.'
                : 'No matching benchmark summary could be loaded. Inspect the measurement job and artifact logs; this is not a passing benchmark.', '');
            }
            if (summary) lines.push(summary);
            const body = lines.join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number: pr.number});
            const previous = comments.find(comment => comment.user.type === 'Bot' && comment.body?.startsWith(marker));
            const priorRun = previous?.body.match(/<!-- devfeed-feed-options-scale-run:(\d+):(\d+) -->/);
            if (priorRun && (Number(priorRun[1]) > Number(context.runId) ||
                (Number(priorRun[1]) === Number(context.runId) && Number(priorRun[2]) > attempt))) return;
            const latest = await github.rest.pulls.get({...context.repo, pull_number: pr.number});
            if (latest.data.state !== 'open' || latest.data.head.sha !== pr.head.sha) return;
            if (previous) {
              await github.rest.issues.updateComment({...context.repo, comment_id: previous.id, body});
            } else {
              await github.rest.issues.createComment({...context.repo, issue_number: pr.number, body});
            }
            if (measurement === 'success' && !passed) {
              core.setFailed('Successful benchmark job has missing or incomplete results');
            }
