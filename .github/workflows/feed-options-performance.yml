name: Feed options scale comparison
on:
  pull_request:
    paths:
      - apps/api/src/feed.py
      - packages/core/src/publication.py
      - packages/core/src/models.py
      - packages/core/src/schemas.py
      - scripts/feed_options_benchmark.py
      - tests/feeds/test_feed_options.py
      - .github/workflows/feed-options-performance.yml
permissions:
  contents: read
jobs:
  measure:
    name: PostgreSQL 17 source facets at scale
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: benchmark
          POSTGRES_PASSWORD: benchmark
          POSTGRES_DB: feed_options_benchmark_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U benchmark -d feed_options_benchmark_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.5"
          enable-cache: true
      - name: Install benchmark environment
        run: sh scripts/ci/python-bootstrap.sh . --editable --all-packages
      - name: Compare fixed datasets and concurrent ingestion
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEVFEED_TEST_DATABASE_URL: postgresql+psycopg://benchmark:benchmark@127.0.0.1:5432/feed_options_benchmark_test
        run: >-
          uv run --locked --no-sync --no-build python scripts/feed_options_benchmark.py
          --baseline-ref "$BASE_SHA" --rows 2000 100000 1000000 --repeats 5
          --output reports/feed-options-benchmark --require-arm64
      - name: Publish measurement summary
        if: always()
        run: |
          if [ -f reports/feed-options-benchmark/summary.md ]; then
            cat reports/feed-options-benchmark/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: feed-options-scale-${{ github.run_attempt }}
          path: reports/feed-options-benchmark/
          if-no-files-found: error
          retention-days: 30
