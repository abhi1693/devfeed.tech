name: Scheduler recheck scale
on:
  pull_request:
    paths:
      - .github/workflows/scheduler-recheck-scale.yml
      - scripts/profile_scheduler_rechecks.py
      - scripts/render_scheduler_recheck_report.cjs
      - tests/scheduler-recheck-report.test.cjs
      - tests/scheduler-scale-workflow.test.cjs
      - scripts/profile_read_models.py
      - packages/core/src/article_automation.py
      - packages/core/src/article_lifecycle.py
      - packages/core/src/read_models.py
      - apps/admin-api/src/pipeline_projection.py
      - migrations/versions/**
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: scheduler-recheck-scale-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    name: Scheduler rechecks / ${{ matrix.articles }} articles (ARM64 PostgreSQL 17)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - articles: 100000
            scale: "0.6666666666666666"
          - articles: 150000
            scale: "1"
    defaults:
      run:
        working-directory: candidate
    env:
      DEVFEED_TEST_DATABASE_URL: postgresql+psycopg://profile:profile@127.0.0.1:5432/scheduler_profile_test
      DEVFEED_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          persist-credentials: false
      - name: Check out comparison base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Test comparison report
        run: node --test tests/scheduler-recheck-report.test.cjs tests/scheduler-scale-workflow.test.cjs
      - name: Start isolated native services
        run: |
          test "$(uname -m)" = aarch64
          mkdir -p reports/scheduler-rechecks
          docker run -d --name scheduler-profile-postgres --shm-size=1g \
            -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=profile -e POSTGRES_PASSWORD=profile \
            -e POSTGRES_DB=scheduler_profile_test \
            postgres:17.11-alpine@sha256:eee6c6e1b0894fa4fe0075eb054af9fd1cf39a35321c2d4110626cfe506411fb \
            -c shared_preload_libraries=pg_stat_statements \
            -c pg_stat_statements.track=all -c track_io_timing=on \
            -c shared_buffers=512MB -c work_mem=8MB
          docker run -d --name scheduler-profile-redis -p 127.0.0.1:6379:6379 \
            redis:8-alpine@sha256:0bf6577d7774e592b29d093e3ac9390eb91e13d72c21e506afce736de5e0eeb0
          for attempt in $(seq 1 60); do
            if docker exec scheduler-profile-postgres pg_isready -U profile -d scheduler_profile_test &&
               docker exec scheduler-profile-redis redis-cli ping; then break; fi
            if [ "$attempt" -eq 60 ]; then exit 1; fi
            sleep 1
          done
          docker exec scheduler-profile-postgres uname -m
          test "$(docker exec scheduler-profile-postgres uname -m)" = aarch64
          docker exec scheduler-profile-postgres psql -U profile -d scheduler_profile_test \
            -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_stat_statements'
      - name: Install locked applications and identical measurement harness
        run: |
          uv sync --all-packages --locked
          cp scripts/profile_scheduler_rechecks.py ../baseline/scripts/profile_scheduler_rechecks.py
          uv sync --all-packages --locked --project ../baseline
      - name: Measure base application
        working-directory: baseline
        env:
          PROFILE_SCALE: ${{ matrix.scale }}
        run: |
          uv run --locked --no-sync python scripts/profile_scheduler_rechecks.py \
            --seed --scale "$PROFILE_SCALE" --ticks 5 --batch 50 --ingest-per-tick 10 \
            --history-bytes 8192 --label baseline \
            --output ../candidate/reports/scheduler-rechecks/baseline.json
      - name: Measure candidate and enforce bounded clock maintenance
        env:
          PROFILE_SCALE: ${{ matrix.scale }}
        run: |
          uv run --locked --no-sync python scripts/profile_scheduler_rechecks.py \
            --reuse-fixture --scale "$PROFILE_SCALE" --ticks 5 --batch 50 --ingest-per-tick 10 \
            --history-bytes 8192 --label candidate --assert-bounded \
            --output reports/scheduler-rechecks/candidate.json
      - name: Render measured comparison, including failures
        if: always()
        env:
          PROFILE_ARTICLES: ${{ matrix.articles }}
          PROFILE_RESULT: ${{ job.status }}
          PROFILE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PROFILE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          mkdir -p reports/scheduler-rechecks
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          context = {key: os.environ[key] for key in (
              'PROFILE_ARTICLES', 'PROFILE_RESULT', 'PROFILE_HEAD_SHA', 'PROFILE_BASE_SHA',
              'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT',
          )}
          Path('reports/scheduler-rechecks/context.json').write_text(json.dumps(context))
          PY
          node scripts/render_scheduler_recheck_report.cjs \
            --articles "$PROFILE_ARTICLES" --directory reports/scheduler-rechecks \
            --output reports/scheduler-rechecks/comment.md \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --head-sha "$PROFILE_HEAD_SHA" --base-sha "$PROFILE_BASE_SHA" \
            --conclusion "$PROFILE_RESULT"
      - name: Publish job summary
        if: always()
        run: |
          if [ -f reports/scheduler-rechecks/comment.md ]; then
            cat reports/scheduler-rechecks/comment.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload measurements and query plans
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scheduler-rechecks-${{ matrix.articles }}-arm64-${{ github.run_attempt }}
          path: candidate/reports/scheduler-rechecks/
          if-no-files-found: error
      - name: Remove disposable services
        if: always()
        run: docker rm -f scheduler-profile-postgres scheduler-profile-redis
  report:
    name: Report / Scheduler scale PR comment
    needs: compare
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # No checkout: benchmark artifacts are read as data, never executable code.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: scheduler-rechecks-*-arm64-*
          path: report
          merge-multiple: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SCALE_RESULT: ${{ needs.compare.result }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- devfeed-scheduler-recheck-scale -->';
            const pr = context.payload.pull_request;
            const current = await github.rest.pulls.get({...context.repo, pull_number: pr.number});
            if (current.data.head.sha !== pr.head.sha || current.data.base.sha !== pr.base.sha) return;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const result = process.env.SCALE_RESULT === 'success' ? 'PASS' : 'FAIL / incomplete';
            const statusLine = value => `**${value}** · native ARM64 · PostgreSQL 17.11 · 5 × 50 rechecks + 50 concurrent ingests per dataset.`;
            const sections = [marker, '### Scheduler recheck scale results', '', statusLine(result), '',
              '**Improvement:** positive = less work or time; negative = regression. Before and after use identical historical populations.', ''];
            const names = fs.existsSync('report') ? fs.readdirSync('report') : [];
            const flat = fs.existsSync('report/context.json');
            let missing = false;
            for (const articles of [100000, 150000]) {
              try {
                // A report-only or failed-job rerun may reuse a successful matrix member.
                // Always select its newest attempt in this run; never fall back past a bad report.
                const pattern = new RegExp(`^scheduler-rechecks-${articles}-arm64-(\\d+)$`);
                const matches = names.map(name => ({name, attempt: Number(pattern.exec(name)?.[1])}))
                  .filter(item => Number.isSafeInteger(item.attempt) && item.attempt > 0 &&
                    item.attempt <= Number(process.env.GITHUB_RUN_ATTEMPT))
                  .sort((a, b) => b.attempt - a.attempt);
                if (!flat && !matches.length) throw new Error('Missing artifact');
                const selected = flat ? null : matches[0];
                const root = flat ? 'report' : `report/${selected.name}`;
                const raw = fs.readFileSync(`${root}/context.json`, 'utf8');
                if (raw.length > 4000) throw new Error('Oversized context');
                const metadata = JSON.parse(raw);
                const artifactAttempt = flat ? Number(metadata.GITHUB_RUN_ATTEMPT) : selected.attempt;
                if (!Number.isSafeInteger(artifactAttempt) || artifactAttempt < 1 ||
                    artifactAttempt > Number(process.env.GITHUB_RUN_ATTEMPT)) throw new Error('Invalid attempt');
                if (metadata.PROFILE_HEAD_SHA !== pr.head.sha || metadata.PROFILE_BASE_SHA !== pr.base.sha ||
                    metadata.GITHUB_RUN_ID !== String(context.runId) ||
                    metadata.GITHUB_RUN_ATTEMPT !== String(artifactAttempt) ||
                    metadata.PROFILE_ARTICLES !== String(articles)) throw new Error('Wrong source or attempt');
                const summary = fs.readFileSync(`${root}/comment.md`, 'utf8');
                if (!summary.trim() || summary.length > 25000) throw new Error('Invalid summary');
                sections.push(summary, '');
              } catch {
                missing = true;
                sections.push(`#### ${articles.toLocaleString('en-US')} articles`, '',
                  '**Results unavailable:** the measurement or report failed. No speedup is claimed; inspect the linked job logs.', '');
              }
            }
            sections.push(`Head: ${pr.head.sha} · base: ${pr.base.sha}`, '',
              `[Measurements, query plans and job logs](${url}) · attempt ${process.env.GITHUB_RUN_ATTEMPT}`, '',
              'Synthetic warmed scheduler/publisher workload; not production p95. Production reference: 92,581 articles on 2026-10-24. No deployment is performed.');
            if (missing) sections[3] = statusLine('FAIL / incomplete');
            const body = sections.join('\n');
            await core.summary.addRaw(body).write();
            const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number: pr.number});
            const previous = comments.find(comment => comment.user.type === 'Bot' && comment.body?.startsWith(marker));
            const latest = await github.rest.pulls.get({...context.repo, pull_number: pr.number});
            if (latest.data.head.sha !== pr.head.sha || latest.data.base.sha !== pr.base.sha) return;
            if (previous) {
              await github.rest.issues.updateComment({...context.repo, comment_id: previous.id, body});
            } else {
              await github.rest.issues.createComment({...context.repo, issue_number: pr.number, body});
            }
            if (missing) core.setFailed('A scale measurement artifact is missing or invalid');
