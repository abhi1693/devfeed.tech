name: PR performance comparison
on:
  workflow_call: null
permissions:
  contents: read
jobs:
  select:
    name: Select changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.changes.outputs.needed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.12.1"
          package-manager-cache: false
      - name: Test selection
        run: node --test scripts/ci/api-performance.test.mjs
      - name: Select inputs
        id: changes
        run: node scripts/ci/api-performance-changes.mjs
  measure:
    name: Runner pair ${{ matrix.repeat }}
    needs: select
    if: github.event_name == 'pull_request' && needs.select.outputs.needed == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        repeat: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: |
            candidate/uv.lock
            baseline/uv.lock
          cache-suffix: performance-pair
      - name: Install the candidate harness
        run: sh candidate/scripts/ci/python-bootstrap.sh candidate --editable --all-packages --group loadtest
      - name: Install the baseline application
        run: sh candidate/scripts/ci/python-bootstrap.sh baseline --editable --all-packages
      - name: Test workload phases and latency histogram precision
        run: candidate/.venv/bin/python -m unittest discover -s candidate/loadtests -p 'test_*.py'
      - name: Run one runner pair
        env:
          PAIR_REPEAT: ${{ matrix.repeat }}
        run: python3 candidate/scripts/ci/api-performance-pair.py --repeat "$PAIR_REPEAT"
      - name: Preserve incomplete samples
        if: always()
        env:
          PAIR_REPEAT: ${{ matrix.repeat }}
        run: python3 candidate/scripts/ci/api-performance-pair.py --repeat "$PAIR_REPEAT" --preserve-only
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: perf-sample-pair-${{ matrix.repeat }}-${{ github.run_attempt }}
          path: reports/performance/
          if-no-files-found: error
          retention-days: 30
  compare:
    name: Compare six samples from three runners
    needs: [select, measure]
    if: always() && !cancelled() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate selection
        env:
          SELECT_RESULT: ${{ needs.select.result }}
          MEASURE_NEEDED: ${{ needs.select.outputs.needed }}
        run: |
          mkdir -p reports/performance
          if [[ "$SELECT_RESULT" != success || ( "$MEASURE_NEEDED" != true && "$MEASURE_NEEDED" != false ) ]]; then
            printf '%s\n' '**ERROR** — API performance selection failed. Inspect the Select changes job.' > reports/performance/summary.md
            cat reports/performance/summary.md >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.select.outputs.needed == 'true'
        continue-on-error: true
        with:
          pattern: perf-sample-*-${{ github.run_attempt }}
          path: reports/performance
          merge-multiple: true
      - name: Evaluate regression and noise gates
        if: needs.select.outputs.needed == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 loadtests/compare.py --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --output reports/performance
      - name: Report unchanged API
        if: needs.select.outputs.needed == 'false'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            printf '%s\n\n' '# PR reader API performance'
            printf 'Base %s → PR %s\n\n' "$BASE_SHA" "$HEAD_SHA"
            printf '%s\n' '**Not measured:** public API inputs are unchanged. This PR changes only recognized frontend or browser-test files.'
          } > reports/performance/summary.md
          printf '%s\n' '{"verdict":"NOT_MEASURED","reason":"public API inputs unchanged"}' > reports/performance/comparison.json
          cat reports/performance/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve report setup failures
        if: always()
        run: |
          mkdir -p reports/performance
          if [ ! -f reports/performance/summary.md ]; then
            echo '**ERROR** — comparison setup failed. Inspect the job logs.' > reports/performance/summary.md
            cat reports/performance/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pr-performance-${{ github.run_attempt }}
          path: reports/performance/
          if-no-files-found: error
          retention-days: 30
  report:
    name: Publish PR performance report
    needs: compare
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'renovate[bot]'
    uses: ./.github/workflows/performance-report.yml
    permissions:
      contents: read
      pull-requests: write
    with:
      section: reader-api
      artifact-name: pr-performance-${{ github.run_attempt }}
      measurement-result: ${{ needs.compare.result }}
