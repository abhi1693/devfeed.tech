name: PR performance comparison
on:
  workflow_call: null
permissions:
  contents: read
jobs:
  measure:
    name: Base and head sample ${{ matrix.repeat }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        repeat: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.10"
          enable-cache: true
          cache-dependency-glob: |
            candidate/uv.lock
            baseline/uv.lock
          cache-suffix: performance-pair-${{ matrix.repeat }}
      - name: Install the candidate harness
        run: uv sync --project candidate --all-packages --group loadtest --locked
      - name: Install the baseline application
        run: uv sync --project baseline --all-packages --locked
      - name: Run isolated base and head samples on the same runner
        env:
          REPEAT: ${{ matrix.repeat }}
        shell: bash
        run: |
          # Alternate order to limit warm-host bias; each run owns fresh services.
          revisions="base head"
          if (( REPEAT % 2 )); then revisions="head base"; fi
          result=0
          for revision in $revisions; do
            app_root=candidate
            if [ "$revision" = base ]; then app_root=baseline; fi
            destination="reports/performance/$revision-$REPEAT"
            mkdir -p "$destination"
            set +e
            candidate/.venv/bin/python candidate/scripts/load-test.py \
              --app-root "$app_root" --app-python "$app_root/.venv/bin/python" \
              --users 16 --spawn-rate 4 --seconds 60 --rows 1000 \
              --output "$destination" > "$destination/runner.log" 2>&1
            sample_result=$?
            set -e
            printf '%s\n' "$sample_result" > "$destination/exit-code.txt"
            if [ "$sample_result" -ne 0 ]; then result=1; fi
          done
          exit "$result"
      - name: Preserve incomplete samples
        if: always()
        env:
          REPEAT: ${{ matrix.repeat }}
        run: |
          for revision in base head; do
            destination="reports/performance/$revision-$REPEAT"
            mkdir -p "$destination"
            if [ ! -f "$destination/exit-code.txt" ]; then
              echo incomplete > "$destination/exit-code.txt"
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: perf-sample-pair-${{ matrix.repeat }}-${{ github.run_attempt }}
          path: reports/performance/
          if-no-files-found: error
          retention-days: 30
  compare:
    name: Compare three base and head pairs
    needs: measure
    if: always() && !cancelled() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: perf-sample-*-${{ github.run_attempt }}
          path: reports/performance
          merge-multiple: true
      - name: Evaluate regression and noise gates
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 loadtests/compare.py --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" \
            --output reports/performance
      - name: Preserve report setup failures
        if: always()
        run: |
          mkdir -p reports/performance
          if [ ! -f reports/performance/summary.md ]; then
            echo '**ERROR** — comparison setup failed. Inspect the job logs.' > reports/performance/summary.md
            cat reports/performance/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: pr-performance-${{ github.run_attempt }}
          path: reports/performance/
          if-no-files-found: error
          retention-days: 30
  report:
    name: Publish PR performance report
    needs: compare
    if: >-
      always() && !cancelled() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'renovate[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-performance-${{ github.run_attempt }}
          path: report
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- devfeed-pr-performance -->';
            const pr = context.payload.pull_request;
            const current = await github.rest.pulls.get({...context.repo, pull_number: pr.number});
            if (current.data.head.sha !== pr.head.sha) return;
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const summary = fs.readFileSync('report/summary.md', 'utf8').slice(0, 50000);
            const body = `${marker}\n${summary}\n[Full HTML/CSV reports and logs](${url}) · attempt ${process.env.GITHUB_RUN_ATTEMPT}`;
            const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number: pr.number});
            const previous = comments.find(c => c.user.type === 'Bot' && c.body.startsWith(marker));
            if (previous) {
              await github.rest.issues.updateComment({...context.repo, comment_id: previous.id, body});
            } else {
              await github.rest.issues.createComment({...context.repo, issue_number: pr.number, body});
            }
