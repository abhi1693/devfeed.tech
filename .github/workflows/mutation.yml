name: Mutation

on:
  workflow_call:
    outputs:
      coverage:
        value: ${{ jobs.test.outputs.coverage }}
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * *"

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    outputs:
      coverage: ${{ steps.coverage.outcome == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Policy tests
        run: >-
          node node_modules/c8/bin/c8.js --config scripts/ci/mutation-coverage.json
          node --test tests/mutation.test.mjs
      - name: Select
        id: select
        run: >-
          node node_modules/c8/bin/c8.js --config scripts/ci/mutation-coverage.json --clean=false
          node scripts/ci/mutation.mjs select
      - name: Mutate
        if: steps.select.outputs.groups != '[]'
        env:
          MUTATION_GROUPS: ${{ steps.select.outputs.groups }}
        run: >-
          node node_modules/c8/bin/c8.js --config scripts/ci/mutation-coverage.json --clean=false
          npm run ci:mutation
      - name: Coverage
        id: coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-coverage-${{ github.run_attempt }}
          path: |
            reports/coverage/mutation/lcov.info
            reports/coverage/mutation/coverage-summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Reports
        if: always() && steps.select.outputs.groups != '' && steps.select.outputs.groups != '[]'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation
          path: |
            reports/mutation/*/index.html
            reports/mutation/*/mutation.json
            reports/mutation/summary.*
          if-no-files-found: error
          retention-days: 7
