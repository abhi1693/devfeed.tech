name: Mutation

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "41 2 * * *"

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Policy tests
        run: node --test tests/mutation.test.mjs
      - name: Select
        id: select
        run: node scripts/ci/mutation.mjs select
      - name: Install
        if: steps.select.outputs.groups != '[]'
        run: npm ci
      - name: Mutate
        if: steps.select.outputs.groups != '[]'
        env:
          MUTATION_GROUPS: ${{ steps.select.outputs.groups }}
        run: npm run ci:mutation
      - name: Reports
        if: always() && steps.select.outputs.groups != '' && steps.select.outputs.groups != '[]'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation
          path: |
            reports/mutation/*/index.html
            reports/mutation/*/mutation.json
            reports/mutation/summary.*
          if-no-files-found: error
          retention-days: 7
