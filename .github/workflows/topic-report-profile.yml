name: Topic report history profile
on:
  pull_request:
    paths:
      - .github/workflows/topic-report-profile.yml
      - scripts/profile_topic_reports.py
      - scripts/ci/topic-report-comment.test.mjs
      - packages/core/src/topic_decision_metrics.py
      - packages/core/src/inference_metrics.py
      - migrations/versions/*_topic_decision_calls.py
permissions:
  contents: read
concurrency:
  group: topic-report-profile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  profile:
    name: PostgreSQL 17 / ${{ matrix.articles }} articles (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        articles: [100000, 300000]
    env:
      DEVFEED_REDIS_URL: redis://127.0.0.1:6379/15
      OTEL_SDK_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: baseline
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: candidate/uv.lock
      - name: Install profiling dependencies
        run: sh candidate/scripts/ci/python-bootstrap.sh candidate --editable --all-packages
      - name: Start the disposable database with random credentials
        run: |
          python3 - <<'PY'
          import os
          import secrets
          import subprocess
          import tempfile
          import time

          password = secrets.token_hex(32)
          database_url = (
              f"postgresql+psycopg://topic_profile:{password}"
              "@127.0.0.1:5432/topic_profile_test"
          )
          print(f"::add-mask::{password}", flush=True)
          print(f"::add-mask::{database_url}", flush=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"DEVFEED_DATABASE_URL={database_url}\n")
              environment.write(f"DEVFEED_TEST_DATABASE_URL={database_url}\n")
          with tempfile.NamedTemporaryFile(mode="w", encoding="utf-8", delete=False) as secret:
              secret.write("POSTGRES_USER=topic_profile\n")
              secret.write(f"POSTGRES_PASSWORD={password}\n")
              secret.write("POSTGRES_DB=topic_profile_test\n")
          try:
              subprocess.run(
                  [
                      "docker", "run", "--detach", "--name", "topic-report-postgres",
                      "--publish", "127.0.0.1:5432:5432", "--env-file", secret.name,
                      "postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe",
                  ],
                  check=True,
                  stdout=subprocess.DEVNULL,
              )
          finally:
              os.unlink(secret.name)
          for _ in range(60):
              ready = subprocess.run(
                  [
                      "docker", "exec", "topic-report-postgres", "pg_isready",
                      "-h", "127.0.0.1", "-U", "topic_profile", "-d", "topic_profile_test",
                  ],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              if ready.returncode == 0:
                  break
              time.sleep(2)
          else:
              raise RuntimeError("Disposable PostgreSQL did not become ready within 120 seconds")
          PY
      - name: Migrate the disposable database
        working-directory: candidate
        run: uv run --locked --no-sync --no-build alembic upgrade head
      - name: Verify native ARM64 and profile historical reports
        working-directory: candidate
        env:
          PROFILE_ARTICLES: ${{ matrix.articles }}
        run: |
          test "$(uname -m)" = aarch64
          PROFILE_GATE_ARGS=()
          if rg -q jsonb_array_elements ../baseline/packages/core/src/topic_decision_metrics.py; then
            PROFILE_GATE_ARGS+=(--require-improvement)
          fi
          uv run --locked --no-sync --no-build python -m scripts.profile_topic_reports \
            --baseline-root ../baseline --seed --articles "$PROFILE_ARTICLES" \
            --require-postgres-major 17 \
            "${PROFILE_GATE_ARGS[@]}" \
            --output reports/topic-reports.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: topic-reports-${{ matrix.articles }}-arm64-${{ github.run_attempt }}
          path: candidate/reports/
          if-no-files-found: error
          retention-days: 30
      - name: Remove the disposable database
        if: always()
        run: docker rm --force topic-report-postgres
  report-tests:
    name: Test topic profile summary
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26.12.1"
          package-manager-cache: false
      - run: node --test scripts/ci/topic-report-comment.test.mjs
  report:
    name: Publish topic profile summary
    needs: [profile, report-tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: write
    concurrency:
      group: topic-report-comment-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # No checkout: artifacts are parsed as data, never executed with write permissions.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: topic-reports-*-arm64-${{ github.run_attempt }}
          path: report
          merge-multiple: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PROFILE_RESULT: ${{ needs.profile.result }}
          TEST_RESULT: ${{ needs.report-tests.result }}
        with:
          script: |
            // BEGIN TOPIC REPORT COMMENT
            const fs = require('node:fs');
            const marker = '<!--devfeed-topic-report-history-->';
            const pr = context.payload.pull_request;
            const attempt = Number(process.env.GITHUB_RUN_ATTEMPT);
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const finite = value => typeof value === 'number' && Number.isFinite(value) && value >= 0;
            const integer = value => Number.isSafeInteger(value) && value >= 0;
            const ensure = (condition, message) => { if (!condition) throw new Error(message); };
            const fields = (value, names) => value && names.every(name => finite(value[name]));
            const operations = ['append', 'settle', 'correction', 'checkpoint'];
            const validDurable = condition => ensure(condition, 'Invalid committed-write evidence');
            const validateDurableStrategy = (row, repeats) => {
              validDurable(fields(row, ['median_ms', 'p95_ms', 'elapsed_seconds', 'application_thread_cpu_seconds']) &&
                row.p95_ms >= row.median_ms && row.committed === true &&
                integer(row.iterations) && row.iterations > 0 && row.iterations % repeats === 0 &&
                integer(row.committed_transactions) && row.committed_transactions === row.iterations * operations.length &&
                ['wal_bytes', 'wal_records', 'wal_full_page_images'].every(key => integer(row[key])));
              for (const operation of operations) {
                const sample = row.operations?.[operation];
                validDurable(fields(sample, ['median_ms', 'p95_ms']) && sample.p95_ms >= sample.median_ms &&
                  sample.samples === row.iterations);
              }
            };
            const durableProfiles = data => {
              if (!Object.hasOwn(data, 'durable_writes')) return null;
              const profiles = data.durable_writes;
              validDurable(Array.isArray(profiles) && profiles.length === 2 &&
                [5, 20].every(calls => profiles.filter(row => row.calls_per_workflow === calls).length === 1));
              for (const profile of profiles) {
                validDurable(integer(profile.repeats) && profile.repeats > 0 &&
                  Array.isArray(profile.paired_order) && profile.paired_order.length === profile.repeats &&
                  profile.paired_order.every((order, index) => JSON.stringify(order) ===
                    JSON.stringify(index % 2 === 0 ? ['legacy', 'facts'] : ['facts', 'legacy'])) &&
                  profile.source_states_equal === true && profile.projection_verified === true);
                for (const strategy of ['legacy', 'facts']) {
                  validateDurableStrategy(profile.strategies?.[strategy], profile.repeats);
                }
                validDurable(profile.strategies.legacy.iterations === profile.strategies.facts.iterations);
              }
              return profiles;
            };
            const writeResult = profiles => {
              if (!profiles) return 'UNVERIFIED';
              const higherLatency = profiles.some(profile => {
                const before = profile.strategies.legacy, after = profile.strategies.facts;
                return after.p95_ms > before.p95_ms || operations.some(operation =>
                  after.operations[operation].median_ms > before.operations[operation].median_ms);
              });
              return higherLatency ? 'HIGHER LATENCY OBSERVED' : 'NO HIGHER LATENCY IN THESE SAMPLES';
            };
            const read = articles => {
              const nested = `report/topic-reports-${articles}-arm64-${attempt}/topic-reports.json`;
              try {
                ensure(Number.isSafeInteger(attempt) && attempt > 0, 'Invalid run attempt');
                // download-artifact can flatten a single match even with merge-multiple false.
                const file = !fs.existsSync(nested) && fs.existsSync('report/topic-reports.json') ?
                  'report/topic-reports.json' : nested;
                ensure(fs.statSync(file).size <= 4 * 1024 * 1024, 'Oversized artifact');
                const raw = fs.readFileSync(file, 'utf8');
                const data = JSON.parse(raw);
                ensure(data.complete === true, 'Incomplete artifact');
                if (file === 'report/topic-reports.json') {
                  ensure(data.fixture?.articles === articles, 'Missing artifact for this fixture');
                }
                const serverVersion = data.server?.version?.match(/^PostgreSQL (17\.[0-9]+)\b/)?.[1];
                ensure(data.client_architecture === 'aarch64' &&
                  /^17[0-9]{4}$/.test(String(data.server?.version_num)) &&
                  serverVersion && data.server.version.includes(' on aarch64-') &&
                  data.server?.default_work_mem === '4MB', 'Invalid native PostgreSQL 17 identity');
                const fixture = data.fixture;
                ensure(fixture?.articles === articles &&
                  ['runs', 'calls', 'inference_calls'].every(key => integer(fixture[key])) &&
                  fixture.runs >= 5000 && fixture.calls >= fixture.runs &&
                  fixture.inference_calls >= articles, 'Invalid fixture cardinalities');
                ensure(Array.isArray(data.reports) && data.reports.length === 4 &&
                  [1, 7, 30, 90].every(days => data.reports.filter(row =>
                    row.days === days && row.exact_output_parity === true).length === 1),
                  'Missing exact report parity');
                for (const strategy of ['legacy', 'facts']) {
                  const row = data.concurrent?.[strategy];
                  ensure(fields(row, ['median_report_pair_ms', 'application_process_cpu_seconds']) &&
                    row.days === 90 && integer(row.report_workers) && row.report_workers > 0 &&
                    integer(row.report_pairs) && row.report_pairs > 0 &&
                    integer(row.writer_phase_overlap_pairs) &&
                    row.writer_phase_overlap_pairs <= row.report_pairs, 'Invalid concurrent report metrics');
                  ensure(fields(row.report_plan_totals, ['execution_ms', 'temp_written_blocks']),
                    'Invalid topic query metrics');
                  ensure(fields(row.ingestion, ['median_ms', 'p95_ms']) &&
                    integer(row.ingestion.iterations) && row.ingestion.iterations > 0 &&
                    row.ingestion.committed === false, 'Invalid ingestion metrics');
                  const correction = data.correction_plans?.[strategy];
                  ensure(fields(correction, ['Execution Time', 'statement_wal_bytes']) &&
                    fields(correction.Plan, ['WAL FPI']), 'Invalid correction metrics');
                }
                ensure(fields(data.backfill_equivalent_plan, ['Execution Time']), 'Invalid backfill metrics');
                const before = data.concurrent.legacy, after = data.concurrent.facts;
                ensure(before.report_pairs === after.report_pairs &&
                  before.report_workers === after.report_workers &&
                  before.ingestion.iterations === after.ingestion.iterations, 'Unmatched workloads');
                const checks = {
                  report_runtime_lower: after.median_report_pair_ms < before.median_report_pair_ms,
                  topic_sql_runtime_lower: after.report_plan_totals.execution_ms < before.report_plan_totals.execution_ms,
                  topic_sql_zero_temp_writes: after.report_plan_totals.temp_written_blocks === 0,
                  all_reports_overlap_writer_phase: [before, after].every(row =>
                    row.writer_phase_overlap_pairs === row.report_pairs),
                };
                ensure(Object.entries(checks).every(([key, value]) => data.improvement?.[key] === value),
                  'Inconsistent reported checks');
                return {articles, data, checks, serverVersion, durable: durableProfiles(data)};
              } catch (error) {
                const known = ['Incomplete artifact', 'Oversized artifact', 'Missing artifact for this fixture',
                  'Invalid native PostgreSQL 17 identity', 'Invalid fixture cardinalities',
                  'Missing exact report parity', 'Invalid concurrent report metrics',
                  'Invalid topic query metrics', 'Invalid ingestion metrics',
                  'Invalid correction metrics', 'Invalid backfill metrics',
                  'Unmatched workloads', 'Inconsistent reported checks', 'Invalid committed-write evidence'];
                return {articles, error: known.includes(error.message) ? error.message :
                  'Missing or invalid artifact for this run attempt'};
              }
            };
            const reports = [100000, 300000].map(read);
            const evidenceComplete = process.env.PROFILE_RESULT === 'success' &&
              process.env.TEST_RESULT === 'success' && reports.every(row => row.data);
            const readResult = evidenceComplete ?
              (reports.every(row => Object.values(row.checks).every(Boolean)) ? 'IMPROVED' : 'MIXED') :
              'UNVERIFIED';
            const durable = evidenceComplete && reports.every(row => row.durable) ?
              reports.flatMap(row => row.durable) : null;
            const number = (value, digits = 3) => value.toLocaleString('en-US', {
              minimumFractionDigits: digits, maximumFractionDigits: digits});
            const delta = (before, after, unit) => {
              const difference = after - before;
              const sign = difference < 0 ? '-' : '+';
              const text = `${sign}${number(Math.abs(difference))} ${unit}`;
              return difference > 0 ? `🔺 **${text}**` : text;
            };
            const improvement = (before, after) => {
              if (before === 0) return after === 0 ? '0.0%' : 'N/A (baseline zero)';
              const value = (before - after) / before * 100;
              const sign = value > 0 ? '+' : value < 0 ? '-' : '';
              return `${sign}${number(Math.abs(value), 1)}%`;
            };
            const lines = [marker, '### Topic report history', '',
              `Read result: **${readResult}**. Write result: **${writeResult(durable)}**.`, '',
              'Native ARM64 PostgreSQL 17 · 90-day concurrent reports.', '',
              'Delta = after - before. Improvement = (before - after) / before × 100: positive means less time/work; negative means slower or higher cost.', '',
              `Tested commit: \`${pr.head.sha}\` · [Workflow, artifacts and full plans](${url}) · attempt ${attempt}.`];
            if (process.env.PROFILE_RESULT !== 'success' || process.env.TEST_RESULT !== 'success') {
              lines.push('', `Native matrix: **${process.env.PROFILE_RESULT}**; summary tests: **${process.env.TEST_RESULT}**. Any available measurements below do not establish a passing run.`);
            }
            for (const report of reports) {
              lines.push('', `#### ${number(report.articles, 0)} articles`, '');
              if (report.error) {
                lines.push(`**Unavailable: ${report.error}.** This is not a passing measurement.`);
                continue;
              }
              const {data, checks} = report;
              const before = data.concurrent.legacy, after = data.concurrent.facts;
              lines.push(`PostgreSQL ${report.serverVersion} / ARM64 / work_mem 4MB. ` +
                `${number(data.fixture.runs, 0)} workflows · ${number(data.fixture.calls, 0)} topic calls · ${number(data.fixture.inference_calls, 0)} inference rows.`, '',
                '| Metric | Before | After | Delta (after - before) | Improvement |',
                '| --- | ---: | ---: | ---: | ---: |');
              const row = (label, first, last, unit) =>
                lines.push(`| ${label} | ${number(first)} ${unit} | ${number(last)} ${unit} | ${delta(first, last, unit)} | ${improvement(first, last)} |`);
              row('Report pair median', before.median_report_pair_ms, after.median_report_pair_ms, 'ms');
              row('Topic SQL replay total', before.report_plan_totals.execution_ms, after.report_plan_totals.execution_ms, 'ms');
              row('Topic SQL replay temp writes', before.report_plan_totals.temp_written_blocks / 128, after.report_plan_totals.temp_written_blocks / 128, 'MiB');
              row('Application CPU', before.application_process_cpu_seconds, after.application_process_cpu_seconds, 's');
              row('Rolled-back synthetic write median', before.ingestion.median_ms, after.ingestion.median_ms, 'ms');
              row('Rolled-back synthetic write p95', before.ingestion.p95_ms, after.ingestion.p95_ms, 'ms');
              const first = data.correction_plans.legacy, last = data.correction_plans.facts;
              row('Rolled-back correction', first['Execution Time'], last['Execution Time'], 'ms');
              row('WAL snapshot (FPI-sensitive)', first.statement_wal_bytes / 1024, last.statement_wal_bytes / 1024, 'KiB');
              lines.push('', `Exact output parity: **1 / 7 / 30 / 90 days passed**. Observed checks: **${Object.values(checks).filter(Boolean).length}/4**. ` +
                `${before.report_workers} report workers; ${before.report_pairs} report pairs total; ${before.ingestion.iterations} ingestion transactions per strategy. ` +
                `Equivalent backfill: ${number(data.backfill_equivalent_plan['Execution Time'] / 1000)} s. ` +
                `Correction full-page images: ${first.Plan['WAL FPI']} → ${last.Plan['WAL FPI']}.`, '',
                'The synthetic writes and correction above roll back and exclude commit latency; they cannot establish durable write throughput or overall production benefit.');
              if (!report.durable) {
                lines.push('', '**Write result: UNVERIFIED.** Committed append, settlement, correction and checkpoint costs are absent from this artifact.');
                continue;
              }
              lines.push('', `**Write result: ${writeResult(report.durable)}.** Committed topic operations follow.`);
              for (const profile of report.durable) {
                const initial = profile.strategies.legacy, final = profile.strategies.facts;
                lines.push('', `##### Committed topic writes: ${profile.calls_per_workflow} calls per workflow`, '',
                  `${profile.repeats} alternating repeats; ${number(initial.iterations, 0)} iterations and ` +
                  `${number(initial.committed_transactions, 0)} committed transactions per strategy. ` +
                  'Source histories match and normalized facts were verified.', '',
                  '| Metric | Before | After | Delta (after - before) | Improvement |',
                  '| --- | ---: | ---: | ---: | ---: |');
                for (const operation of operations) {
                  row(`${operation[0].toUpperCase()}${operation.slice(1)} median (commit included)`,
                    initial.operations[operation].median_ms, final.operations[operation].median_ms, 'ms');
                }
                row('All committed operations p95', initial.p95_ms, final.p95_ms, 'ms');
                row('Committed writes WAL snapshot', initial.wal_bytes / 1024, final.wal_bytes / 1024, 'KiB');
                lines.push('', `WAL full-page images: ${number(initial.wal_full_page_images, 0)} → ` +
                  `${number(final.wal_full_page_images, 0)}. WAL is a server-wide snapshot sensitive to full-page images and background activity; it is not a stable amplification ratio.`);
              }
            }
            lines.push('', 'Before = PR base; after = tested commit. 🔺 marks increased cost. ' +
              'Writers are paced and every transaction ends with rollback: their phase includes SQL and sleeps, not continuous SQL overlap or durable-commit throughput. ' +
              'CPU is application process CPU. Statement WAL uses a server-wide LSN delta including AFTER triggers/background activity; unequal full-page images prevent a stable WAL-amplification estimate. ' +
              'Topic SQL replay totals come from separate EXPLAIN executions after each timed report. Backfill excludes migration DDL and lock waits. ' +
              'Committed topic measurements include commit latency; they do not measure full ingestion-pipeline capacity or establish an overall production benefit.');
            const body = lines.join('\n');
            fs.mkdirSync('summary', {recursive: true});
            fs.writeFileSync('summary/topic-reports.md', body + '\n');
            await core.summary.addRaw(body).write();
            if (!evidenceComplete) core.setFailed('Topic benchmark evidence is incomplete or the native matrix failed');
            const sameRepository = pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`;
            if (!sameRepository) return;
            const current = await github.rest.pulls.get({...context.repo, pull_number: pr.number});
            if (current.data.head.sha !== pr.head.sha) return;
            const comments = await github.paginate(github.rest.issues.listComments,
              {...context.repo, issue_number: pr.number});
            const previous = comments.find(comment => comment.user?.type === 'Bot' &&
              comment.body?.startsWith(marker));
            const latest = await github.rest.pulls.get({...context.repo, pull_number: pr.number});
            if (latest.data.head.sha !== pr.head.sha) return;
            if (previous) {
              await github.rest.issues.updateComment({...context.repo, comment_id: previous.id, body});
            } else {
              await github.rest.issues.createComment({...context.repo, issue_number: pr.number, body});
            }
            // END TOPIC REPORT COMMENT
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: topic-report-summary-${{ github.run_attempt }}
          path: summary/
          if-no-files-found: error
          retention-days: 30
