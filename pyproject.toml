[project]
name = "devfeed"
version = "0.0.5"
description = "Developer news aggregation monorepo"
requires-python = ">=3.12"
dependencies = [
    "black>=26.5.1",
]

[tool.uv]
package = false

# Expose the mapped source packages through file links so type checkers and
# editors can resolve the same devfeed_* namespaces as installed wheels.
[tool.uv.config-settings-package]
devfeed-api = { editable_mode = "strict" }
devfeed-admin-api = { editable_mode = "strict" }
devfeed-user-api = { editable_mode = "strict" }
devfeed-notifications = { editable_mode = "strict" }
devfeed-aggregator = { editable_mode = "strict" }
devfeed-cli = { editable_mode = "strict" }
devfeed-core = { editable_mode = "strict" }
devfeed-http = { editable_mode = "strict" }

[tool.uv.workspace]
members = ["apps/api", "apps/admin-api", "apps/user-api", "apps/aggregator", "apps/notifications", "apps/cli", "packages/core", "packages/http"]

[tool.uv.sources]
devfeed-core = { workspace = true }
devfeed-http = { workspace = true }
devfeed-api = { workspace = true }
devfeed-admin-api = { workspace = true }
devfeed-user-api = { workspace = true }
devfeed-notifications = { workspace = true }
devfeed-aggregator = { workspace = true }
devfeed-cli = { workspace = true }

[dependency-groups]
dev = [
  "devfeed-api",
  "devfeed-admin-api",
  "devfeed-user-api",
  "devfeed-aggregator",
  "devfeed-notifications",
  "devfeed-cli",
  "pytest>=8.3,<10",
  "httpx>=0.28,<1",
  "ruff>=0.12,<1",
  "mypy>=1.15,<3",
  "pre-commit>=4.3,<5",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC2"]

[tool.ruff.lint.per-file-ignores]
"apps/api/src/*.py" = ["B008"]
"apps/admin-api/src/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a dedicated PostgreSQL database and Redis"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
packages = ["devfeed_http", "devfeed_core", "devfeed_api", "devfeed_admin_api", "devfeed_user_api", "devfeed_aggregator", "devfeed_notifications", "devfeed_cli"]
check_untyped_defs = true
ignore_missing_imports = true
