[project]
name = "devfeed"
version = "0.0.51"
description = "Developer news aggregation monorepo"
requires-python = ">=3.12"
dependencies = [
    "black>=26.5.1",
]

[tool.uv]
package = false

# Expose the mapped source packages through file links so type checkers and
# editors can resolve the same devfeed_* namespaces as installed wheels.
[tool.uv.config-settings-package]
devfeed-api = { editable_mode = "strict" }
devfeed-mcp = { editable_mode = "strict" }
devfeed-admin-api = { editable_mode = "strict" }
devfeed-user-api = { editable_mode = "strict" }
devfeed-notifications = { editable_mode = "strict" }
devfeed-aggregator = { editable_mode = "strict" }
devfeed-cli = { editable_mode = "strict" }
devfeed-search-indexer = { editable_mode = "strict" }
devfeed-article-enrichment-worker = { editable_mode = "strict" }
devfeed-images-worker = { editable_mode = "strict" }
devfeed-source-discovery-worker = { editable_mode = "strict" }
devfeed-core = { editable_mode = "strict" }
devfeed-http = { editable_mode = "strict" }

[tool.uv.workspace]
members = [
  "apps/api",
  "apps/mcp",
  "apps/admin-api",
  "apps/user-api",
  "apps/aggregator",
  "apps/notifications",
  "apps/cli",
  "apps/search-indexer",
  "apps/article-enrichment-worker",
  "apps/images-worker",
  "apps/source-discovery-worker",
  "packages/core",
  "packages/http",
]

[tool.uv.sources]
devfeed-core = { workspace = true }
devfeed-http = { workspace = true }
devfeed-api = { workspace = true }
devfeed-mcp = { workspace = true }
devfeed-admin-api = { workspace = true }
devfeed-user-api = { workspace = true }
devfeed-notifications = { workspace = true }
devfeed-aggregator = { workspace = true }
devfeed-cli = { workspace = true }
devfeed-search-indexer = { workspace = true }
devfeed-article-enrichment-worker = { workspace = true }
devfeed-images-worker = { workspace = true }
devfeed-source-discovery-worker = { workspace = true }

[dependency-groups]
coverage = ["coverage[toml]>=7.16.2,<8"]
dev = [
  { include-group = "coverage" },
  "devfeed-api",
  "devfeed-mcp",
  "devfeed-admin-api",
  "devfeed-user-api",
  "devfeed-aggregator[all-workers]",
  "devfeed-notifications",
  "devfeed-cli",
  "devfeed-article-enrichment-worker",
  "devfeed-images-worker",
  "devfeed-source-discovery-worker",
  "pytest>=8.3,<10",
  "httpx>=0.28,<1",
  "ruff>=0.12,<1",
  "mypy>=1.15,<3",
  "pre-commit>=4.3,<5",
  "jsonschema>=4.23,<5",
  "testcontainers>=4.10,<5",
  "pytest-cov>=7,<8",
]
fuzz = [
    "schemathesis==4.29.2",
]
loadtest = [
    "locust==2.46.6",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC2"]

[tool.ruff.lint.per-file-ignores]
"apps/api/src/*.py" = ["B008"]
"apps/admin-api/src/*.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: requires a dedicated PostgreSQL database and Redis",
  "failure_recovery: opt-in owned network faults, run by the recovery workflow",
]

[tool.coverage.run]
branch = true
relative_files = true
data_file = "reports/coverage/.coverage-unit"
source = [
  "packages/core/src",
  "packages/http/src",
  "apps/api/src",
  "apps/admin-api/src",
  "apps/user-api/src",
  "apps/mcp/src",
  "apps/aggregator/src",
  "apps/notifications/src",
  "apps/cli/src",
  "apps/search-indexer/src",
  "apps/article-enrichment-worker/src",
  "apps/images-worker/src",
  "apps/source-discovery-worker/src",
]

[tool.coverage.report]
fail_under = 67.60
precision = 2
show_missing = true

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
packages = [
  "devfeed_http",
  "devfeed_core",
  "devfeed_api",
  "devfeed_mcp",
  "devfeed_admin_api",
  "devfeed_user_api",
  "devfeed_aggregator",
  "devfeed_notifications",
  "devfeed_cli",
  "devfeed_search_indexer",
  "devfeed_article_enrichment_worker",
  "devfeed_images_worker",
  "devfeed_source_discovery_worker",
]
check_untyped_defs = true
ignore_missing_imports = true
